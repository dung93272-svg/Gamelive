body{font-family:'Nunito',sans-serif;background:#2b2d42;color:#eaeaea;min-height:100vh;padding:8px;display:flex;justify-content:center;overflow-x:hidden}
.game{width:100%;max-width:1050px;background:#1e2235;border-radius:20px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

.tag.k{background:#f472b6;color:#831843}.tag.sv{background:#64748b;font-size:10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:6px;margin-bottom:8px}
.stat{background:#2d3748;border-radius:12px;padding:6px 10px;border:2px solid #000}
.stat .lbl{font-size:11px;color:#cbd5e1;display:flex;justify-content:space-between;font-weight:bold}
.bar{height:6px;background:#1a202c;border-radius:4px;margin-top:4px;overflow:hidden;border:1px solid #000}
.fill{height:100%;transition:.4s;border-radius:4px}
#worldWrap{position:relative;background:#1a202c;border-radius:16px;overflow:hidden;margin-bottom:8px;border:4px solid #000;box-shadow:inset 0 0 20px rgba(0,0,0,.5)}
#world{display:block;width:100%;height:auto;cursor:pointer;touch-action:none}
#hud{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;pointer-events:none;gap:6px}
#locName{background:#fff;color:#000;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:900;border:3px solid #000;box-shadow:2px 2px 0 #000}
#timeHud{background:#fff;color:#000;padding:4px 12px;border-radius:20px;font-size:13px;font-weight:900;border:3px solid #000;box-shadow:2px 2px 0 #000;font-variant-numeric:tabular-nums}
#bubble{position:absolute;top:-40px;left:50%;transform:translateX(-50%);background:#fff;border:4px solid #000;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:900;color:#000;opacity:0;transition:opacity .3s;white-space:nowrap;box-shadow:3px 3px 0 #000}
#bubble.on{opacity:1}
.loc-menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:8px}
.loc-btn{background:#fff;border:3px solid #000;border-radius:12px;padding:8px;font-family:inherit;font-weight:900;font-size:11px;color:#000;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s;box-shadow:3px 3px 0 #000}
.loc-btn:hover{transform:translateY(-2px);box-shadow:5px 5px 0 #000}
.loc-btn .em{font-size:20px}
.loc-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.act-panel{background:#2d3748;border-radius:16px;padding:12px;border:3px solid #000;margin-bottom:8px;display:none}
.act-panel.on{display:block}
.act-panel h3{font-size:14px;font-weight:900;color:#fff;margin-bottom:8px;display:flex;align-items:center;gap:6px;text-shadow:2px 2px 0 #000}
.act-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.act-btn{background:#fff;border:3px solid #000;border-radius:12px;padding:8px;font-family:inherit;text-align:left;cursor:pointer;transition:.15s;box-shadow:3px 3px 0 #000}
.act-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:5px 5px 0 #000}
.act-btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.act-btn .nm{font-weight:900;font-size:12px;color:#000;display:block}
.act-btn .info{font-size:10px;color:#4a5568;font-weight:bold;margin-top:3px;display:block}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:700px){.panels{grid-template-columns:1fr}}
.panel{background:#2d3748;border-radius:16px;padding:12px;border:3px solid #000}
.panel h3{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#cbd5e1;margin-bottom:8px;font-weight:900}
.log{max-height:280px;overflow-y:auto;font-size:11px;font-weight:bold}

.inp{width:100%;padding:10px;background:#f7fafc;border:3px solid #000;color:#000;border-radius:10px;font-size:14px;font-family:inherit;font-weight:bold;margin-bottom:8px}

const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const fmt=v=>(v<0?'-':'')+Math.abs(Math.round(v)).toLocaleString('vi-VN')+'đ';
const pad2 = n => String(n).padStart(2, '0');
function getGameTime(){
  const total = Math.floor(S.gameMinutes);
  const day = Math.floor(total / (24*60)) + 1;
  const minOfDay = total % (24*60);
  const hour = Math.floor(minOfDay / 60);
  const minute = minOfDay % 60;
  const dayOfWeek = (day - 1) % 7;
  return {day, hour, minute, dayOfWeek, dw:['T2','T3','T4','T5','T6','T7','CN'][dayOfWeek], dwFull:['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'][dayOfWeek]};
}
function addLog(m,t='info'){ const tt = getGameTime(); S.log.unshift({m,t,dw:tt.dw,time:`${pad2(tt.hour)}:${pad2(tt.minute)}`}); if(S.log.length>80)S.log.pop(); }
function apply(k,v){ if(k==='money'){S.st.money=Math.round(S.st.money+v);return;} if(['skill','love','passion'].includes(k)){S.st[k]=clamp(S.st[k]+v);return;} S.st[k]=clamp(S.st[k]+v); }
function getPartner(){return S.partnerId?S.rels[S.partnerId]:null;}
function syncLove(){const p=getPartner();S.st.love=p?Math.max(0,p.love):0;}
function prestige(){ return Math.round(S.st.money/1200 + EDU_RANK[S.edu]*15 + S.st.skill*0.6); }

// ═══════════ CANVAS ═══════════
const canvas = document.getElementById('world');
const ctx = canvas.getContext('2d');
let camera = {x:0, y:0};

// ═══════════ DRAWING TILES ═══════════
function drawTile(x, y, type){
  const px = x*TILE, py = y*TILE;
  // Base grass with thick outline style
  if(type===0){
    ctx.fillStyle = '#a7f3d0'; ctx.fillRect(px,py,TILE,TILE);
    // Grass doodles
    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px+8,py+20); ctx.lineTo(px+8,py+24); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px+12,py+22); ctx.lineTo(px+12,py+26); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px+22,py+10); ctx.lineTo(px+22,py+14); ctx.stroke();
  } else if(type===1){
    ctx.fillStyle = '#fef3c7'; ctx.fillRect(px,py,TILE,TILE);
    // Path dots
    ctx.fillStyle = '#fcd34d';
    ctx.beginPath(); ctx.arc(px+10, py+10, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(px+22, py+20, 2, 0, Math.PI*2); ctx.fill();
  }
}

// ═══════════ DRAWING BUILDINGS (Thick Sticker Style) ═══════════
function drawBuilding(loc){
  const px = loc.x*TILE, py = loc.y*TILE, w = loc.w*TILE, h = loc.h*TILE;
  const bodyH = h * 0.55;
  const roofH = h - bodyH;
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(px+w/2, py+h-2, w*0.5, 4, 0, 0, Math.PI*2); ctx.fill();
  
  // Body
  ctx.fillStyle = loc.color;
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.roundRect(px+2, py+roofH, w-4, bodyH, 8); ctx.fill(); ctx.stroke();
  
  // Roof
  ctx.fillStyle = loc.roof;
  ctx.beginPath();
  ctx.moveTo(px-2, py+roofH+2);
  ctx.lineTo(px+w/2, py+2);
  ctx.lineTo(px+w+2, py+roofH+2);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  
  // Door
  const doorW = 16, doorH = 18;
  const dx = px + w/2 - doorW/2, dy = py + h - doorH - 4;
  ctx.fillStyle = loc.door;
  ctx.beginPath(); ctx.roundRect(dx, dy, doorW, doorH, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(dx+doorW-4, dy+doorH/2, 1.5, 0, Math.PI*2); ctx.fill();
  
  // Windows
  const winY = py + roofH + 8;
  const winW = 10, winH = 10;
  const winX1 = px + 8, winX2 = px + w - 18;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.roundRect(winX1, winY, winW, winH, 3); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.roundRect(winX2, winY, winW, winH, 3); ctx.fill(); ctx.stroke();
  
  // Emoji + Name
  ctx.font = 'bold 10px Nunito, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const nameW = ctx.measureText(loc.name).width + 20;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(px+w/2 - nameW/2, py+h-8, nameW, 14, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#000';
  ctx.fillText(loc.emoji+' '+loc.name, px+w/2, py+h-1);
}

// ═══════════ DRAWING TREES ═══════════
function drawTree(tree){
  const px = tree.x*TILE + TILE/2, py = tree.y*TILE + TILE - 4;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.ellipse(px, py+2, 12, 4, 0, 0, Math.PI*2); ctx.fill();
  // Trunk
  ctx.fillStyle = '#a16207';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.rect(px-4, py-14, 8, 14); ctx.fill(); ctx.stroke();
  // Canopy (Thick outline, cute shape)
  ctx.fillStyle = '#34d399';
  ctx.beginPath();
  ctx.arc(px, py-22, 14, 0, Math.PI*2);
  ctx.arc(px-10, py-18, 10, 0, Math.PI*2);
  ctx.arc(px+10, py-18, 10, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  // Highlight
  ctx.fillStyle = '#6ee7b7';
  ctx.beginPath(); ctx.arc(px-4, py-26, 5, 0, Math.PI*2); ctx.fill();
}

// ═══════════ DRAWING CHARACTER (Thick Sticker Style) ═══════════
function drawCharacter(px, py, facing, walking, frame, activity){
  const cx = px + TILE/2;
  const cy = py + TILE/2;
  const bob = walking ? Math.sin(frame*0.4)*2 : Math.sin(Date.now()/800)*0.5;
  const legSwing = walking ? Math.sin(frame*0.4)*3 : 0;
  const y = cy + bob;
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(cx, py+TILE-2, 12, 4, 0, 0, Math.PI*2); ctx.fill();
  
  // Body (chubby, white/light blue)
  ctx.fillStyle = '#f0f8ff';
  ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  
  // Legs
  ctx.beginPath();
  ctx.moveTo(cx-7, y+8);
  ctx.lineTo(cx-7, y+16+legSwing);
  ctx.moveTo(cx+7, y+8);
  ctx.lineTo(cx+7, y+16-legSwing);
  ctx.stroke();
  
  // Body shape (chubby)
  ctx.beginPath();
  ctx.ellipse(cx, y+2, 16, 14, 0, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  
  // Arms
  ctx.beginPath();
  // Left arm
  ctx.moveTo(cx-14, y-2);
  ctx.quadraticCurveTo(cx-20, y+2, cx-16, y+8);
  // Right arm
  ctx.moveTo(cx+14, y-2);
  ctx.quadraticCurveTo(cx+20, y+2, cx+16, y+8);
  ctx.stroke();
  
  // Head (big, rounded)
  const headY = y - 16;
  ctx.fillStyle = '#f0f8ff';
  ctx.beginPath();
  ctx.arc(cx, headY, 18, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  
  // Ears (cat-like, thick)
  // Left ear
  ctx.fillStyle = '#f0f8ff';
  ctx.beginPath();
  ctx.moveTo(cx-12, headY-12);
  ctx.lineTo(cx-16, headY-24);
  ctx.lineTo(cx-4, headY-16);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // Right ear
  ctx.beginPath();
  ctx.moveTo(cx+12, headY-12);
  ctx.lineTo(cx+16, headY-24);
  ctx.lineTo(cx+4, headY-16);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  
  // Face
  if(facing !== 'up'){
    // Eyes (simple dots, half closed style like the image)
    ctx.fillStyle = '#000';
    // Left eye
    ctx.beginPath();
    ctx.ellipse(cx-7, headY-2, 2.5, 1.5, 0, 0, Math.PI*2);
    ctx.fill();
    // Right eye
    ctx.beginPath();
    ctx.ellipse(cx+7, headY-2, 2.5, 1.5, 0, 0, Math.PI*2);
    ctx.fill();
    
    // Mouth (tiny)
    ctx.beginPath();
    ctx.arc(cx, headY+5, 2, 0, Math.PI);
    ctx.stroke();
    
    // Cheeks (small)
    ctx.fillStyle = '#fbcfe8';
    ctx.beginPath(); ctx.arc(cx-12, headY+3, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+12, headY+3, 3, 0, Math.PI*2); ctx.fill();
  }
  
  // Held item based on activity
  if(activity){
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    // Draw a cup / item in front of the character
    ctx.roundRect(cx+8, y+4, 12, 16, 3);
    ctx.fill(); ctx.stroke();
    // Straw
    ctx.beginPath();
    ctx.moveTo(cx+14, y+4);
    ctx.lineTo(cx+18, y-6);
    ctx.stroke();
    // Liquid color
    ctx.fillStyle = '#bef264';
    ctx.beginPath(); ctx.roundRect(cx+10, y+10, 8, 8, 2); ctx.fill();
    // Lid
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.roundRect(cx+7, y+2, 14, 4, 2); ctx.fill(); ctx.stroke();
  } else if(walking){
    // Walking animation doesn't hold item
  }
  
  // Sparkles around character (like the image)
  if(!walking && Math.random() < 0.1){
    ctx.fillStyle = '#facc15';
    ctx.beginPath(); ctx.arc(cx-20, headY-15, 2, 0, Math.PI*2); ctx.fill();
  }
}

// ═══════════ MAIN DRAW ═══════════
function drawWorld(t){
  const W = canvas.width, H = canvas.height;
  // Camera follows player
  const targetX = S.playerPos.x - W/2 + TILE/2;
  const targetY = S.playerPos.y - H/2 + TILE/2;
  camera.x += (targetX - camera.x) * 0.1;
  camera.y += (targetY - camera.y) * 0.1;
  camera.x = Math.max(0, Math.min(MAP_W*TILE - W, camera.x));
  camera.y = Math.max(0, Math.min(MAP_H*TILE - H, camera.y));
  
  // Sky background (soft gradient)
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#bae6fd');
  grad.addColorStop(1, '#f0f9ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  
  ctx.save();
  ctx.translate(-camera.x, -camera.y);
  
  // Tiles
  for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++) drawTile(x,y,MAP_DATA[y][x]);
  
  // Path
  if(S.moveTarget){
    const mx = S.moveTarget.x + TILE/2, my = S.moveTarget.y + TILE/2;
    ctx.strokeStyle = 'rgba(250,204,21,.8)';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(S.playerPos.x + TILE/2, S.playerPos.y + TILE/2);
    ctx.lineTo(mx, my);
    ctx.stroke();
    ctx.setLineDash([]);
    // Target marker
    ctx.fillStyle = '#facc15';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mx, my, 8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  }
  
  // Trees
  TREES.forEach(drawTree);
  
  // Buildings
  for(const loc of Object.values(LOCATIONS)) drawBuilding(loc);
  
  // Draw Player Character
  const isActing = _queuedActivity === null && S.moveTarget === null;
  drawCharacter(S.playerPos.x, S.playerPos.y, 'down', S.moveTarget !== null, playerFrame, isActing ? S.currentLoc : null);
  
  ctx.restore();
}

// ═══════════ PLAYER MOVEMENT (AUTO) ═══════════
let playerFrame = 0;
function updatePlayer(){
  if(!S.moveTarget){
    return;
  }
  const dx = S.moveTarget.x - S.playerPos.x;
  const dy = S.moveTarget.y - S.playerPos.y;
  const dist = Math.hypot(dx, dy);
  
  if(dist < 4){
    S.playerPos.x = S.moveTarget.x;
    S.playerPos.y = S.moveTarget.y;
    S.moveTarget = null;
    // If there's a queued activity, execute it
    if(_queuedActivity){
      const act = _queuedActivity;
      _queuedActivity = null;
      executeActivity(act.locId, act.actId);
    }
  } else {
    const speed = 2.5;
    const vx = dx/dist * speed;
    const vy = dy/dist * speed;
    const newX = S.playerPos.x + vx;
    const newY = S.playerPos.y + vy;
    if(!isBlocked(newX, S.playerPos.y)) S.playerPos.x = newX;
    if(!isBlocked(S.playerPos.x, newY)) S.playerPos.y = newY;
    playerFrame++;
  }
}
function isBlocked(x, y){
  const tx = Math.floor((x + TILE/2) / TILE);
  const ty = Math.floor((y + TILE/2) / TILE);
  if(tx<0 || tx>=MAP_W || ty<0 || ty>=MAP_H) return true;
  for(const loc of Object.values(LOCATIONS)){
    if(tx >= loc.x && tx < loc.x+loc.w && ty >= loc.y && ty < loc.y+loc.h) return true;
  }
  return false;
}
function findNearestWalkable(x, y){
  const baseTx = Math.floor(x / TILE), baseTy = Math.floor(y / TILE);
  for(let r=0; r<6; r++){
    for(let dy=-r; dy<=r; dy++){
      for(let dx=-r; dx<=r; dx++){
        if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
        const tx = baseTx+dx, ty = baseTy+dy;
        if(tx<0 || tx>=MAP_W || ty<0 || ty>=MAP_H) continue;
        let blocked = false;
        for(const loc of Object.values(LOCATIONS)){
          if(tx >= loc.x && tx < loc.x+loc.w && ty >= loc.y && ty < loc.y+loc.h){ blocked = true; break; }
        }
        if(!blocked) return {tx, ty};
      }
    }
  }
  return {tx: 5, ty: 5}; // fallback
}

// ═══════════ ACTIVITY LOGIC ═══════════
function openLocationMenu(locId){
  const loc = LOCATIONS[locId];
  const acts = LOCATION_ACTIVITIES[locId] || [];
  
  const panel = document.getElementById('actPanel');
  const title = document.getElementById('actTitle');
  const grid = document.getElementById('actGrid');
  
  title.innerHTML = `${loc.emoji} ${loc.name}`;
  
  grid.innerHTML = acts.map(a => {
    // Check daily limits
    let disabled = false;
    if(a.id === 'work' && S._worked) disabled = true;
    if(a.id === 'overtime' && !S._worked) disabled = true;
    if(a.id === 'study' && S._schooled) disabled = true;
    
    // Cost check
    if(a.cost > 0 && S.st.money < a.cost) disabled = true;
    
    const hours = a.t >= 60 ? (a.t/60).toFixed(1).replace('.0','')+'h' : a.t+'p';
    const costStr = a.cost > 0 ? `-${fmt(a.cost)}` : 'Miễn phí';
    
    return `<button class="act-btn" ${disabled?'disabled':''} onclick="selectActivity('${locId}','${a.id}')">
      <span class="nm">${a.n}</span>
      <span class="info">⏱ ${hours} · ${costStr}</span>
    </button>`;
  }).join('');
  
  panel.classList.add('on');
}

function selectActivity(locId, actId){
  const loc = LOCATIONS[locId];
  const act = LOCATION_ACTIVITIES[locId].find(a => a.id === actId);
  if(!act) return;
  
  // Set target position to the door of the building
  const doorX = (loc.x + loc.w/2) * TILE;
  const doorY = (loc.y + loc.h + 1) * TILE;
  const result = findNearestWalkable(doorX, doorY);
  
  S.moveTarget = {x: result.tx * TILE, y: result.ty * TILE};
  _queuedActivity = {locId, actId};
  S.currentLoc = locId;
  
  // UI feedback
  document.getElementById('actPanel').classList.remove('on');
  showBubble(`Đang đi đến ${loc.name}...`);
  
  if(S.moveTarget.x === S.playerPos.x && S.moveTarget.y === S.playerPos.y){
    // Already there
    S.moveTarget = null;
    _queuedActivity = null;
    executeActivity(locId, actId);
  }
}

function executeActivity(locId, actId){
  const act = LOCATION_ACTIVITIES[locId].find(a => a.id === actId);
  if(!act) return;
  
  // Check again
  if(act.cost > 0 && S.st.money < act.cost){ 
    showBubble('Không đủ tiền!'); return; 
  }
  
  // Pay cost
  if(act.cost > 0) apply('money', -act.cost);
  
  // Apply effects
  if(act.ef){
    for(const [k,v] of Object.entries(act.ef)){
      if(k === 'money'){
        if(v === 'wage'){ apply('money', JOBS[S.job].w); S._worked = true; }
        else if(v === 'half'){ apply('money', Math.round(JOBS[S.job].w*0.5)); S._worked = true; }
        else if(v === 'gamble'){ 
          const win = Math.random() < 0.4; 
          apply('money', win ? 1200 : -500); 
          addLog(win?'📈 Đầu tư thắng +1.200đ':'📉 Đầu tư thua -500đ', win?'good':'bad');
        }
      } else if(k === 'money'){ apply(k, v); }
      else apply(k, v);
    }
  }
  
  // Education
  if(act.edu){
    S.eduProgress++;
    const req = {c3:5, dh:10, ths:14, ts:999}[S.edu];
    if(S.eduProgress >= req){
      S.edu = {c3:'dh', dh:'ths', ths:'ts'}[S.edu];
      S.eduProgress = 0;
      addLog(`🎓 Tốt nghiệp ${EDU_LABEL[S.edu]}!`, 'good');
      apply('mental', 15);
    } else {
      addLog(`📖 Học: ${S.eduProgress}/${req}`, 'info');
      S._schooled = true;
    }
  }
  
  // Advance time
  S.gameMinutes += act.t;
  processTimeAdvance();
  
  // Log
  addLog(`📍 ${LOCATIONS[locId].emoji} ${LOCATIONS[locId].name}: ${act.n}`, 'info');
  
  // Check health
  checkHealth();
  render();
  updateTimeUI();
  showBubble(`Đã hoàn thành: ${act.n}`);
  setTimeout(() => showBubble(''), 2000);
}

function showBubble(text){
  let b = document.getElementById('bubble');
  if(!b){
    b = document.createElement('div');
    b.id = 'bubble';
    document.getElementById('worldWrap').appendChild(b);
  }
  if(!text){ b.classList.remove('on'); return; }
  b.textContent = text;
  b.classList.add('on');
}

// ═══════════ TIME PROCESSING ═══════════
function processTimeAdvance(){
  const time = getGameTime();
  if(time.day > S.lastDayProcessed){
    for(let d = S.lastDayProcessed + 1; d <= time.day; d++) endOfDay(d);
    S.lastDayProcessed = time.day;
  }
  if(time.hour === 0 && time.minute === 0){
    S._worked = false;
    S._schooled = false;
  }
}
function endOfDay(d){
  apply('money', -100); // Ăn uống
  const cc = S.children.reduce((s,c)=>s+300,0);
  if(cc>0) apply('money', -cc);
  apply('energy', 20); apply('mental', -2); apply('health', 2);
  const partner = getPartner();
  if(partner && partner.stage === 'married'){
    apply('money', Math.round((JOBS[partner.job]?.w||500)*0.7));
  }
  checkHealth();
  addLog(`🌅 Ngày ${d} kết thúc.`, 'day');
  if(d % 3 === 0) save();
}
function checkHealth(){ 
  if(S.st.health<=0||S.st.energy<=0){ apply('health',40-S.st.health);apply('energy',50-S.st.energy); apply('money',-2000);addLog('🏥 Nhập viện!','bad'); } 
  if(S.st.mental<=0){S.st.mental=25;apply('money',-1000);addLog('😵 Suy nhược!','bad');} 
}

// ═══════════ SAVE / LOAD ═══════════
function save(){ localStorage.setItem('nhipdoi_sticker_save', JSON.stringify(S)); }
function load(){ 
  const raw = localStorage.getItem('nhipdoi_sticker_save'); 
  if(raw){ try { S = JSON.parse(raw); return true; } catch(e){} } 
  return false; 
}

// ═══════════ UI RENDER ═══════════
function updateTimeUI(){
  const t = getGameTime();
  document.getElementById('timeTag').textContent = `📅 ${t.dw} · ${pad2(t.hour)}:${pad2(t.minute)} · Ngày ${t.day}`;
  document.getElementById('timeHud').textContent = `${pad2(t.hour)}:${pad2(t.minute)}`;
}
function render(){
  if(!S || !S.gender) return;
  updateTimeUI();
  document.getElementById('money').textContent = fmt(S.st.money);
  document.getElementById('job').textContent = JOBS[S.job].i + ' ' + JOBS[S.job].n;
  document.getElementById('edu').textContent = EDU_LABEL[S.edu] + (S.eduProgress ? ` (${S.eduProgress})` : '');
  
  const p = getPartner();
  const pt = document.getElementById('partnerTag');
  if(p){ pt.style.display=''; pt.textContent=`💗 ${p.n}`; } else pt.style.display='none';
  
  // Stats
  const defs = [
    {k:'health',l:'❤️',c:'#ef4444'},{k:'energy',l:'⚡',c:'#facc15'},
    {k:'mental',l:'🧠',c:'#a78bfa'},{k:'skill',l:'📚',c:'#38bdf8'},
    {k:'love',l:'💗',c:'#ec4899'},{k:'passion',l:'🔥',c:'#fb923c'}
  ];
  document.getElementById('stats').innerHTML = defs.map(d => {
    const v = S.st[d.k];
    return `<div class="stat"><div class="lbl"><span>${d.l} ${d.k}</span><span>${Math.round(v)}</span></div><div class="bar"><div class="fill" style="width:${v}%;background:${d.c}"></div></div></div>`;
  }).join('');
  
  // Log
  document.getElementById('log').innerHTML = S.log.map(e => 
    `<div class="e ${e.t}"><b>${e.dw} ${e.time}:</b> ${e.m}</div>`
  ).join('');
  
  // Location menu
  const locMenu = document.getElementById('locMenu');
  locMenu.innerHTML = Object.entries(LOCATIONS).map(([k, loc]) => 
    `<button class="loc-btn" onclick="openLocationMenu('${k}')">
      <span class="em">${loc.emoji}</span>
      <span>${loc.name}</span>
    </button>`
  ).join('');
  
  // Info panel
  const infoPanel = document.getElementById('infoPanel');
  infoPanel.innerHTML = `
    <div>👤 ${S.name} (${S.gender==='nam'?'Nam':S.gender==='nu'?'Nữ':'Khác'})</div>
    <div>💼 ${JOBS[S.job].i} ${JOBS[S.job].n}</div>
    <div>🎓 ${EDU_LABEL[S.edu]}</div>
    <div>✨ Prestige: ${prestige()}</div>
    <div>📍 Đang ở: ${getCurrentLocName()}</div>
  `;
  
  // Highlight current building
  updateLocationHighlight();
  save();
}

function getCurrentLocName(){
  const px = S.playerPos.x + TILE/2, py = S.playerPos.y + TILE/2;
  for(const [key, loc] of Object.entries(LOCATIONS)){
    if(px >= (loc.x-1)*TILE && px <= (loc.x+loc.w+1)*TILE && py >= (loc.y-1)*TILE && py <= (loc.y+loc.h+1)*TILE){
      return loc.emoji + ' ' + loc.name;
    }
  }
  return '🛣️ Ngoài đường';
}

function updateLocationHighlight(){
  const px = S.playerPos.x + TILE/2, py = S.playerPos.y + TILE/2;
  for(const [key, loc] of Object.entries(LOCATIONS)){
    if(px >= (loc.x-1)*TILE && px <= (loc.x+loc.w+1)*TILE && py >= (loc.y-1)*TILE && py <= (loc.y+loc.h+1)*TILE){
      document.getElementById('locName').textContent = loc.emoji + ' ' + loc.name;
      return;
    }
  }
  document.getElementById('locName').textContent = '🛣️ Ngoài đường';
}

// ═══════════ MODAL SYSTEM ═══════════
function showModal(h){ document.getElementById('mbox').innerHTML = h; document.getElementById('modal').classList.add('on'); }
function closeModal(){ document.getElementById('modal').classList.remove('on'); }
document.getElementById('modal').onclick = e => { if(e.target.id === 'modal') closeModal(); };

// ═══════════ RELATIONSHIP / CHILD / JOB / ASSETS (Simplified for brevity) ═══════════
function openRel(){
  const list = Object.values(S.rels);
  let html = `<h2>🤝 Quan hệ (${list.length})</h2>`;
  if(list.length === 0) html += `<p>Chưa quen ai. Hãy đi dạo và gặp gỡ NPC!</p>`;
  html += `<button class="btn sec" onclick="closeModal()">Đóng</button>`;
  showModal(html);
}
function openChildren(){
  showModal(`<h2>👶 Con cái</h2><p>Chưa có con.</p><button class="btn sec" onclick="closeModal()">Đóng</button>`);
}
function openJobs(){
  const sorted = Object.entries(JOBS).sort((a,b) => a[1].w - b[1].w);
  showModal(`<h2>💼 Chọn nghề</h2>${sorted.map(([k,j]) => 
    `<button class="btn ${S.job===k?'pri':'sec'}" style="text-align:left;margin-bottom:4px" ${S.job===k?'disabled':''} onclick="changeJob('${k}')">
      ${j.i} ${j.n} — ${fmt(j.w)}/ngày
    </button>`
  ).join('')}<button class="btn sec" onclick="closeModal()">Đóng</button>`);
}
function changeJob(k){ S.job = k; addLog(`Chuyển sang: ${JOBS[k].i} ${JOBS[k].n}`,'info'); closeModal(); render(); }
function openAssets(){
  showModal(`<h2>🏠 Tài sản</h2><p>Số dư: <b>${fmt(S.st.money)}</b></p>
    <button class="btn sec" onclick="closeModal()">Đóng</button>`);
}

// ═══════════ INIT & GAME LOOP ═══════════
function showStart(){
  window._g = null; window._h = [];
  showModal(`
    <h2>Tạo nhân vật</h2>
    <h3>Giới tính</h3>
    <div class="opt">
      <button onclick="pickG(this,'nam')">👨 Nam</button>
      <button onclick="pickG(this,'nu')">👩 Nữ</button>
      <button onclick="pickG(this,'khac')">🧑 Khác</button>
    </div>
    <h3>Tên</h3>
    <input class="inp" id="nm" maxlength="20" placeholder="Nhập tên...">
    <h3>Sở thích (2-3)</h3>
    <div class="opt" id="hobbies">
      ${Object.entries(HOBBIES).map(([k,v]) => `<button onclick="pickH(this,'${k}')">${v.e} ${v.n}</button>`).join('')}
    </div>
    <button class="btn pri" style="margin-top:12px" onclick="startGame()">Bắt đầu cuộc đời</button>
  `);
}
function pickG(b,g){ window._g=g; b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); }
function pickH(b,h){ 
  const i = window._h.indexOf(h); 
  if(i>=0){ window._h.splice(i,1); b.classList.remove('sel'); } 
  else if(window._h.length<3){ window._h.push(h); b.classList.add('sel'); } 
}
function startGame(){
  if(!window._g) return alert('Chọn giới tính.');
  if(window._h.length < 2) return alert('Chọn ít nhất 2 sở thích.');
  S = newState();
  S.gender = window._g;
  S.name = (document.getElementById('nm').value || '').trim() || 'Bạn';
  S.hobbies = [...window._h];
  S.playerPos = {x: 5*TILE, y: 5*TILE};
  addLog(`Chào ${S.name}! Hãy chọn địa điểm để bắt đầu.`, 'info');
  closeModal();
  render();
}

function gameLoop(){
  function tick(now){
    if(S && S.gender){
      const realNow = Date.now();
      const dt = (realNow - _lastRealTime) / 1000;
      _lastRealTime = realNow;
      if(!S.ended && dt < 2 && dt > 0){
        S.gameMinutes += dt * MIN_PER_SEC;
        processTimeAdvance();
      }
      updatePlayer();
      drawWorld(now || 0);
      updateLocationHighlight();
      updateTimeUI();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

async function init(){
  const ok = load();
  if(!ok || !S.gender){ S = newState(); render(); showStart(); }
  else {
    if(!S.npcPositions) S.npcPositions = {};
    if(!S.npcStates) S.npcStates = {};
    if(!S.lastDayProcessed) S.lastDayProcessed = Math.floor(S.gameMinutes / (24*60));
    render();
  }
  _lastRealTime = Date.now();
  gameLoop();
}

// Polyfill
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(w<2*r)r=w/2; if(h<2*r)r=h/2;
    this.beginPath(); this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r); this.closePath(); return this;
  };
}

// Expose
Object.assign(window, { openLocationMenu, selectActivity, closeModal, pickG, pickH, startGame, openRel, openChildren, openJobs, changeJob, openAssets });

// Wire bottom buttons
document.getElementById('relBtn').onclick = openRel;
document.getElementById('childBtn').onclick = openChildren;
document.getElementById('jobBtn').onclick = openJobs;
document.getElementById('assetsBtn').onclick = openAssets;
document.getElementById('sleepBtn').onclick = () => {
  const t = getGameTime();
  const target = (t.hour >= 6) ? (24 - t.hour + 6) * 60 - t.minute : (6 - t.hour) * 60 - t.minute;
  S.gameMinutes += target;
  apply('energy', 60); apply('mental', 15); apply('health', 5);
  addLog(`😴 Ngủ ngon!`, 'good');
  processTimeAdvance();
  render();
};
document.getElementById('logoutBtn').onclick = () => {
  if(!confirm('Chơi lại từ đầu?')) return;
  localStorage.removeItem('nhipdoi_sticker_save');
  location.reload();
};

init();
</script>
