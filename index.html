<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Nhịp Đời Online 2D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#eaeaea;min-height:100vh;padding:8px;display:flex;justify-content:center;overflow-x:hidden}
.game{width:100%;max-width:1050px;background:#0f172a;border-radius:16px;padding:12px}
h1{font-size:18px;text-align:center;background:linear-gradient(90deg,#f472b6,#a78bfa,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;margin:8px 0}
.tag{font-size:11px;background:#1e293b;padding:3px 8px;border-radius:20px}
.tag.m{background:linear-gradient(135deg,#064e3b,#065f46);color:#6ee7b7;font-weight:bold}
.tag.w{color:#facc15;font-weight:bold}
.tag.j{color:#38bdf8}.tag.r{color:#a78bfa}.tag.k{color:#f472b6;font-weight:bold}
.tag.sv{font-size:10px;color:#64748b}
.tag.sv.saving{color:#facc15}.tag.sv.saved{color:#22c55e}.tag.sv.err{color:#ef4444}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:4px;margin-bottom:8px}
.stat{background:#1e293b;border-radius:8px;padding:5px 8px}
.stat .lbl{font-size:10px;color:#94a3b8;display:flex;justify-content:space-between}
.bar{height:5px;background:#0f172a;border-radius:4px;margin-top:4px;overflow:hidden}
.fill{height:100%;transition:.4s;border-radius:4px}
#worldWrap{position:relative;background:#0f172a;border-radius:12px;overflow:hidden;margin-bottom:6px;border:2px solid #1e293b}
#world{display:block;width:100%;height:auto;cursor:pointer;touch-action:none}
#hud{position:absolute;top:6px;left:6px;right:6px;display:flex;justify-content:space-between;pointer-events:none}
#locName{background:rgba(15,23,42,.85);padding:4px 10px;border-radius:8px;font-size:11px;color:#facc15;font-weight:bold;border:1px solid #334155}
#timeHud{background:rgba(15,23,42,.85);padding:4px 10px;border-radius:8px;font-size:11px;color:#38bdf8;font-weight:bold;border:1px solid #334155}
#interactBtn{position:absolute;bottom:8px;right:8px;background:linear-gradient(135deg,#8b5cf6,#ec4899);border:none;color:#fff;padding:8px 14px;border-radius:20px;font-weight:bold;font-size:12px;display:none;cursor:pointer;box-shadow:0 4px 12px rgba(139,92,246,.5);z-index:5;font-family:inherit}
#interactBtn.on{display:block;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#dpad{position:absolute;bottom:8px;left:8px;width:120px;height:120px;z-index:5;opacity:.75}
#dpad button{position:absolute;width:38px;height:38px;background:rgba(51,65,85,.85);border:2px solid #475569;color:#e2e8f0;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;touch-action:none}
#dpad button:active{background:rgba(139,92,246,.7)}
#dpad .up{top:0;left:41px}#dpad .dn{top:82px;left:41px}
#dpad .lf{top:41px;left:0}#dpad .rt{top:41px;left:82px}
#dpad .ct{top:41px;left:41px;background:rgba(139,92,246,.35);border-color:#8b5cf6;font-size:11px;font-weight:bold}
.travelbar{display:flex;gap:4px;overflow-x:auto;padding:4px 2px;margin-bottom:6px;scrollbar-width:thin}
.travelbar button{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:5px 9px;border-radius:8px;font-size:10px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.15s}
.travelbar button:hover{background:#334155;border-color:#8b5cf6;color:#facc15}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:700px){.panels{grid-template-columns:1fr}}
.panel{background:#1e293b;border-radius:10px;padding:10px}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;margin-bottom:6px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px;max-height:280px;overflow-y:auto}
.act{background:#334155;border:none;color:#e2e8f0;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:11px;text-align:left;font-family:inherit}
.act:hover:not(:disabled){background:#475569}
.act:disabled{opacity:.35;cursor:not-allowed}
.act .cost{font-size:9px;color:#94a3b8;display:block;margin-top:2px}
.act.ent{background:#3b2f52}
.log{max-height:280px;overflow-y:auto;font-size:11px}
.e{padding:5px 7px;border-radius:6px;margin-bottom:3px;background:#0f172a;border-left:3px solid #334155}
.e.good{border-left-color:#22c55e}.e.bad{border-left-color:#ef4444}
.e.love{border-left-color:#ec4899}.e.info{border-left-color:#38bdf8}
.e.npc{border-left-color:#f59e0b;background:#1a1206}
.e.child{border-left-color:#fbbf24;background:#2a1f0a}
.e.money{border-left-color:#6ee7b7;background:#052e16}
.e.day{background:#1e293b;color:#facc15;text-align:center;font-weight:bold}
.bottom{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.btn{flex:1;min-width:70px;padding:9px 10px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px;font-family:inherit;transition:.15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff}
.btn.sec{background:#334155;color:#e2e8f0}.btn.sec:hover:not(:disabled){background:#475569}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#facc15);color:#1c1917}
.btn.danger{background:#7f1d1d;color:#fecaca}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:12px;z-index:100}
.modal.on{display:flex}
.mbox{background:#1e293b;border-radius:14px;padding:16px;max-width:680px;width:100%;max-height:92vh;overflow-y:auto}
.mbox h2{font-size:16px;margin-bottom:8px;color:#f472b6}
.mbox h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;margin:10px 0 5px}
.mbox p{font-size:12px;color:#cbd5e1;line-height:1.5;margin-bottom:8px}
.mbox .btn{width:100%;margin-top:5px}
.opt{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.opt button{flex:1;min-width:70px;padding:7px 9px;background:#334155;border:2px solid transparent;color:#e2e8f0;border-radius:8px;cursor:pointer;font-size:11px;font-family:inherit}
.opt button.sel{border-color:#8b5cf6;background:#4c1d95}
.inp{width:100%;padding:9px 10px;background:#0f172a;border:1px solid #334155;color:#eaeaea;border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.card{background:#0f172a;border:2px solid #1e293b;border-radius:10px;padding:9px}
.card .av{font-size:30px;text-align:center}
.card .nm{font-weight:bold;color:#facc15;text-align:center;font-size:13px;margin:3px 0}
.card .s2{font-size:10px;color:#94a3b8;text-align:center;margin-bottom:5px}
.ln{display:flex;justify-content:space-between;font-size:10px;color:#cbd5e1;margin:2px 0}
.ln span:last-child{color:#facc15;font-weight:bold}
.chat{background:#0f172a;border-radius:10px;padding:10px;height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.msg{max-width:78%;padding:7px 11px;border-radius:12px;font-size:11px;line-height:1.4}
.msg.you{align-self:flex-end;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff}
.msg.them{align-self:flex-start;background:#1e293b;color:#e2e8f0}
.msg.sys{align-self:center;font-size:10px;color:#94a3b8;font-style:italic;background:transparent}
.topic{background:#1e3a5f;border:none;color:#e2e8f0;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:10px;font-family:inherit;margin:2px}
.npc-card{background:#0f172a;border-radius:10px;padding:9px;margin-bottom:6px;border-left:3px solid #8b5cf6}
.npc-card.p{border-left-color:#ec4899;background:linear-gradient(135deg,#1f0a1e,#2a0f30)}
.npc-card.m{border-left-color:#22c55e;background:linear-gradient(135deg,#052e16,#0a3d1f)}
.npc-card.a{border-left-color:#ef4444;background:linear-gradient(135deg,#1a0505,#2a0808)}
.npc-card.c{border-left-color:#fbbf24;background:linear-gradient(135deg,#2a1f0a,#3a2a0f)}
.npc-h{display:flex;align-items:center;gap:5px;margin-bottom:5px;flex-wrap:wrap}
.npc-h .av{font-size:20px}.npc-h .nm{font-weight:bold;color:#facc15;font-size:12px}
.bd{font-size:9px;background:#1e293b;padding:2px 7px;border-radius:10px;color:#cbd5e1}
.bd.gold{background:#78350f;color:#fde68a}.bd.red{background:#7f1d1d;color:#fecaca}
.bd.blue{background:#1e3a8a;color:#93c5fd}.bd.green{background:#064e3b;color:#6ee7b7}
.bond{height:5px;background:#1e293b;border-radius:4px;overflow:hidden;margin:5px 0}
.bond-f{height:100%;background:linear-gradient(90deg,#ec4899,#a78bfa);transition:.3s}
.bond-f.neg{background:linear-gradient(90deg,#991b1b,#dc2626)}
.npc-a{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.npc-a .btn{padding:5px 7px;font-size:10px;flex:1;min-width:0;margin:0}
.view{font-size:10px;font-style:italic;color:#c4b5fd;background:#1a1330;border-left:2px solid #8b5cf6;padding:3px 7px;border-radius:4px;margin:4px 0}
.warn{font-size:10px;color:#fca5a5;font-weight:bold;background:#2a0505;padding:3px 7px;border-radius:4px;margin:4px 0}
.info{font-size:9px;color:#f59e0b;padding:2px 0}
.asset-card{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.asset-info h4{color:#facc15;font-size:12px;margin-bottom:3px}
.asset-info p{font-size:10px;color:#94a3b8;margin:0}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#475569;border-radius:4px}
</style>
</head>
<body>
<div class="game">
<h1>NHỊP ĐỜI ONLINE 2D</h1>

</div>

</div>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>

const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const clampInt=v=>Math.max(-100,Math.min(100,v));

function addLog(m,t='info'){ const tt=time(); S.log.unshift({m,t,w:S.week,d:tt.dw}); if(S.log.length>120)S.log.pop(); }
function apply(k,v){ if(k==='money'){S.st.money=Math.round(S.st.money+v);return;} if(['skill','love','passion'].includes(k)){S.st[k]=clamp(S.st[k]+v);return;} S.st[k]=clamp(S.st[k]+v); }
function getPartner(){return S.partnerId?S.rels[S.partnerId]:null;}
function syncLove(){const p=getPartner();S.st.love=p?Math.max(0,p.love):0;}
function difficulty(p){return Math.round(p.ap*3+p.wl*0.4+(EDU_RANK[p.edu]||1)*15);}
function prestige(){ const assetVal = (HOUSES.find(h=>h.id===S.assets.house)?.p||0) + (CARS.find(c=>c.id===S.assets.car)?.p||0) + (BUSINESS.find(b=>b.id===S.assets.business)?.p||0); return Math.round((S.st.money + assetVal)/1200 + EDU_RANK[S.edu]*15 + S.st.skill*0.6); }
function rejectChance(p){ const need=difficulty(p)*1.2,pre=prestige(); if(pre>=need)return 0; return Math.min(0.9,(need-pre)/need*0.9); }

const canvas = document.getElementById('world');

let camera = {x:0, y:0};

// ═══════════ TILE DRAWING ═══════════
function drawTile(x, y, type, t){
  const px = x*TILE, py = y*TILE;
  if(type===0){ // grass
    ctx.fillStyle = '#2d6a4f'; ctx.fillRect(px,py,TILE,TILE);
    ctx.fillStyle = '#40916c';
    ctx.fillRect(px+2,py+2,TILE-4,2); ctx.fillRect(px+2,py+TILE-4,TILE-4,2);
    // Grass blades
    ctx.strokeStyle = '#52b788'; ctx.lineWidth = 1;
    for(let i=0;i<3;i++){
      const gx = px + 4 + (i*10)%24;
      const gy = py + 8 + (i*7)%16;
      ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx-1,gy-3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx+3,gy); ctx.lineTo(gx+4,gy-2); ctx.stroke();
    }
  } else if(type===1){ // road
    ctx.fillStyle = '#3d3d3d'; ctx.fillRect(px,py,TILE,TILE);
    ctx.fillStyle = '#4a4a4a'; ctx.fillRect(px+1,py+1,TILE-2,TILE-2);
    ctx.fillStyle = '#6b6b6b';
    ctx.fillRect(px+4,py+TILE/2-1,10,2); ctx.fillRect(px+20,py+TILE/2-1,10,2);
  } else if(type===2){ // water
    ctx.fillStyle = '#1e40af'; ctx.fillRect(px,py,TILE,TILE);
    const w = Math.sin(t/500 + x*0.5 + y*0.3)*2;
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath(); ctx.ellipse(px+8+w,py+10,8,2,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px+22-w,py+22,6,1.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#60a5fa';
    ctx.beginPath(); ctx.ellipse(px+14,py+18+w,4,1,0,0,Math.PI*2); ctx.fill();
  } else if(type===3){ // sand
    ctx.fillStyle = '#d4a574'; ctx.fillRect(px,py,TILE,TILE);
    ctx.fillStyle = '#b8935f';
    ctx.fillRect(px+4,py+6,2,2); ctx.fillRect(px+20,py+18,2,2);
  } else if(type===4){ // flower grass
    ctx.fillStyle = '#2d6a4f'; ctx.fillRect(px,py,TILE,TILE);
    ctx.fillStyle = '#40916c'; ctx.fillRect(px+2,py+2,TILE-4,2);
    const colors = ['#f472b6','#facc15','#fb923c','#a78bfa'];
    for(let i=0;i<4;i++){
      const fx = px+4+(i*8)%24, fy = py+6+(i*5)%20;
      ctx.fillStyle = colors[i%4];
      ctx.beginPath(); ctx.arc(fx,fy,2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(fx,fy,0.8,0,Math.PI*2); ctx.fill();
    }
  } else if(type===5){ // path
    ctx.fillStyle = '#a16207'; ctx.fillRect(px,py,TILE,TILE);
    ctx.fillStyle = '#ca8a04';
    ctx.fillRect(px+1,py+1,TILE-2,TILE-2);
  }
}

// ═══════════ BUILDING DRAWING ═══════════
function drawBuilding(loc, t){
  const px = loc.x*TILE, py = loc.y*TILE, w = loc.w*TILE, h = loc.h*TILE;
  const roofH = 14;
  const bodyY = py + roofH;
  const bodyH = h - roofH;
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(px+4, py+6, w, h);
  
  // Body
  ctx.fillStyle = loc.color;
  ctx.fillRect(px, bodyY, w, bodyH);
  // Body border
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 2;
  ctx.strokeRect(px+1, bodyY+1, w-2, bodyH-2);
  // Windows
  const winCols = Math.max(2, Math.floor(w/22));
  for(let i=0;i<winCols;i++){
    const wx = px + 6 + i*(w-12)/winCols;
    const wy = bodyY + 8;
    ctx.fillStyle = 'rgba(255,255,220,.85)';
    ctx.fillRect(wx, wy, 8, 8);
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1;
    ctx.strokeRect(wx+0.5, wy+0.5, 7, 7);
  }
  // Door
  const doorW = 12, doorH = Math.min(16, bodyH-18);
  const dx = px + w/2 - doorW/2;
  const dy = bodyY + bodyH - doorH - 2;
  ctx.fillStyle = '#3f2314';
  ctx.fillRect(dx, dy, doorW, doorH);
  ctx.fillStyle = '#facc15';
  ctx.beginPath(); ctx.arc(dx+doorW-3, dy+doorH/2, 1.2, 0, Math.PI*2); ctx.fill();
  
  // Roof
  ctx.fillStyle = loc.roof;
  ctx.beginPath();
  ctx.moveTo(px-3, bodyY);
  ctx.lineTo(px + w/2, py);
  ctx.lineTo(px + w + 3, bodyY);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 2;
  ctx.stroke();
  // Roof tiles lines
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1;
  for(let i=1;i<4;i++){
    const rx = px + i*w/4;
    ctx.beginPath(); ctx.moveTo(rx, bodyY); ctx.lineTo(px + w/2 + (i-2)*w/8, py + roofH*i/4); ctx.stroke();
  }
  
  // Sign board
  ctx.fillStyle = 'rgba(15,23,42,.9)';
  const signW = Math.min(w-8, ctx.measureText(loc.name).width + 40);
  ctx.fillRect(px + w/2 - signW/2, bodyY + 2, signW, 12);
  ctx.fillStyle = '#facc15';
  ctx.font = 'bold 9px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(loc.emoji + ' ' + loc.name, px + w/2, bodyY + 8);
}

// ═══════════ CHARACTER DRAWING ═══════════
function drawCharacter(char, px, py, facing, walking, frame){
  const cx = px + TILE/2;
  const bob = walking ? Math.sin(frame*0.35)*1.2 : Math.sin(Date.now()/500)*0.4;
  const legSwing = walking ? Math.sin(frame*0.35)*3.5 : 0;
  const armSwing = walking ? Math.sin(frame*0.35)*3 : 0;
  const cy = py + TILE/2 + bob;
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.4)';
  ctx.beginPath();
  ctx.ellipse(cx, py+TILE-2, 9, 3, 0, 0, Math.PI*2);
  ctx.fill();
  
  // ---- LEGS ----
  // Back leg
  ctx.fillStyle = shade(char.pants, -20);
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.roundRect(cx-5, cy+6+legSwing, 4, 9, 1); ctx.fill(); ctx.stroke();
  // Front leg
  ctx.fillStyle = char.pants;
  ctx.beginPath(); ctx.roundRect(cx+1, cy+6-legSwing, 4, 9, 1); ctx.fill(); ctx.stroke();
  // Shoes
  ctx.fillStyle = '#1e1b17';
  ctx.beginPath(); ctx.roundRect(cx-5.5, cy+13+legSwing, 5, 3, 1); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx+0.5, cy+13-legSwing, 5, 3, 1); ctx.fill();
  
  // ---- BODY ----
  ctx.fillStyle = char.shirt;
  ctx.beginPath(); ctx.roundRect(cx-7, cy-4, 14, 11, 3); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.2; ctx.stroke();
  
  // ---- ARMS ----
  // Back arm
  ctx.fillStyle = shade(char.shirt, -20);
  ctx.beginPath(); ctx.roundRect(cx-9, cy-3+armSwing, 3.5, 9, 1.5); ctx.fill(); ctx.stroke();
  // Front arm
  ctx.fillStyle = char.shirt;
  ctx.beginPath(); ctx.roundRect(cx+5.5, cy-3-armSwing, 3.5, 9, 1.5); ctx.fill(); ctx.stroke();
  // Hands (skin)
  ctx.fillStyle = char.skin;
  ctx.beginPath(); ctx.arc(cx-7.2, cy+6+armSwing, 1.8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx+7.2, cy+6-armSwing, 1.8, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  
  // ---- HEAD ----
  ctx.fillStyle = char.skin;
  ctx.beginPath(); ctx.arc(cx, cy-11, 8, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 1.2; ctx.stroke();
  
  // ---- HAIR ----
  drawHair(char, cx, cy-11, facing);
  
  // ---- FACE ----
  if(facing !== 'up'){
    // Eyes
    const eyeY = cy-12;
    let eyeOffsetX = 0;
    if(facing === 'left') eyeOffsetX = -1.5;
    if(facing === 'right') eyeOffsetX = 1.5;
    
    ctx.fillStyle = '#1f2937';
    // Left eye
    ctx.beginPath(); ctx.ellipse(cx-3+eyeOffsetX, eyeY, 1.1, 1.4, 0, 0, Math.PI*2); ctx.fill();
    // Right eye
    ctx.beginPath(); ctx.ellipse(cx+3+eyeOffsetX, eyeY, 1.1, 1.4, 0, 0, Math.PI*2); ctx.fill();
    // Eye highlight
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx-3.3+eyeOffsetX, eyeY-0.5, 0.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+2.7+eyeOffsetX, eyeY-0.5, 0.4, 0, Math.PI*2); ctx.fill();
    
    // Blush
    ctx.fillStyle = 'rgba(244,114,182,.35)';
    ctx.beginPath(); ctx.arc(cx-5, cy-9, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+5, cy-9, 1.5, 0, Math.PI*2); ctx.fill();
    
    // Mouth
    ctx.strokeStyle = '#7c2d12'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy-9, 1.5, 0.15*Math.PI, 0.85*Math.PI);
    ctx.stroke();
  } else {
    // Back of head (just hair, no face)
  }
}

function drawHair(char, cx, cy, facing){
  ctx.fillStyle = char.hair;
  ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.2;
  
  const style = char.hairStyle || 'short';
  if(style === 'short'){
    ctx.beginPath();
    ctx.arc(cx, cy-1, 8, Math.PI, 0);
    ctx.lineTo(cx+8, cy+1);
    ctx.lineTo(cx-8, cy+1);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Side tuft
    ctx.beginPath(); ctx.arc(cx-6, cy-1, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+6, cy-1, 2.5, 0, Math.PI*2); ctx.fill();
  } else if(style === 'long'){
    ctx.beginPath();
    ctx.arc(cx, cy-1, 8, Math.PI, 0);
    ctx.lineTo(cx+9, cy+8);
    ctx.lineTo(cx-9, cy+8);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else if(style === 'ponytail'){
    ctx.beginPath();
    ctx.arc(cx, cy-1, 8, Math.PI, 0);
    ctx.lineTo(cx+8, cy+1); ctx.lineTo(cx-8, cy+1);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Ponytail
    ctx.beginPath();
    ctx.ellipse(cx+9, cy+2, 3, 5, 0.3, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  } else if(style === 'bun'){
    ctx.beginPath();
    ctx.arc(cx, cy-1, 8, Math.PI, 0);
    ctx.lineTo(cx+8, cy+1); ctx.lineTo(cx-8, cy+1);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Bun on top
    ctx.beginPath(); ctx.arc(cx, cy-8, 4, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  } else if(style === 'messy'){
    ctx.beginPath();
    ctx.arc(cx, cy-1, 8, Math.PI, 0);
    ctx.lineTo(cx+8, cy+1); ctx.lineTo(cx-8, cy+1);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Messy spikes
    ctx.beginPath(); ctx.moveTo(cx-5,cy-8); ctx.lineTo(cx-3,cy-11); ctx.lineTo(cx-1,cy-8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx+1,cy-8); ctx.lineTo(cx+4,cy-11); ctx.lineTo(cx+6,cy-8); ctx.fill();
  } else if(style === 'slick'){
    ctx.beginPath();
    ctx.arc(cx, cy-1, 8, Math.PI, 0);
    ctx.lineTo(cx+8, cy+1); ctx.lineTo(cx-8, cy+1);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Part line
    ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(cx-2, cy-8); ctx.lineTo(cx-3, cy-4); ctx.stroke();
  }
}

function shade(hex, amt){
  const num = parseInt(hex.slice(1),16);
  let r = (num>>16) + amt, g = ((num>>8)&0xff) + amt, b = (num&0xff) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

function drawEmotionBubble(px, py, emoji){
  if(!emoji) return;
  const cx = px + TILE/2;
  const cy = py - 10;
  ctx.fillStyle = 'rgba(255,255,255,.95)';
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx-4, cy+8); ctx.lineTo(cx, cy+14); ctx.lineTo(cx+4, cy+8);
  ctx.fill(); ctx.stroke();
  ctx.font = '12px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(emoji, cx, cy);
}

function drawNameTag(px, py, name, color){
  ctx.font = 'bold 9px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(name).width + 10;
  ctx.fillStyle = color || 'rgba(15,23,42,.9)';
  ctx.strokeStyle = 'rgba(255,255,255,.2)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(px + TILE/2 - w/2, py - 24, w, 13, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillText(name, px + TILE/2, py - 17);
}

function drawWorld(t){
  const W = canvas.width, H = canvas.height;
  const targetX = S.playerPos.x - W/2 + TILE/2;
  const targetY = S.playerPos.y - H/2 + TILE/2;
  camera.x += (targetX - camera.x) * 0.15;
  camera.y += (targetY - camera.y) * 0.15;
  camera.x = Math.max(0, Math.min(MAP_W*TILE - W, camera.x));
  camera.y = Math.max(0, Math.min(MAP_H*TILE - H, camera.y));
  
  ctx.fillStyle = '#0b1220';
  ctx.fillRect(0,0,W,H);
  
  ctx.save();
  ctx.translate(-camera.x, -camera.y);
  
  // Tiles
  for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++) drawTile(x,y,MAP_DATA[y][x],t);
  
  // Move target marker
  if(S.moveTarget){
    const mx = S.moveTarget.x + TILE/2, my = S.moveTarget.y + TILE/2;
    ctx.strokeStyle = 'rgba(250,204,21,' + (0.4 + Math.sin(t/200)*0.3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(mx, my, 8 + Math.sin(t/200)*2, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(250,204,21,.6)';
    ctx.beginPath(); ctx.arc(mx, my, 2, 0, Math.PI*2); ctx.fill();
  }
  
  // Buildings (background layer)
  for(const loc of Object.values(LOCATIONS)) drawBuilding(loc, t);
  
  // NPCs (chỉ những đã kết bạn)
  const npcsToDraw = [];
  for(const r of Object.values(S.rels)){
    const pos = S.npcPositions[r.id];
    if(!pos) continue;
    const npcData = NPC_POOL.find(p=>p.id===r.pid);
    if(!npcData) continue;
    npcsToDraw.push({r, pos, npcData, y: pos.y});
  }
  // Sắp xếp theo y để NPC ở dưới vẽ sau
  npcsToDraw.sort((a,b)=>a.y-b.y);
  for(const {r, pos, npcData} of npcsToDraw){
    const st = S.npcStates[r.id] || {};
    const facing = st.facing || 'down';
    const walking = st.walking || false;
    const frame = st.frame || 0;
    drawCharacter(npcData, pos.x, pos.y, facing, walking, frame);
    
    let emo = '';
    if(r.angry) emo = '😡';
    else if(r.expecting) emo = '🤰';
    else if(r.stage === 'married' && S.partnerId === r.id) emo = '💗';
    else if(r.love > 70) emo = '😊';
    else if(r.love < 20) emo = '😔';
    else if(r.stage === 'crush' || r.stage === 'dating') emo = '💕';
    if(emo) drawEmotionBubble(pos.x, pos.y, emo);
    
    drawNameTag(pos.x, pos.y, r.n, r.angry ? 'rgba(127,29,29,.9)' : 'rgba(15,23,42,.9)');
  }
  
  // Player
  drawCharacter(S.playerAppearance, S.playerPos.x, S.playerPos.y, playerState.facing, playerState.walking, playerState.frame);
  drawNameTag(S.playerPos.x, S.playerPos.y, S.name || 'Bạn', 'rgba(139,92,246,.95)');
  
  ctx.restore();
}

// ═══════════ PLAYER MOVEMENT ═══════════
const playerState = {facing:'down', walking:false, frame:0, speed:2.4};
const keys = {up:false, down:false, left:false, right:false};

function updatePlayer(){
  // Nếu có lệnh auto-move và không có phím nào bấm
  const anyKey = keys.up || keys.down || keys.left || keys.right;
  if(S.moveTarget && !anyKey){
    const dx = S.moveTarget.x - S.playerPos.x;
    const dy = S.moveTarget.y - S.playerPos.y;
    const dist = Math.hypot(dx, dy);
    if(dist < 4){
      S.moveTarget = null;
      playerState.walking = false;
      playerState.frame = 0;
    } else {
      const vx = dx/dist * playerState.speed;
      const vy = dy/dist * playerState.speed;
      const newX = S.playerPos.x + vx;
      const newY = S.playerPos.y + vy;
      if(!isBlocked(newX, S.playerPos.y)) S.playerPos.x = newX;
      if(!isBlocked(S.playerPos.x, newY)) S.playerPos.y = newY;
      playerState.walking = true;
      playerState.frame++;
      if(Math.abs(dx) > Math.abs(dy)) playerState.facing = dx > 0 ? 'right' : 'left';
      else playerState.facing = dy > 0 ? 'down' : 'up';
    }
    return;
  }
  
  let dx=0, dy=0;
  if(keys.up){dy-=1; playerState.facing='up';}
  if(keys.down){dy+=1; playerState.facing='down';}
  if(keys.left){dx-=1; playerState.facing='left';}
  if(keys.right){dx+=1; playerState.facing='right';}
  
  if(dx!==0 || dy!==0){
    S.moveTarget = null; // hủy auto-move khi bấm phím
    const len = Math.hypot(dx,dy);
    dx = dx/len * playerState.speed;
    dy = dy/len * playerState.speed;
    playerState.walking = true;
    playerState.frame++;
  } else {
    playerState.walking = false;
    playerState.frame = 0;
  }
  
  const newX = S.playerPos.x + dx;
  const newY = S.playerPos.y + dy;
  if(!isBlocked(newX, S.playerPos.y)) S.playerPos.x = newX;
  if(!isBlocked(S.playerPos.x, newY)) S.playerPos.y = newY;
  
  S.playerPos.x = Math.max(0, Math.min(MAP_W*TILE - TILE, S.playerPos.x));
  S.playerPos.y = Math.max(0, Math.min(MAP_H*TILE - TILE, S.playerPos.y));
}

function isBlocked(x, y){
  const tx = Math.floor((x + TILE/2) / TILE);
  const ty = Math.floor((y + TILE/2) / TILE);
  if(tx<0 || tx>=MAP_W || ty<0 || ty>=MAP_H) return true;
  if(MAP_DATA[ty][tx] === 2) return true;
  // Building collision
  for(const loc of Object.values(LOCATIONS)){
    if(tx >= loc.x && tx < loc.x+loc.w && ty >= loc.y && ty < loc.y+loc.h) return true;
  }
  return false;
}

function getPlayerLocation(){
  const px = S.playerPos.x + TILE/2;
  const py = S.playerPos.y + TILE/2;
  // Kiểm tra xem có đứng gần building không (bán kính 1 ô)
  for(const [key, loc] of Object.entries(LOCATIONS)){
    if(px >= (loc.x-1)*TILE && px <= (loc.x+loc.w+1)*TILE && py >= (loc.y-1)*TILE && py <= (loc.y+loc.h+1)*TILE){
      return {key, loc};
    }
  }
  return {key:'road', loc:{name:'Ngoài đường', emoji:'🛣️'}};
}

// Click on canvas to move
function canvasClick(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let clientX, clientY;
  if(e.touches && e.touches[0]){
    clientX = e.touches[0].clientX - rect.left;
    clientY = e.touches[0].clientY - rect.top;
  } else {
    clientX = e.clientX - rect.left;
    clientY = e.clientY - rect.top;
  }
  const worldX = clientX * scaleX + camera.x;
  const worldY = clientY * scaleY + camera.y;
  const tx = Math.floor(worldX / TILE) * TILE;
  const ty = Math.floor(worldY / TILE) * TILE;
  // Kiểm tra vị trí có đi được không
  if(!isBlocked(tx, ty)){
    S.moveTarget = {x: tx, y: ty};
  }
}
canvas.addEventListener('click', canvasClick);
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); canvasClick(e); }, {passive:false});

// ═══════════ NPC AI ═══════════
function getNpcTargetLocation(npcData, period){
  const traits = npcData.per || [];
  const prefs = [];
  for(const t of traits){ if(SCHEDULE_PREF[t]) prefs.push(SCHEDULE_PREF[t]); }
  if(prefs.length === 0) prefs.push(SCHEDULE_PREF.default);
  const pref = prefs[Math.floor(Math.random()*prefs.length)];
  const locKey = period === 0 ? pref.sang : period === 1 ? pref.chieu : pref.toi;
  return LOCATIONS[locKey] || LOCATIONS.home;
}

function initNpcPositions(){
  for(const r of Object.values(S.rels)){
    if(!S.npcPositions[r.id]){
      // Random spawn gần lối vào của building (ngoài chút)
      const locs = Object.values(LOCATIONS);
      const loc = locs[Math.floor(Math.random()*locs.length)];
      S.npcPositions[r.id] = {
        x: (loc.x + Math.random()*loc.w) * TILE,
        y: (loc.y + loc.h + 1 + Math.random()) * TILE
      };
    }
    if(!S.npcStates[r.id]){
      S.npcStates[r.id] = {facing:'down', walking:false, frame:0, target:null, idleTimer:0};
    }
  }
}

function updateNpcs(){
  const t = time();
  const period = t.per;
  for(const r of Object.values(S.rels)){
    const pos = S.npcPositions[r.id];
    const state = S.npcStates[r.id];
    const npcData = NPC_POOL.find(p=>p.id===r.pid);
    if(!pos || !state || !npcData) continue;
    
    if(!state.target){
      if(state.idleTimer > 0){ state.idleTimer--; state.walking = false; continue; }
      const targetLoc = getNpcTargetLocation(npcData, period);
      // Di chuyển đến trước cửa building
      let tx, ty, tries = 0;
      do {
        tx = (targetLoc.x + Math.random()*targetLoc.w) * TILE;
        ty = (targetLoc.y + targetLoc.h + 0.5 + Math.random()*1.5) * TILE;
        tries++;
      } while(isBlocked(tx, ty) && tries < 10);
      state.target = {x: tx, y: ty};
    }
    
    const dx = state.target.x - pos.x;
    const dy = state.target.y - pos.y;
    const dist = Math.hypot(dx, dy);
    
    if(dist < 6){
      state.target = null;
      state.walking = false;
      state.idleTimer = 120 + Math.random()*240;
    } else {
      const speed = 1.1 + Math.random()*0.5;
      pos.x += (dx/dist) * speed;
      pos.y += (dy/dist) * speed;
      state.walking = true;
      state.frame++;
      if(Math.abs(dx) > Math.abs(dy)) state.facing = dx > 0 ? 'right' : 'left';
      else state.facing = dy > 0 ? 'down' : 'up';
    }
  }
}

// ═══════════ INTERACTION ═══════════
let nearNpcId = null;
function checkInteraction(){
  nearNpcId = null;
  let minDist = TILE * 1.8;
  const px = S.playerPos.x + TILE/2;
  const py = S.playerPos.y + TILE/2;
  for(const r of Object.values(S.rels)){
    const pos = S.npcPositions[r.id];
    if(!pos) continue;
    const d = Math.hypot((pos.x + TILE/2) - px, (pos.y + TILE/2) - py);
    if(d < minDist){ minDist = d; nearNpcId = r.id; }
  }
  const btn = document.getElementById('interactBtn');
  if(nearNpcId){
    const r = S.rels[nearNpcId];
    btn.textContent = `💬 ${r.n}`;
    btn.classList.add('on');
  } else { btn.classList.remove('on'); }
}
document.getElementById('interactBtn').onclick = () => { if(nearNpcId) openChat(nearNpcId); };

function buildTravelBar(){
  const bar = document.getElementById('travelbar');
  bar.innerHTML = Object.entries(LOCATIONS).map(([k, loc])=>{
    return `<button data-loc="${k}">${loc.emoji} ${loc.name}</button>`;
  }).join('');
  bar.querySelectorAll('button').forEach(b=>{
    b.onclick = () => {
      const loc = LOCATIONS[b.dataset.loc];
      // Đi đến trước cửa building
      S.moveTarget = {x: (loc.x + loc.w/2) * TILE - TILE/2, y: (loc.y + loc.h + 1) * TILE};
      // Nếu target bị chặn, chọn vị trí dưới
      while(isBlocked(S.moveTarget.x, S.moveTarget.y)){
        S.moveTarget.y += TILE;
      }
    };
  });
}

// ═══════════ TIME & NPC TICKS ═══════════
function consume(cost){ const prev=Math.floor(S.periods/3); S.periods=Math.min(21,S.periods+cost); const next=Math.floor(S.periods/3); for(let d=prev;d<next&&d<7;d++)endOfDay(d); if(S.periods>=21&&!S.ended)endOfWeek(); }
function endOfDay(d){ apply('money',-150); addLog('🍚 Ăn uống: -150đ','info'); const cc=S.children.reduce((s,c)=>s+childCost(c),0); if(cc>0){apply('money',-cc);} addLog(`🌙 Hết ${['T2','T3','T4','T5','T6','T7','CN'][d]}.`,'day'); S._worked=false;S._schooled=false; 
  const houseM = HOUSES.find(h=>h.id===S.assets.house)?.m || 0;
  apply('energy',8); apply('mental',-1 + houseM); 
  checkHealth(); npcDailyTick(); }
function childCost(c){ if(c.age<12)return 300; if(c.age<26)return 500; return 800; }
function endOfWeek(){ addLog(`═══ Hết tuần ${S.week} ═══`,'day'); apply('money',-500); apply('mental',-JOBS[S.job].s*0.3); 
  const bizInc = BUSINESS.find(b=>b.id===S.assets.business)?.inc || 0;
  if(bizInc>0){ apply('money', bizInc); addLog(`🏢 Kinh doanh: +${fmt(bizInc)}`,'money'); }
  for(const r of Object.values(S.rels)){ if(r.angry){r.love=clampInt(r.love-5);r.angryDays--; if(r.angryDays<=0){r.angry=false;addLog(`${r.n} đã nguôi giận.`,'info');} } } 
  if(S.partnerId&&!S._dated){ const p=S.rels[S.partnerId]; if(p){p.love=clampInt(p.love-6);syncLove(); if(p.love<30)addLog(`💔 ${p.n} cảm thấy bị bỏ rơi.`,'bad');} } 
  S._dated=false; 
  const partner=getPartner(); if(partner&&partner.stage==='married'){ const wage=JOBS[partner.job]?.w||500; let mul=1; if(partner.per.includes('galant'))mul=1.3; if(partner.per.includes('stingy'))mul=0.4; const inc=Math.round(wage*5*mul)+Math.round(partner.wl*20); apply('money',inc); addLog(`💼 ${partner.n} đóng góp ${fmt(inc)}`,'money'); } 
  if(partner&&partner.expecting){ partner.expectingWeeks--; addLog(`🤰 ${partner.n} mang thai — còn ${partner.expectingWeeks} tuần.`,'love'); if(partner.expectingWeeks<=0)birthChild(); } 
  for(const c of S.children){ c.age++; if(!c._played){c.bond=clamp(c.bond-5);apply('mental',-2);} c._played=false; } 
  npcWeeklyTick(); S.week++;S.periods=0; if(S.st.money<-10000)return gameOver('Phá sản','Nợ nần nhấn chìm bạn.'); if(S.week>52)return gameOver('Một năm trôi qua',summary()); addLog(`── Tuần ${S.week} ──`,'day'); render(); }
function checkHealth(){ if(S.st.health<=0||S.st.energy<=0){ apply('health',40-S.st.health);apply('energy',50-S.st.energy); apply('money',-2000);addLog('🏥 Nhập viện! (-2.000đ)','bad'); } if(S.st.mental<=0){S.st.mental=25;apply('money',-1000);addLog('😵 Suy nhược!','bad');} }

function npcDailyTick() {
    if (S.ended) return;
    const toRemove = [];
    for (const r of Object.values(S.rels)) {
        if (r.stage === 'married') continue;
        if (r.love <= -50 || (r.angry && r.love <= -30)) toRemove.push(r);
    }
    toRemove.forEach(r => {
        addLog(`💔 ${r.n} đã hủy kết bạn!`, 'bad');
        if (S.partnerId === r.id) { S.partnerId = null; syncLove(); }
        delete S.rels[r.id]; delete S.npcPositions[r.id]; delete S.npcStates[r.id];
        apply('mental', -15);
    });
    for (const r of Object.values(S.rels)) {
        if (r.stage === 'married') continue;
        if (Math.random() < 0.15) {
            if (r.angry) { r.love = clampInt(r.love - 2); addLog(`📩 ${r.n}: "Tớ vẫn còn giận cậu!"`, 'bad'); }
            else if (r.love > 70) { r.love = clampInt(r.love + 1); addLog(`📩 ${r.n}: "Nhớ cậu quá!"`, 'love'); }
            else if (r.love < 20) { addLog(`📩 ${r.n}: "Dạo này cậu bận lắm hả?"`, 'info'); }
        }
    }
    if (S.gender === 'nu') {
        const partner = getPartner();
        for (const r of Object.values(S.rels)) {
            if (r.g === 'nam' && r.stage === 'crush' && r.love >= 80 && Math.random() < 0.2) {
                r.stage = 'dating';
                addLog(`💗 ${r.n} đã tỏ tình!`, 'love');
                showModal(`<h2>💗 Tỏ tình</h2><p style="text-align:center;font-size:40px">${r.av}</p><p><b>${r.n}</b>: "Tớ thích cậu! Làm người yêu tớ nhé?"</p><div style="display:flex;gap:6px"><button class="btn pri" onclick="closeModal();openRel();">Đồng ý</button><button class="btn sec" onclick="rejectNpcProposal('${r.id}')">Từ chối</button></div>`);
            }
            if (r.g === 'nam' && r.stage === 'dating' && r.love >= 90 && !partner && Math.random() < 0.1) {
                r.stage = 'engaged'; S.partnerId = r.id; syncLove();
                addLog(`💍 ${r.n} đã cầu hôn!`, 'love');
                showModal(`<h2>💍 Cầu hôn</h2><p style="text-align:center;font-size:40px">${r.av}</p><p><b>${r.n}</b>: "Em đồng ý làm vợ anh nhé?"</p><div style="display:flex;gap:6px"><button class="btn pri" onclick="closeModal();openRel();">Đồng ý</button><button class="btn sec" onclick="rejectNpcProposal('${r.id}')">Từ chối</button></div>`);
            }
        }
    }
}

function rejectNpcProposal(id) {
    const r = S.rels[id]; if (!r) return;
    r.love = clampInt(r.love - 30); r.stage = 'friend';
    if (S.partnerId === id) { S.partnerId = null; syncLove(); }
    addLog(`💔 Bạn đã từ chối ${r.n}.`, 'bad');
    closeModal(); render();
}
function makeAngry(r,amount=10,days=3){ r.angry=true;r.angryDays=days; r.love=clampInt(r.love-amount); addLog(`😡 ${r.n} tức giận!`,'bad'); }

function tryPregnant(){ const p=getPartner(); if(!p||p.stage!=='married'||p.expecting)return; const can=p.g==='nu'||S.gender==='nu'; if(!can){alert('Không thể mang thai.');return;} if(S.st.money<1000){alert('Không đủ tiền.');return;} apply('money',-1000); if(Math.random()<0.5){ p.expecting=true;p.expectingWeeks=3; addLog(`🤰 ${p.n} mang thai!`,'love'); apply('mental',15); }else{addLog('Chưa có tin vui.','info');} }

function buyForChild(id){ const c=S.children.find(x=>x.id===id);if(!c||S.st.money<300)return; apply('money',-300);c.bond=clamp(c.bond+5); addLog(`🍼 Sữa bỉm cho bé ${c.name}.`,'money'); render(); }

// ═══════════ NPC-NPC ═══════════
function compatibility(a,b){ if(!a.att.includes(b.g))return 0; if(!b.att.includes(a.g))return 0; let s=0;s+=Math.max(0,20-Math.abs(a.age-b.age)); const bgr={ngheo:0,trungluu:1,khagia:2,gia:3}; s+=10-Math.abs(bgr[a.bg]-bgr[b.bg])*3; for(const t of b.per){if(a.likes.includes(t))s+=8;if(a.dis.includes(t))s-=5;} s+=a.hob.filter(h=>b.hob.includes(h)).length*4; return Math.max(0,s); }
function npcWeeklyTick(){ const partner=getPartner(); for(const a of NPC_POOL){ if(!S.npcRels[a.id])S.npcRels[a.id]={}; for(const b of NPC_POOL){ if(a.id>=b.id)continue; if(!S.npcRels[a.id][b.id])S.npcRels[a.id][b.id]={aff:0,status:'none'}; if(partner&&(partner.pid===a.id||partner.pid===b.id))continue; const rel=S.npcRels[a.id][b.id]; if(rel.status==='married')continue; const comp=compatibility(a,b); if(comp<=10)continue; if(Math.random()<0.4)continue; let inc=comp>=40?2:comp>=25?1:0.5; rel.aff=Math.min(100,rel.aff+inc); if(rel.status==='none'&&rel.aff>=30){ rel.status='interested'; addLog(`📢 ${a.n} để ý ${b.n}...`,'npc'); } if(rel.status==='interested'&&rel.aff>=55){ rel.status='dating'; addLog(`💕 ${a.n} & ${b.n} hẹn hò!`,'npc'); } if(rel.status==='dating'&&rel.aff>=85&&Math.random()<0.3){ rel.status='married'; addLog(`💒 ${a.n} & ${b.n} KẾT HÔN!`,'npc'); } } } }
function getNpcRomanceStatus(npc){ const out=[]; for(const other of NPC_POOL){ if(other.id===npc.id)continue; const a=npc.id<other.id?npc.id:other.id; const b=npc.id<other.id?other.id:npc.id; const rel=S.npcRels[a]?.[b]; if(rel&&rel.status!=='none')out.push({other,rel}); } return out; }

// ═══════════ ACTIONS ═══════════
function doAction(id){ if(S.ended)return; const a=ACTIONS.find(x=>x.id===id);if(!a)return; if(S.periods+a.c>21)return; if(a.once&&a.id==='work'&&S._worked){alert('Hôm nay đã đi làm.');return;} if(a.once&&a.id==='study'&&S._schooled){alert('Hôm nay đã học.');return;} if(a.afterWork&&!S._worked){alert('Phải đi làm trước.');return;} if(a.minMoney&&S.st.money<a.minMoney)return; 
let transCost = a.transport;
if(transCost) { const carDisc = CARS.find(c=>c.id===S.assets.car)?.tr || 0; transCost = Math.max(0, Math.round(transCost * (1 + carDisc/100))); }
if(transCost){apply('money',-transCost);addLog(`🚌 Đi lại: -${transCost}đ`,'info');} 
consume(a.c); if(S.ended)return; const job=JOBS[S.job]; if(a.ef)for(const[k,v]of Object.entries(a.ef)){ if(k==='money'){ let amt=v; if(v==='wage'){amt=job.w;if(id==='work')S._worked=true;} else if(v==='half')amt=Math.round(job.w*0.5); apply('money',amt); }else if(k==='skill'&&id==='work')apply('skill',v*1.3); else apply(k,v); } 
if(a.edu){ S.eduProgress++; const req={c3:5,dh:10,ths:14,ts:999}[S.edu]; if(S.eduProgress>=req){ S.edu={c3:'dh',dh:'ths',ths:'ts'}[S.edu]; S.eduProgress=0; addLog(`🎓 Tốt nghiệp ${EDU_LABEL[S.edu]}!`,'good'); apply('mental',15); }else{addLog(`📖 Học: ${S.eduProgress}/${req}`,'info');S._schooled=true;} } 
if(a.gamble){ const win=Math.random()<0.4; apply('money',win?1200:-500); addLog(win?'📈 +1.200đ':'📉 -500đ',win?'good':'bad'); } 
checkHealth();render(); }

// ═══════════ MEET ═══════════
function rollProfiles(){ const met=new Set(Object.values(S.rels).map(r=>r.pid)); const avail=NPC_POOL.filter(p=>!met.has(p.id)); const sh=avail.sort(()=>Math.random()-0.5); S.currentProfiles=sh.slice(0,5).map(p=>p.id); }
function openMeet(){ if(S.currentProfiles.length===0)rollProfiles(); const list=S.currentProfiles.map(id=>NPC_POOL.find(p=>p.id===id)).filter(Boolean); if(list.length===0){ showModal(`<h2>🌐 Gặp gỡ</h2><p>Bạn đã gặp tất cả!</p> <button class="btn sec" onclick="closeModal()">Đóng</button>`); return; } showModal(` <h2>🌐 Gặp gỡ — 5 hồ sơ</h2> <p>Prestige: ✨ ${prestige()}</p> <div class="grid"> ${list.map(p=>{ const rc=rejectChance(p); const isG=p.per.includes('galant'); const isS=p.per.includes('stingy'); return `<div class="card"> <div class="av">${p.av}</div> <div class="nm">${p.n}</div> <div class="s2">${p.age}t · ${JOBS[p.job]?.n||p.job}</div> <div class="ln"><span>Ngoại hình</span><span>${p.ap}/10</span></div> <div class="ln"><span>Tài sản</span><span>${p.wl}/100</span></div> <div class="ln"><span>Học vấn</span><span>${EDU_LABEL[p.edu]}</span></div> ${isG?'<div class="info">🎩 Ga lăng</div>':''} ${isS?'<div class="info">💰 Bủn xỉn</div>':''} ${rc>0?`<div class="warn">⚠️ Từ chối: ${Math.round(rc*100)}%</div>`:''} <div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:4px"> ${p.per.slice(0,3).map(t=>`<span class="bd" style="font-size:9px">${TRAITS[t]||t}</span>`).join('')} </div> <div style="font-size:9px;color:#64748b;font-style:italic;margin-top:4px">${p.bio}</div> <div class="npc-a"> <button class="btn pri" onclick="tryMeet('${p.id}')">Kết bạn</button> <button class="btn sec" onclick="skip('${p.id}')">Bỏ</button> </div> </div>`; }).join('')} </div> <button class="btn sec" style="margin-top:8px" onclick="rollProfiles();openMeet();">🔄 Đổi</button> <button class="btn sec" onclick="closeModal()">Đóng</button> `); }
function skip(id){S.currentProfiles=S.currentProfiles.filter(x=>x!==id);openMeet();}
function tryMeet(pid){ const p=NPC_POOL.find(x=>x.id===pid);if(!p)return; const rc=rejectChance(p); if(Math.random()<rc){ addLog(`❌ ${p.n} từ chối.`,'bad'); showModal(`<h2>❌ Bị từ chối</h2><p style="text-align:center;font-size:40px">${p.av}</p><button class="btn sec" onclick="closeModal()">Buồn</button>`); S.currentProfiles=S.currentProfiles.filter(x=>x!==pid); return; } const rid='r'+pid+'_'+Date.now(); const shared=p.hob.filter(h=>S.hobbies.includes(h)); S.rels[rid]={ id:rid,pid:p.id,n:p.n,g:p.g,av:p.av,age:p.age, job:p.job,ap:p.ap,wl:p.wl,edu:p.edu,bg:p.bg, per:[...p.per],hob:[...p.hob],bio:p.bio,views:p.views, bond:10+shared.length*5,love:5+shared.length*3, stage:'friend',angry:false,angryDays:0, expecting:false,expectingWeeks:0 }; 
const locs = Object.values(LOCATIONS); const loc = locs[Math.floor(Math.random()*locs.length)];
S.npcPositions[rid] = { x:(loc.x+Math.random()*loc.w)*TILE, y:(loc.y+loc.h+1+Math.random())*TILE };
S.npcStates[rid] = {facing:'down', walking:false, frame:0, target:null, idleTimer:0};
addLog(`🌐 Kết bạn với ${p.n}!`,'good'); showModal(`<h2>✅ Kết bạn!</h2><p style="text-align:center;font-size:40px">${p.av}</p> <p><b>${p.n}</b> xuất hiện trên bản đồ! Đi lại gần để nói chuyện.</p><button class="btn pri" onclick="closeModal()">OK</button>`); S.currentProfiles=S.currentProfiles.filter(x=>x!==pid); render(); }

// ═══════════ RELATIONS ═══════════
function openRel(){ const list=Object.values(S.rels); let html=`<h2>🤝 Quan hệ (${list.length})</h2>`; const partner=getPartner(); if(partner){html+=`<h3>💗 Người thương</h3>`;html+=renderRelCard(partner,true);} html+=`<h3>🌐 Người quen (${list.length-(partner?1:0)})</h3>`; if(list.length===0){html+=`<p>Chưa quen ai. Bấm 🌐 Gặp.</p>`;} else{ for(const r of list){ if(r.id===S.partnerId)continue; html+=renderRelCard(r,false); } } const marriages=[]; for(const a of NPC_POOL){ for(const b of NPC_POOL){ if(a.id>=b.id)continue; const rel=S.npcRels[a.id]?.[b.id]; if(rel?.status==='married')marriages.push({a,b}); } } if(marriages.length>0){ html+=`<h3>💒 NPC kết hôn</h3>`; html+=marriages.map(m=>`<div class="npc-card m"><div class="npc-h"><span class="av">${m.a.av}</span><span class="nm">${m.a.n}</span>❤️<span class="av">${m.b.av}</span><span class="nm">${m.b.n}</span></div></div>`).join(''); } html+=`<button class="btn sec" style="margin-top:8px" onclick="openMeet()">🌐 Gặp người mới</button>`; html+=`<button class="btn sec" onclick="closeModal()">Đóng</button>`; showModal(html); }
function renderRelCard(r,isPartner){ const shared=r.hob.filter(h=>S.hobbies.includes(h)); const isSameG=r.g===S.gender; const stageLabel={friend:'🤝 Bạn',close:'💛 Bạn thân',bestie:'💜 Bạn thân', brother:'🤜🤛 Chí cốt',crush:'💓 Để ý',dating:'💕 Hẹn hò',engaged:'💍 Đính hôn',married:'💒 Vợ chồng'}[r.stage]||r.stage; const isG=r.per.includes('galant'); const isS=r.per.includes('stingy'); let acts=`<button class="btn sec" onclick="openChat('${r.id}')">💬 Chat</button>`; acts+=`<button class="btn sec" onclick="hang('${r.id}')">Đi chơi</button>`; acts+=`<button class="btn sec" onclick="gift('${r.id}')">Quà</button>`; if(r.g!==S.gender&&r.stage!=='married'&&r.stage!=='engaged'){ acts+=`<button class="btn gold" onclick="dateWith('${r.id}')">Hẹn hò</button>`; } if(isPartner&&r.stage==='dating')acts+=`<button class="btn gold" onclick="openPropose()">💍 Cầu hôn</button>`; if(isPartner&&r.stage==='engaged')acts+=`<button class="btn gold" onclick="openWedding()">💒 Cưới</button>`; if(isPartner&&r.stage==='married'&&!r.expecting)acts+=`<button class="btn gold" onclick="tryPregnant()">👶 Có con</button>`; acts+=`<button class="btn danger" onclick="unfriend('${r.id}')">🚫 Hủy</button>`; const romances=getNpcRomanceStatus({id:r.pid}); const romInfo=romances.filter(x=>x.rel.status!=='none').map(x=>`${x.other.av} ${x.other.n} (${x.rel.status==='married'?'💒':x.rel.status==='dating'?'💕':'💓'})`).join(', '); 
const pos = S.npcPositions[r.id];
let locName = '...';
if(pos){ const px = pos.x+TILE/2, py = pos.y+TILE/2; for(const loc of Object.values(LOCATIONS)){ if(px >= (loc.x-1)*TILE && px <= (loc.x+loc.w+1)*TILE && py >= (loc.y-1)*TILE && py <= (loc.y+loc.h+1)*TILE){ locName = loc.emoji+' '+loc.name; break; } } }
return `<div class="npc-card ${isPartner?'p':''} ${r.angry?'a':''}"> <div class="npc-h"> <span class="av">${r.av}</span><span class="nm">${r.n}</span> <span class="bd">${r.age}t</span> <span class="bd">${JOBS[r.job]?.n||r.job}</span> <span class="bd gold">${stageLabel}</span> ${r.angry?'<span class="bd red">😡</span>':''} ${isG?'<span class="bd gold">🎩</span>':''} ${isS?'<span class="bd red">💰</span>':''} </div> <div style="font-size:10px;color:#38bdf8">📍 ${locName}</div> <div style="font-size:10px;color:#94a3b8">💗 ${Math.round(r.love)} · 🤝 ${Math.round(r.bond)}</div> <div class="bond"><div class="bond-f ${r.love<0?'neg':''}" style="width:${Math.abs(r.love)}%"></div></div> ${shared.length?`<div style="font-size:9px;color:#6ee7b7">Chung: ${shared.map(h=>HOBBIES[h].e).join(' ')}</div>`:''} ${r.love<=-15?`<div class="warn">⚠️ Nguy cơ hủy kết bạn!</div>`:''} ${!isSameG&&r.love>=90&&r.stage!=='dating'&&r.stage!=='engaged'&&r.stage!=='married'?'<div style="font-size:10px;color:#f472b6;font-weight:bold">💗 Có thể tỏ tình!</div>':''} ${r.expecting?`<div style="font-size:10px;color:#fbbf24">🤰 Mang thai</div>`:''} ${romInfo?`<div class="info">NPC khác: ${romInfo}</div>`:''} <div class="npc-a">${acts}</div> </div>`; }
function hang(id){ const r=S.rels[id];if(!r||S.periods+1>21)return; consume(1);r.bond=clamp(r.bond+5); if(r.g!==S.gender)r.love=clamp(r.love+3); apply('mental',5);updateStage(r); addLog(`🤝 Đi chơi với ${r.n}.`,'love'); render();openRel(); }
function dateWith(id){ const r=S.rels[id];if(!r||S.periods+2>21)return; const isG=r.per.includes('galant'); const isS=r.per.includes('stingy'); let cost=300,msg=''; if(isG){cost=0;msg=' — Họ trả hết 🎩';} else if(isS){cost=600;msg=' — Bạn trả gấp đôi 💰';} if(S.st.money<cost){alert('Không đủ tiền.');return;} consume(2); if(cost)apply('money',-cost); r.love=clamp(r.love+12);r.bond=clamp(r.bond+4); apply('mental',10);updateStage(r);S._dated=true; addLog(`💗 Hẹn hò với ${r.n}${msg}`,'love'); render();openRel(); }
function gift(id){ const r=S.rels[id];if(!r||S.periods+1>21)return; if(S.st.money<500){alert('Không đủ tiền.');return;} consume(1);apply('money',-500); r.love=clamp(r.love+15);r.bond=clamp(r.bond+3); apply('mental',3);updateStage(r); addLog(`🎁 Tặng quà cho ${r.n}.`,'love'); render();openRel(); }
function unfriend(id){ const r=S.rels[id];if(!r)return; if(!confirm(`Hủy kết bạn với ${r.n}?`))return; if(S.partnerId===id){S.partnerId=null;syncLove();} delete S.rels[id]; delete S.npcPositions[id]; delete S.npcStates[id]; apply('mental',-8); addLog(`💔 Đã hủy kết bạn với ${r.n}.`,'bad'); closeModal();render(); }
function updateStage(r){ if(['dating','engaged','married'].includes(r.stage))return; const same=r.g===S.gender; if(same){ if(r.bond>=90)r.stage=S.gender==='nam'?'brother':'bestie'; else if(r.bond>=70)r.stage='close'; else r.stage='friend'; }else{ if(r.love>=60)r.stage='crush'; else if(r.bond>=70)r.stage='close'; else r.stage='friend'; } }

// ═══════════ CHAT ═══════════
let _chatId=null;
const CHAT_TOPICS_GLOBAL=[ {id:'greet',n:'👋 Chào',f:2,l:1,r:{vuitinh:'"Ơ cậu đến rồi!"',hoatbat:'"Hi cậu!"',tramtinh:'"Ừ, chào."',lanhlung:'"...Chào."',def:'"Chào cậu!"'}}, {id:'ask',n:'❓ Hỏi thăm',f:3,l:2,r:{quantam:'"Ngày tớ bình thường. Còn cậu?"',noilo:'"Hôm nay tớ hơi lo..."',def:'"Cũng được."'}}, {id:'khen',n:'💐 Khen',f:3,l:4,r:{langman:'"Cậu làm tớ ngại..."',lanhlung:'"Ừ, biết rồi."',def:'"Cảm ơn!"'}}, {id:'share',n:'💭 Chia sẻ',f:4,l:5,r:{sautam:'"...Cảm ơn cậu."',langman:'"Tớ thích người dám nói."',def:'"Ừ, tớ hiểu."'}}, {id:'view_love',n:'💗 Tình yêu',f:3,l:4,view:'love',r:{langman:'"Yêu là cảm xúc."',thucte:'"Yêu phải thực tế."',def:'"Chủ đề khó."'}}, {id:'view_career',n:'💼 Sự nghiệp',f:3,l:3,view:'career',r:{thamvong:'"Sự nghiệp là ưu tiên."',doclap:'"Cần tự do."',def:'"Mỗi người có hướng."'}}, {id:'view_money',n:'💰 Tiền',f:3,l:3,view:'money',r:{stingy:'"Phải tiết kiệm."',thucte:'"Tiền không tự sinh."',def:'"Tiền là công cụ."'}}, {id:'view_family',n:'👨‍👩‍👧 Gia đình',f:4,l:5,view:'family',r:{quantam:'"Tớ muốn gia đình ấm."',doclap:'"Cần không gian riêng."',def:'"Gia đình quan trọng."'}}, {id:'flirt',n:'😘 Thả thính',f:0,l:8,stage:['crush','dating'],r:{langman:'"Tim tớ đập nhanh..."',galant:'"Cậu muốn gì tớ chiều."',def:'"Cậu lạ lắm nha."'}} ];
function openChat(id){ const r=S.rels[id];if(!r)return; _chatId=id; if(!S.chats[id])S.chats[id]=[]; renderChat(); }
function renderChat(){ const r=S.rels[_chatId];if(!r)return; const log=S.chats[_chatId]; const viewsHtml=r.views?` <h3>Quan điểm</h3> <div class="view">💗 ${r.views.love}</div> <div class="view">💼 ${r.views.career}</div> <div class="view">💰 ${r.views.money}</div> <div class="view">👨‍👩‍👧 ${r.views.family}</div> `:''; showModal(` <h2>💬 ${r.av} ${r.n}</h2> <p style="font-size:10px;color:#94a3b8">${r.age}t · ${JOBS[r.job]?.n||r.job} · ${r.per.map(t=>TRAITS[t]).join(' ')}</p> ${r.angry?'<div class="warn">😡 Đang giận bạn</div>':''} ${viewsHtml} <h3>Trò chuyện</h3> <div class="chat" id="chat"> ${log.length===0?'<div class="msg sys">Bắt đầu...</div>':''} ${log.map(m=>`<div class="msg ${m.who}">${m.t}</div>`).join('')} </div> <div style="margin-bottom:6px"> ${CHAT_TOPICS_GLOBAL.filter(t=>!t.stage||t.stage.includes(r.stage)).map(t=> `<button class="topic" onclick="doChat('${t.id}')">${t.n}</button>` ).join('')} </div> <button class="btn sec" onclick="openRel()">← Quay lại</button> `); setTimeout(()=>{const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight;},50); }
function doChat(tid){ const r=S.rels[_chatId];if(!r)return; const t=CHAT_TOPICS_GLOBAL.find(x=>x.id===tid);if(!t)return; S.chats[_chatId].push({who:'you',t:t.n.replace(/^\S+\s/,'')}); if(t.view&&r.views&&r.views[t.view]){ S.chats[_chatId].push({who:'them',t:r.views[t.view]}); if(r.per.some(p=>t.r[p]))r.love=clamp(r.love+3); }else{ let mul=1; if(t.r&&r.per.some(p=>t.r[p]))mul=1.3; if(r.angry)mul=0.3; r.bond=clamp(r.bond+Math.round((t.f||0)*mul)); if(r.g!==S.gender)r.love=clamp(r.love+Math.round((t.l||0)*mul)); let resp=t.r.def; if(r.angry)resp='"..." (họ không muốn nói chuyện)'; else for(const p of r.per){if(t.r[p]){resp=t.r[p];break;}} S.chats[_chatId].push({who:'them',t:resp}); } apply('mental',2);updateStage(r); if(S.chats[_chatId].length>30)S.chats[_chatId].splice(0,S.chats[_chatId].length-30); addLog(`💬 Chat với ${r.n}.`,'love'); render();renderChat(); }

// ═══════════ PROPOSE / WEDDING ═══════════
function openPropose(){ const p=getPartner();if(!p||p.stage!=='dating')return; const love=p.love; let chance; if(love<70)chance=0; else if(love>=95)chance=1; else chance=(love-70)/25; const pct=Math.round(chance*100); showModal(` <h2>💍 Cầu hôn ${p.n}</h2> <div style="background:#0f172a;padding:10px;border-radius:8px;font-size:11px;color:#cbd5e1;margin:10px 0"> Tình cảm: ${Math.round(love)}/100<br>Nhẫn: 5.000đ<br> Cơ hội: <b style="color:${pct>=70?'#22c55e':pct>=30?'#facc15':'#ef4444'}">${pct}%</b> </div> <button class="btn gold" ${S.st.money>=5000?'':'disabled'} onclick="doPropose()">Cầu hôn</button> <button class="btn sec" onclick="openRel()">Để sau</button> `); }
function doPropose(){ const p=getPartner();if(!p||S.st.money<5000)return; let chance; if(p.love<70)chance=0; else if(p.love>=95)chance=1; else chance=(p.love-70)/25; apply('money',-5000); if(Math.random()<chance){ p.stage='engaged';p.love=clamp(p.love+15);syncLove(); apply('mental',20); addLog(`💍 ${p.n} đồng ý!`,'love'); showModal(`<h2>💍 Đồng ý!</h2><p style="text-align:center;font-size:50px">${p.av}</p><button class="btn pri" onclick="openRel()">OK</button>`); }else{ p.love=clamp(p.love-15);syncLove();makeAngry(p,5,2); addLog(`💔 ${p.n} từ chối.`,'bad'); showModal(`<h2>💔 Từ chối</h2><p style="text-align:center;font-size:50px">😢</p><button class="btn sec" onclick="openRel()">Buồn</button>`); } render(); }
function openWedding(){ const p=getPartner();if(!p||p.stage!=='engaged')return; const can=S.st.money>=10000&&S.periods+3<=21; const wage=JOBS[p.job]?.w||500; showModal(` <h2>💒 Đám cưới</h2> <div style="background:#0f172a;padding:10px;border-radius:8px;font-size:11px;color:#cbd5e1;margin:10px 0"> Chi phí: 10.000đ + 3 buổi<br> Sau cưới, ${p.n} đóng góp <b>${fmt(Math.round(wage*5))}/tuần</b> </div> <button class="btn gold" ${can?'':'disabled'} onclick="doWedding()">Tổ chức</button> <button class="btn sec" onclick="openRel()">Để sau</button> `); }
function doWedding(){ const p=getPartner(); if(!p||p.stage!=='engaged'||S.st.money<10000||S.periods+3>21)return; consume(3);if(S.ended)return; apply('money',-10000); p.stage='married';p.love=clamp(p.love+15);syncLove(); apply('mental',30); addLog(`💒 Kết hôn với ${p.n}!`,'love'); showModal(`<h2>💒 Đám cưới</h2><p style="text-align:center;font-size:50px">💍💐🎊</p><button class="btn gold" onclick="openRel()">🎉</button>`); render(); }

// ═══════════ JOBS ═══════════
function openJobs(){ const playerRank=EDU_RANK[S.edu]; const sorted=Object.entries(JOBS).sort((a,b)=>{ const ra=EDU_RANK[a[1].edu]||0,rb=EDU_RANK[b[1].edu]||0; return ra-rb||a[1].w-b[1].w; }); showModal(` <h2>💼 Chọn nghề</h2> <p style="font-size:11px;color:#94a3b8">Học vấn: <b>${EDU_LABEL[S.edu]}</b></p> ${sorted.map(([k,j])=>{ const reqRank=j.edu?EDU_RANK[j.edu]:0; const locked=playerRank<reqRank; const cur=S.job===k; return `<button class="btn ${cur?'pri':'sec'}" style="text-align:left;padding:7px 10px;margin-bottom:3px" ${locked||cur?'disabled':''} onclick="changeJob('${k}')"> ${j.i} ${j.n} — ${fmt(j.w)}/ngày ${locked?`<br><small style="color:#fca5a5">🔒 Cần ${EDU_LABEL[j.edu]}</small>`:''} ${cur?'<br><small>Đang làm</small>':''} </button>`; }).join('')} <button class="btn sec" style="margin-top:8px" onclick="closeModal()">Đóng</button> `); }
function changeJob(k){ const j=JOBS[k];if(!j)return; const reqRank=j.edu?EDU_RANK[j.edu]:0; if(EDU_RANK[S.edu]<reqRank)return; S.job=k; addLog(`Chuyển sang: ${j.i} ${j.n}`,'info'); closeModal();render(); }

// ═══════════ MODAL ═══════════
function showModal(h){document.getElementById('mbox').innerHTML=h;document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};

// ═══════════ RENDER UI ═══════════
function render(){ if(!S||!S.gender)return; const t=time(); document.getElementById('w').textContent=S.week; document.getElementById('d').textContent=t.dw; document.getElementById('p').textContent=t.pn; document.getElementById('money').textContent=fmt(S.st.money); document.getElementById('job').textContent=JOBS[S.job].i+' '+JOBS[S.job].n; document.getElementById('edu').textContent=EDU_LABEL[S.edu]+(S.eduProgress?` (${S.eduProgress})`:''); 
document.getElementById('timeHud').textContent=t.pn+' · '+t.dwFull;
const p=getPartner(); const pt=document.getElementById('partnerTag'); if(p){pt.style.display='';pt.textContent=`${p.av} ${p.n}`;} else pt.style.display='none'; 
const defs=[ {k:'health',l:'❤️',c:'#ef4444'},{k:'energy',l:'⚡',c:'#facc15'}, {k:'mental',l:'🧠',c:'#a78bfa'},{k:'skill',l:'📚',c:'#38bdf8'}, {k:'love',l:'💗',c:'#ec4899'},{k:'passion',l:'🔥',c:'#fb923c'} ]; 
document.getElementById('stats').innerHTML=defs.map(d=>{ const v=S.st[d.k]; return `<div class="stat"><div class="lbl"><span>${d.l} ${d.k}</span><span>${Math.round(v)}</span></div><div class="bar"><div class="fill" style="width:${v}%;background:${d.c}"></div></div></div>`; }).join(''); 
document.getElementById('acts').innerHTML=ACTIONS.map(a=>{ const dis=S.ended||S.periods+a.c>21 ||(a.once&&((a.id==='work'&&S._worked)||(a.id==='study'&&S._schooled))) ||(a.afterWork&&!S._worked) ||(a.minMoney&&S.st.money<a.minMoney); const lock=(a.afterWork&&!S._worked)?' 🔒':''; return `<button class="act ${a.ent?'ent':''}" data-id="${a.id}" ${dis?'disabled':''}>${a.n}${lock}<span class="cost">-${a.c} buổi${a.transport?' · +'+a.transport+'đ':''}</span></button>`; }).join(''); 
document.querySelectorAll('.act').forEach(b=>b.onclick=()=>doAction(b.dataset.id)); 
document.getElementById('log').innerHTML=S.log.map(e=> `<div class="e ${e.t}"><b>T${e.w}:</b> ${e.m}</div>`).join(''); 
save(); }

// ═══════════ START ═══════════
function showStart(){ window._g=null;window._h=[]; showModal(` <h2>Chào mừng đến Nhịp Đời 2D</h2> <p>Tạo nhân vật và khám phá thị trấn!</p> <h3>Giới tính</h3> <div class="opt"> <button onclick="pickG(this,'nam')">👨 Nam</button> <button onclick="pickG(this,'nu')">👩 Nữ</button> <button onclick="pickG(this,'khac')">🧑 Khác</button> </div> <h3>Tên</h3> <input class="inp" id="nm" maxlength="20" placeholder="Nhập tên..."> <h3>Sở thích (2-3)</h3> <div class="opt" id="hobbies"> ${Object.entries(HOBBIES).map(([k,v])=>`<button onclick="pickH(this,'${k}')">${v.e} ${v.n}</button>`).join('')} </div> <button class="btn pri" style="margin-top:12px" onclick="startGame()">Bắt đầu cuộc đời</button> `); }
function pickG(b,g){window._g=g;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');} 
function pickH(b,h){ const i=window._h.indexOf(h); if(i>=0){window._h.splice(i,1);b.classList.remove('sel');} else if(window._h.length<3){window._h.push(h);b.classList.add('sel');} }
function startGame(){ if(!window._g)return alert('Chọn giới tính.'); if(window._h.length<2)return alert('Chọn ít nhất 2 sở thích.'); S=newState(); S.gender=window._g; S.name=(document.getElementById('nm').value||'').trim()||'Bạn'; S.hobbies=[...window._h]; 
S.playerPos = {x:8*TILE, y:7*TILE};
// Tùy chỉnh appearance theo giới tính
if(window._g === 'nu'){ S.playerAppearance = {hair:'#7c2d12', hairStyle:'long', shirt:'#ec4899', pants:'#1e293b', skin:'#fcd5b5'}; }
else if(window._g === 'nam'){ S.playerAppearance = {hair:'#1f2937', hairStyle:'short', shirt:'#3b82f6', pants:'#1e293b', skin:'#fcd5b5'}; }
else { S.playerAppearance = {hair:'#a855f7', hairStyle:'messy', shirt:'#facc15', pants:'#4c1d95', skin:'#fcd5b5'}; }
for(const npc of NPC_POOL)S.npcRels[npc.id]={}; 
addLog(`Chào ${S.name}!`,'info'); addLog('Đi lang thang và gặp gỡ NPC!','info'); addLog('💡 Bấm vào bản đồ để tự động đi tới.','info');
closeModal();render(); }

// ═══════════ END ═══════════
function gameOver(reason,detail){ S.ended=true; const kids=S.children.map(c=>`👶 ${c.name} (${c.gender==='nam'?'trai':'gái'}, ${c.age} tuần)`).join('<br>')||'Chưa có con'; showModal(`<h2>🏁 ${reason}</h2><p>${detail}</p> <p><b>${S.name}</b><br> Tuần: ${Math.min(S.week,52)}<br>Tiền: ${fmt(S.st.money)}<br> Nghề: ${JOBS[S.job].i} ${JOBS[S.job].n}<br> Người thương: ${getPartner()?getPartner().n:'Độc thân'}</p> <p><b>Con cái:</b><br>${kids}</p> <button class="btn pri" onclick="hardReset()">Chơi lại</button>`); render(); }
function summary(){ if(S.st.money>100000)return 'Bạn giàu có.'; if(S.children.length>0&&S.st.mental>70)return 'Gia đình hạnh phúc.'; if(S.st.mental>70)return 'Bình yên.'; return 'Một năm trôi qua.'; }
function hardReset(){ S=newState();closeModal(); showStart();render(); }

// ═══════════ WIRE ═══════════
document.getElementById('endBtn').onclick=()=>{ if(S.ended)return; const left=21-S.periods; if(left>0&&!confirm(`Còn ${left} buổi. Kết thúc tuần?`))return; while(!S.ended&&S.periods<21)consume(Math.min(3,21-S.periods)); render(); };
document.getElementById('relBtn').onclick=openRel; 
document.getElementById('childBtn').onclick=openChildren; 
document.getElementById('jobBtn').onclick=openJobs; 
document.getElementById('assetsBtn').onclick=openAssets;
document.getElementById('logoutBtn').onclick=()=>{ if(!confirm('Chơi lại từ đầu?'))return; localStorage.removeItem('nhipdoi3d_save'); location.reload(); };

document.querySelectorAll('#dpad button[data-dir]').forEach(btn=>{
  const dir = btn.dataset.dir;
  const press = (e)=>{ e.preventDefault(); keys[dir]=true; };
  const release = (e)=>{ e.preventDefault(); keys[dir]=false; };
  btn.addEventListener('touchstart', press, {passive:false});
  btn.addEventListener('touchend', release, {passive:false});
  btn.addEventListener('touchcancel', release, {passive:false});
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
});
window.addEventListener('keydown', e=>{
  if(e.key==='ArrowUp'||e.key==='w') keys.up=true;
  if(e.key==='ArrowDown'||e.key==='s') keys.down=true;
  if(e.key==='ArrowLeft'||e.key==='a') keys.left=true;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=true;
});
window.addEventListener('keyup', e=>{
  if(e.key==='ArrowUp'||e.key==='w') keys.up=false;
  if(e.key==='ArrowDown'||e.key==='s') keys.down=false;
  if(e.key==='ArrowLeft'||e.key==='a') keys.left=false;
  if(e.key==='ArrowRight'||e.key==='d') keys.right=false;
});

// ═══════════ INIT ═══════════
async function init(){
  try{ const {user}=await API.me(); _user=user; }catch{ _user={username:'Người chơi'}; }
  const ok=await load();
  if(!ok||!S.gender){ S=newState();render();showStart(); }
  else{
    if(!S.npcRels)S.npcRels={}; for(const npc of NPC_POOL)if(!S.npcRels[npc.id])S.npcRels[npc.id]={};
    if(!S.children)S.children=[];
    if(!S.assets)S.assets={ house:'none', car:'none', business:'none' };
    if(!S.npcPositions)S.npcPositions={};
    if(!S.npcStates)S.npcStates={};
    if(!S.playerPos)S.playerPos={x:8*TILE, y:7*TILE};
    if(!S.playerAppearance)S.playerAppearance={hair:'#1f2937', hairStyle:'short', shirt:'#8b5cf6', pants:'#1e293b', skin:'#fcd5b5'};
    for(const r of Object.values(S.rels)){ if(r.angry===undefined)r.angry=false; if(r.angryDays===undefined)r.angryDays=0; if(r.expecting===undefined){r.expecting=false;r.expectingWeeks=0;} }
    initNpcPositions();
    setSv('saved'); render();
  }
  buildTravelBar();
  gameLoop();
}

// ═══════════ GAME LOOP ═══════════
let _gameLoopStarted = false;
function gameLoop(){
  if(_gameLoopStarted) return;
  _gameLoopStarted = true;
  function tick(now){
    if(S && S.gender){
      updatePlayer();
      updateNpcs();
      checkInteraction();
      drawWorld(now || 0);
      const locInfo = getPlayerLocation();
      document.getElementById('locName').textContent = locInfo.loc.emoji + ' ' + locInfo.loc.name;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// Polyfill roundRect
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(w<2*r)r=w/2; if(h<2*r)r=h/2;
    this.beginPath();
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r); this.closePath();
    return this;
  };
}

Object.assign(window,{ pickG,pickH,startGame,showModal,closeModal,tryMeet,skip,rollProfiles, openChat,doChat,openRel,hang,gift,hardReset,openMeet,unfriend,openJobs, changeJob,openPropose,doPropose,openWedding,doWedding,dateWith, tryPregnant,openChildren,playWithChild,buyForChild,sendChildToSchool, openAssets,buyAsset,rejectNpcProposal });
init();
