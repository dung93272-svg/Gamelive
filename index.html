<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Nhịp Đời Anime 2D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#eaeaea;min-height:100vh;padding:8px;display:flex;justify-content:center;overflow-x:hidden}
.game{width:100%;max-width:1050px;background:#0f172a;border-radius:16px;padding:12px}
h1{font-size:18px;text-align:center;background:linear-gradient(90deg,#ff9eb5,#c4b5fd,#7dd3fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;margin:8px 0}
.tag{font-size:11px;background:#1e293b;padding:3px 8px;border-radius:20px}
.tag.m{background:linear-gradient(135deg,#064e3b,#065f46);color:#6ee7b7;font-weight:bold}
.tag.w{color:#facc15;font-weight:bold}
.tag.j{color:#7dd3fc}.tag.r{color:#c4b5fd}.tag.k{color:#ff9eb5;font-weight:bold}
.tag.sv{font-size:10px;color:#64748b}
.tag.sv.saving{color:#facc15}.tag.sv.saved{color:#22c55e}.tag.sv.err{color:#ef4444}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:4px;margin-bottom:8px}
.stat{background:#1e293b;border-radius:8px;padding:5px 8px}
.stat .lbl{font-size:10px;color:#94a3b8;display:flex;justify-content:space-between}
.bar{height:5px;background:#0f172a;border-radius:4px;margin-top:4px;overflow:hidden}
.fill{height:100%;transition:.4s;border-radius:4px}
#worldWrap{position:relative;background:#0f172a;border-radius:12px;overflow:hidden;margin-bottom:6px;border:2px solid #1e293b}
#world{display:block;width:100%;height:auto;cursor:pointer;touch-action:none;image-rendering:auto}
#hud{position:absolute;top:6px;left:6px;right:6px;display:flex;justify-content:space-between;pointer-events:none;gap:6px;flex-wrap:wrap}
#locName{background:rgba(15,23,42,.9);padding:4px 10px;border-radius:8px;font-size:11px;color:#facc15;font-weight:bold;border:1px solid #334155}
#timeHud{background:rgba(15,23,42,.9);padding:4px 10px;border-radius:8px;font-size:12px;color:#7dd3fc;font-weight:bold;border:1px solid #334155;font-variant-numeric:tabular-nums}
#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.85);padding:4px 12px;border-radius:20px;font-size:10px;color:#94a3b8;pointer-events:none;border:1px solid #334155;transition:opacity .5s}
#interactBtn{position:absolute;bottom:8px;right:8px;background:linear-gradient(135deg,#c084fc,#f472b6);border:none;color:#fff;padding:8px 14px;border-radius:20px;font-weight:bold;font-size:12px;display:none;cursor:pointer;box-shadow:0 4px 12px rgba(192,132,252,.5);z-index:5;font-family:inherit}
#interactBtn.on{display:block;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.travelbar{display:flex;gap:4px;overflow-x:auto;padding:4px 2px;margin-bottom:6px;scrollbar-width:thin}
.travelbar button{background:#1e293b;border:1px solid #334155;color:#e2e8f0;padding:5px 9px;border-radius:8px;font-size:10px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.15s}
.travelbar button:hover{background:#334155;border-color:#c084fc;color:#facc15}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:700px){.panels{grid-template-columns:1fr}}
.panel{background:#1e293b;border-radius:10px;padding:10px}
.panel h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;margin-bottom:6px}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px;max-height:280px;overflow-y:auto}
.act{background:#334155;border:none;color:#e2e8f0;padding:7px 9px;border-radius:8px;cursor:pointer;font-size:11px;text-align:left;font-family:inherit}
.act:hover:not(:disabled){background:#475569}
.act:disabled{opacity:.35;cursor:not-allowed}
.act .cost{font-size:9px;color:#94a3b8;display:block;margin-top:2px}
.act.ent{background:#3b2f52}
.log{max-height:280px;overflow-y:auto;font-size:11px}
.e{padding:5px 7px;border-radius:6px;margin-bottom:3px;background:#0f172a;border-left:3px solid #334155}
.e.good{border-left-color:#22c55e}.e.bad{border-left-color:#ef4444}
.e.love{border-left-color:#ec4899}.e.info{border-left-color:#38bdf8}
.e.npc{border-left-color:#f59e0b;background:#1a1206}
.e.child{border-left-color:#fbbf24;background:#2a1f0a}
.e.money{border-left-color:#6ee7b7;background:#052e16}
.e.day{background:#1e293b;color:#facc15;text-align:center;font-weight:bold}
.bottom{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.btn{flex:1;min-width:70px;padding:9px 10px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px;font-family:inherit;transition:.15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,#c084fc,#f472b6);color:#fff}
.btn.sec{background:#334155;color:#e2e8f0}.btn.sec:hover:not(:disabled){background:#475569}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#facc15);color:#1c1917}
.btn.danger{background:#7f1d1d;color:#fecaca}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:12px;z-index:100}
.modal.on{display:flex}
.mbox{background:#1e293b;border-radius:14px;padding:16px;max-width:680px;width:100%;max-height:92vh;overflow-y:auto}
.mbox h2{font-size:16px;margin-bottom:8px;color:#f472b6}
.mbox h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8;margin:10px 0 5px}
.mbox p{font-size:12px;color:#cbd5e1;line-height:1.5;margin-bottom:8px}
.mbox .btn{width:100%;margin-top:5px}
.opt{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.opt button{flex:1;min-width:70px;padding:7px 9px;background:#334155;border:2px solid transparent;color:#e2e8f0;border-radius:8px;cursor:pointer;font-size:11px;font-family:inherit}
.opt button.sel{border-color:#c084fc;background:#4c1d95}
.inp{width:100%;padding:9px 10px;background:#0f172a;border:1px solid #334155;color:#eaeaea;border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.card{background:#0f172a;border:2px solid #1e293b;border-radius:10px;padding:9px}
.card .av{font-size:30px;text-align:center}
.card .nm{font-weight:bold;color:#facc15;text-align:center;font-size:13px;margin:3px 0}
.card .s2{font-size:10px;color:#94a3b8;text-align:center;margin-bottom:5px}
.ln{display:flex;justify-content:space-between;font-size:10px;color:#cbd5e1;margin:2px 0}
.ln span:last-child{color:#facc15;font-weight:bold}
.chat{background:#0f172a;border-radius:10px;padding:10px;height:250px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
.msg{max-width:78%;padding:7px 11px;border-radius:12px;font-size:11px;line-height:1.4}
.msg.you{align-self:flex-end;background:linear-gradient(135deg,#c084fc,#f472b6);color:#fff}
.msg.them{align-self:flex-start;background:#1e293b;color:#e2e8f0}
.msg.sys{align-self:center;font-size:10px;color:#94a3b8;font-style:italic;background:transparent}
.topic{background:#1e3a5f;border:none;color:#e2e8f0;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:10px;font-family:inherit;margin:2px}
.npc-card{background:#0f172a;border-radius:10px;padding:9px;margin-bottom:6px;border-left:3px solid #c084fc}
.npc-card.p{border-left-color:#ec4899;background:linear-gradient(135deg,#1f0a1e,#2a0f30)}
.npc-card.m{border-left-color:#22c55e;background:linear-gradient(135deg,#052e16,#0a3d1f)}
.npc-card.a{border-left-color:#ef4444;background:linear-gradient(135deg,#1a0505,#2a0808)}
.npc-card.c{border-left-color:#fbbf24;background:linear-gradient(135deg,#2a1f0a,#3a2a0f)}
.npc-h{display:flex;align-items:center;gap:5px;margin-bottom:5px;flex-wrap:wrap}
.npc-h .av{font-size:20px}.npc-h .nm{font-weight:bold;color:#facc15;font-size:12px}
.bd{font-size:9px;background:#1e293b;padding:2px 7px;border-radius:10px;color:#cbd5e1}
.bd.gold{background:#78350f;color:#fde68a}.bd.red{background:#7f1d1d;color:#fecaca}
.bd.blue{background:#1e3a8a;color:#93c5fd}.bd.green{background:#064e3b;color:#6ee7b7}
.bond{height:5px;background:#1e293b;border-radius:4px;overflow:hidden;margin:5px 0}
.bond-f{height:100%;background:linear-gradient(90deg,#ec4899,#c084fc);transition:.3s}
.bond-f.neg{background:linear-gradient(90deg,#991b1b,#dc2626)}
.npc-a{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.npc-a .btn{padding:5px 7px;font-size:10px;flex:1;min-width:0;margin:0}
.view{font-size:10px;font-style:italic;color:#c4b5fd;background:#1a1330;border-left:2px solid #c084fc;padding:3px 7px;border-radius:4px;margin:4px 0}
.warn{font-size:10px;color:#fca5a5;font-weight:bold;background:#2a0505;padding:3px 7px;border-radius:4px;margin:4px 0}
.info{font-size:9px;color:#f59e0b;padding:2px 0}
.asset-card{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.asset-info h4{color:#facc15;font-size:12px;margin-bottom:3px}
.asset-info p{font-size:10px;color:#94a3b8;margin:0}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#475569;border-radius:4px}
</style>
</head>

const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const clampInt=v=>Math.max(-100,Math.min(100,v));
const fmt=v=>(v<0?'-':'')+Math.abs(Math.round(v)).toLocaleString('vi-VN')+'đ';
const pad2 = n => String(n).padStart(2, '0');

function getGameTime(){
  const total = Math.floor(S.gameMinutes);
  const day = Math.floor(total / (24*60)) + 1;
  const minOfDay = total % (24*60);
  const hour = Math.floor(minOfDay / 60);
  const minute = minOfDay % 60;
  const dayOfWeek = (day - 1) % 7;
  return {day, hour, minute, dayOfWeek, dw:['T2','T3','T4','T5','T6','T7','CN'][dayOfWeek], dwFull:['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'][dayOfWeek]};
}
function getScheduleSlot(){
  const h = getGameTime().hour;
  if(h >= 22 || h < 5) return 'night';
  if(h >= 5 && h < 12) return 'work';
  if(h >= 12 && h < 14) return 'lunch';
  if(h >= 14 && h < 18) return 'afternoon';
  if(h >= 18 && h < 22) return 'evening';
  return 'home';
}
function addLog(m,t='info'){ const tt = getGameTime(); S.log.unshift({m,t,day:tt.day,dw:tt.dw,time:`${pad2(tt.hour)}:${pad2(tt.minute)}`}); if(S.log.length>120)S.log.pop(); }
function apply(k,v){ if(k==='money'){S.st.money=Math.round(S.st.money+v);return;} if(['skill','love','passion'].includes(k)){S.st[k]=clamp(S.st[k]+v);return;} S.st[k]=clamp(S.st[k]+v); }
function getPartner(){return S.partnerId?S.rels[S.partnerId]:null;}
function syncLove(){const p=getPartner();S.st.love=p?Math.max(0,p.love):0;}
function difficulty(p){return Math.round(p.ap*3+p.wl*0.4+(EDU_RANK[p.edu]||1)*15);}
function prestige(){ const assetVal = (HOUSES.find(h=>h.id===S.assets.house)?.p||0) + (CARS.find(c=>c.id===S.assets.car)?.p||0) + (BUSINESS.find(b=>b.id===S.assets.business)?.p||0); return Math.round((S.st.money + assetVal)/1200 + EDU_RANK[S.edu]*15 + S.st.skill*0.6); }
function rejectChance(p){ const need=difficulty(p)*1.2,pre=prestige(); if(pre>=need)return 0; return Math.min(0.9,(need-pre)/need*0.9); }

// ═══════════ TILE DRAWING ═══════════
function drawTile(x, y, type, t){
  const px = x*TILE, py = y*TILE;
  if(type===0){ // grass
    const grad = ctx.createLinearGradient(px, py, px, py+TILE);
    grad.addColorStop(0, '#7cbf5a');
    grad.addColorStop(1, '#5da83e');
    ctx.fillStyle = grad; ctx.fillRect(px,py,TILE,TILE);
    // Grass tufts
    ctx.strokeStyle = '#4a8f33'; ctx.lineWidth = 1;
    for(let i=0;i<5;i++){
      const gx = px + 3 + (i*7)%26, gy = py + 6 + (i*11)%22;
      ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx-1, gy-3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(gx+2, gy); ctx.lineTo(gx+3, gy-2); ctx.stroke();
    }
  } else if(type===1){ // stone path
    const grad = ctx.createLinearGradient(px, py, px, py+TILE);
    grad.addColorStop(0, '#c9b8a0');
    grad.addColorStop(1, '#a89478');
    ctx.fillStyle = grad; ctx.fillRect(px,py,TILE,TILE);
    // Stone pattern
    ctx.strokeStyle = 'rgba(90,70,50,.3)'; ctx.lineWidth = 1;
    ctx.strokeRect(px+2, py+2, 13, 13);
    ctx.strokeRect(px+17, py+2, 13, 13);
    ctx.strokeRect(px+2, py+17, 13, 13);
    ctx.strokeRect(px+17, py+17, 13, 13);
  } else if(type===2){ // water
    const grad = ctx.createLinearGradient(px, py, px, py+TILE);
    grad.addColorStop(0, '#4fc3f7');
    grad.addColorStop(1, '#29b6f6');
    ctx.fillStyle = grad; ctx.fillRect(px,py,TILE,TILE);
    // Ripples
    const w = Math.sin(t/400 + x*0.5 + y*0.3)*2;
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(px+8+w, py+10, 6, 1.5, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px+22-w, py+22, 5, 1.2, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.6)';
    ctx.beginPath(); ctx.ellipse(px+16, py+16+w, 3, 1, 0, 0, Math.PI*2); ctx.fill();
  } else if(type===3){ // flower grass
    const grad = ctx.createLinearGradient(px, py, px, py+TILE);
    grad.addColorStop(0, '#8ccf6e');
    grad.addColorStop(1, '#6cb84a');
    ctx.fillStyle = grad; ctx.fillRect(px,py,TILE,TILE);
    // Flowers
    const colors = ['#ff9ec4','#ffd93d','#ff8c42','#c084fc'];
    for(let i=0;i<4;i++){
      const fx = px+5+(i*7)%22, fy = py+7+(i*6)%20;
      ctx.fillStyle = colors[i%4];
      ctx.beginPath(); ctx.arc(fx, fy, 2.2, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff59d';
      ctx.beginPath(); ctx.arc(fx, fy, 0.9, 0, Math.PI*2); ctx.fill();
    }
  } else if(type===4){ // stone
    const grad = ctx.createLinearGradient(px, py, px, py+TILE);
    grad.addColorStop(0, '#b0a89a');
    grad.addColorStop(1, '#8a8275');
    ctx.fillStyle = grad; ctx.fillRect(px,py,TILE,TILE);
    ctx.strokeStyle = 'rgba(60,50,40,.4)';
    ctx.strokeRect(px+2, py+2, 28, 28);
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    ctx.fillRect(px+4, py+4, 6, 2);
  }
}

// ═══════════ CHERRY BLOSSOM TREE ═══════════
function drawTree(tree, t){
  const px = tree.x*TILE + TILE/2;
  const py = tree.y*TILE + TILE - 4;
  const sway = Math.sin(t/800 + tree.x)*1;
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(px, py+2, 14, 4, 0, 0, Math.PI*2); ctx.fill();
  
  // Trunk
  const trunkGrad = ctx.createLinearGradient(px-4, py-30, px+4, py);
  trunkGrad.addColorStop(0, '#7a5230');
  trunkGrad.addColorStop(1, '#4a2f18');
  ctx.fillStyle = trunkGrad;
  ctx.beginPath();
  ctx.moveTo(px-4, py);
  ctx.quadraticCurveTo(px-3, py-18, px-2+sway, py-32);
  ctx.lineTo(px+2+sway, py-32);
  ctx.quadraticCurveTo(px+3, py-18, px+4, py);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#2d1a0a'; ctx.lineWidth = 0.8; ctx.stroke();
  
  // Branches
  ctx.strokeStyle = '#5a3a1f'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(px, py-22); ctx.lineTo(px-12+sway, py-30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px, py-26); ctx.lineTo(px+13+sway, py-34); ctx.stroke();
  
  // Canopy - cherry blossoms
  const c1 = '#ffb3d1', c2 = '#ff8eb8', c3 = '#f56ba0';
  const cx = px + sway, cy = py - 38;
  // Shadow layer
  ctx.fillStyle = c3;
  ctx.beginPath(); ctx.arc(cx, cy+2, 16, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx-12, cy, 12, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+12, cy, 12, 0, Math.PI*2); ctx.fill();
  // Mid layer
  ctx.fillStyle = c2;
  ctx.beginPath(); ctx.arc(cx-2, cy-2, 14, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx-11, cy-3, 10, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+11, cy-3, 10, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy-12, 11, 0, Math.PI*2); ctx.fill();
  // Top highlights
  ctx.fillStyle = c1;
  ctx.beginPath(); ctx.arc(cx-4, cy-6, 8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx+6, cy-8, 7, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx-10, cy-4, 6, 0, Math.PI*2); ctx.fill();
  // Detail dots
  ctx.fillStyle = '#ffffff';
  for(let i=0;i<6;i++){
    const dx = Math.sin(i*2.1)*10;
    const dy = Math.cos(i*3.3)*8;
    ctx.beginPath(); ctx.arc(cx+dx, cy+dy-4, 1.3, 0, Math.PI*2); ctx.fill();
  }
}

// ═══════════ BUILDING ANIME STYLE ═══════════
function drawBuilding(loc, t){
  const px = loc.x*TILE, py = loc.y*TILE, w = loc.w*TILE, h = loc.h*TILE;
  const hour = getGameTime().hour;
  const isNight = hour >= 19 || hour < 6;
  const roofH = 24;
  const bodyY = py + roofH;
  const bodyH = h - roofH;
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath();
  ctx.ellipse(px+w/2, py+h-2, w*0.55, 5, 0, 0, Math.PI*2);
  ctx.fill();
  
  // Body (paper wall)
  const bodyGrad = ctx.createLinearGradient(px, bodyY, px, bodyY+bodyH);
  bodyGrad.addColorStop(0, loc.color);
  bodyGrad.addColorStop(1, shade(loc.color, -18));
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(px, bodyY, w, bodyH);
  
  // Wooden frame
  ctx.strokeStyle = loc.accent; ctx.lineWidth = 3;
  ctx.strokeRect(px+1.5, bodyY+1.5, w-3, bodyH-3);
  
  // Vertical wood beams
  const beams = Math.max(2, Math.floor(w/26));
  ctx.lineWidth = 2;
  for(let i=1;i<beams;i++){
    const bx = px + i*w/beams;
    ctx.beginPath(); ctx.moveTo(bx, bodyY); ctx.lineTo(bx, bodyY+bodyH); ctx.stroke();
  }
  
  // Windows (paper sliding doors - shoji)
  const winCols = Math.max(2, Math.floor(w/24));
  for(let i=0;i<winCols;i++){
    const wx = px + 8 + i*(w-16)/winCols;
    const wy = bodyY + 12;
    const ww = Math.max(8, (w-16)/winCols - 6);
    const wh = 16;
    // Window light
    ctx.fillStyle = isNight ? 'rgba(255,230,140,.95)' : 'rgba(255,250,220,.7)';
    ctx.fillRect(wx, wy, ww, wh);
    // Shoji grid
    ctx.strokeStyle = 'rgba(80,60,40,.7)'; ctx.lineWidth = 0.8;
    ctx.strokeRect(wx+0.5, wy+0.5, ww-1, wh-1);
    ctx.beginPath();
    ctx.moveTo(wx, wy+wh/2); ctx.lineTo(wx+ww, wy+wh/2);
    ctx.moveTo(wx+ww/2, wy); ctx.lineTo(wx+ww/2, wy+wh);
    ctx.stroke();
    // Night glow
    if(isNight){
      ctx.fillStyle = 'rgba(255,230,140,.2)';
      ctx.beginPath(); ctx.arc(wx+ww/2, wy+wh/2, 18, 0, Math.PI*2); ctx.fill();
    }
  }
  
  // Door
  const doorW = Math.min(20, w*0.4);
  const doorH = Math.min(22, bodyH-26);
  const dx = px + w/2 - doorW/2;
  const dy = bodyY + bodyH - doorH;
  ctx.fillStyle = '#3a2515';
  ctx.fillRect(dx, dy, doorW, doorH);
  ctx.strokeStyle = '#1a0a05'; ctx.lineWidth = 1.5;
  ctx.strokeRect(dx+0.5, dy+0.5, doorW-1, doorH-1);
  ctx.beginPath();
  ctx.moveTo(dx + doorW/2, dy); ctx.lineTo(dx + doorW/2, dy+doorH);
  ctx.stroke();
  
  // Curved Japanese roof
  ctx.fillStyle = loc.roof;
  ctx.strokeStyle = shade(loc.roof, -40); ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(px - 4, bodyY);
  ctx.quadraticCurveTo(px + w*0.1, py + 4, px + w*0.2, py + 2);
  ctx.lineTo(px + w*0.8, py + 2);
  ctx.quadraticCurveTo(px + w*0.9, py + 4, px + w + 4, bodyY);
  ctx.quadraticCurveTo(px + w*0.95, bodyY - 2, px + w*0.85, bodyY - 4);
  ctx.lineTo(px + w*0.15, bodyY - 4);
  ctx.quadraticCurveTo(px + w*0.05, bodyY - 2, px - 4, bodyY);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  
  // Roof ridge highlight
  ctx.strokeStyle = shade(loc.roof, 40); ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(px + w*0.2, py + 3);
  ctx.lineTo(px + w*0.8, py + 3);
  ctx.stroke();
  
  // Roof tile lines
  ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 0.8;
  for(let i=1;i<5;i++){
    const rx = px + i*w/5;
    ctx.beginPath();
    ctx.moveTo(rx, bodyY-2);
    ctx.lineTo(px + w/2 + (i-2.5)*w*0.07, py + 2 + roofH*0.5);
    ctx.stroke();
  }
  
  // Sign board (wooden)
  ctx.font = 'bold 9px sans-serif';
  const nameWidth = ctx.measureText(loc.name).width;
  const signW = Math.max(46, nameWidth + 34);
  ctx.fillStyle = '#8b6f4a';
  ctx.strokeStyle = '#4a3520'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(px + w/2 - signW/2, bodyY - 6, signW, 14, 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fdf6e3';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(loc.emoji + ' ' + loc.name, px + w/2, bodyY + 1);
  
  // Paper lantern at night
  if(isNight){
    const lx = px + 6, ly = bodyY + 4;
    ctx.fillStyle = 'rgba(255,200,80,.9)';
    ctx.beginPath(); ctx.ellipse(lx, ly, 3, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#8b4513'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(lx, ly-5); ctx.lineTo(lx, ly-8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx, ly+5); ctx.lineTo(lx, ly+8); ctx.stroke();
    ctx.fillStyle = 'rgba(255,200,80,.25)';
    ctx.beginPath(); ctx.arc(lx, ly, 14, 0, Math.PI*2); ctx.fill();
  }
}

// ═══════════ ANIME CHIBI CHARACTER ═══════════
function drawCharacter(char, px, py, facing, walking, frame){
  const cx = px + TILE/2;
  const bob = walking ? Math.sin(frame*0.35)*1.3 : Math.sin(Date.now()/900)*0.5;
  const legSwing = walking ? Math.sin(frame*0.35)*4 : 0;
  const armSwing = walking ? Math.sin(frame*0.35)*3.5 : 0;
  const cy = py + TILE/2 + bob;
  
  // Shadow (soft)
  const shGrad = ctx.createRadialGradient(cx, py+TILE-2, 1, cx, py+TILE-2, 12);
  shGrad.addColorStop(0, 'rgba(0,0,0,.4)');
  shGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = shGrad;
  ctx.beginPath(); ctx.ellipse(cx, py+TILE-2, 12, 4, 0, 0, Math.PI*2); ctx.fill();
  
  // ===== LEGS =====
  const legY = cy + 7;
  ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 1.3;
  // Back leg
  ctx.fillStyle = shade(char.pants, -20);
  ctx.beginPath(); ctx.roundRect(cx-4.5, legY+legSwing, 4, 8, 1.5); ctx.fill(); ctx.stroke();
  // Front leg
  ctx.fillStyle = char.pants;
  ctx.beginPath(); ctx.roundRect(cx+0.5, legY-legSwing, 4, 8, 1.5); ctx.fill(); ctx.stroke();
  // Shoes
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath(); ctx.roundRect(cx-5, legY+7+legSwing, 5, 3, 1.5); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx+0, legY+7-legSwing, 5, 3, 1.5); ctx.fill();
  
  // ===== BODY =====
  const bodyY = cy - 6;
  const bodyGrad = ctx.createLinearGradient(cx-7, bodyY, cx+7, bodyY+12);
  bodyGrad.addColorStop(0, char.shirt);
  bodyGrad.addColorStop(1, char.shirtAccent || shade(char.shirt, -30));
  ctx.fillStyle = bodyGrad;
  ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.roundRect(cx-7, bodyY, 14, 12, 4); ctx.fill(); ctx.stroke();
  
  // Shirt highlight
  ctx.fillStyle = 'rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.roundRect(cx-5, bodyY+1.5, 3, 8, 1.5); ctx.fill();
  
  // Collar
  ctx.fillStyle = char.shirtAccent || shade(char.shirt, -40);
  ctx.beginPath();
  ctx.moveTo(cx-3.5, bodyY+0.5); ctx.lineTo(cx, bodyY+4); ctx.lineTo(cx+3.5, bodyY+0.5);
  ctx.closePath(); ctx.fill();
  
  // ===== ARMS =====
  const armY = cy - 5;
  ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 1.3;
  // Back arm
  ctx.fillStyle = shade(char.shirt, -25);
  ctx.beginPath(); ctx.roundRect(cx-9.5, armY+armSwing, 3, 8, 1.5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = shade(char.skin, -20);
  ctx.beginPath(); ctx.arc(cx-8, armY+9+armSwing, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 0.8; ctx.stroke();
  // Front arm
  ctx.fillStyle = char.shirt;
  ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.roundRect(cx+6, armY-armSwing, 3, 8, 1.5); ctx.fill(); ctx.stroke();
  ctx.fillStyle = char.skin;
  ctx.beginPath(); ctx.arc(cx+7.5, armY+9-armSwing, 1.8, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 0.8; ctx.stroke();
  
  // ===== HEAD (anime chibi - big) =====
  const headY = cy - 15;
  const headR = 10.5;
  const headGrad = ctx.createRadialGradient(cx-3, headY-3, 2, cx, headY, headR);
  headGrad.addColorStop(0, char.skin);
  headGrad.addColorStop(1, char.skinShade || shade(char.skin, -20));
  ctx.fillStyle = headGrad;
  ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.arc(cx, headY, headR, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  
  // Cheek blush (anime style - pink ellipses)
  ctx.fillStyle = 'rgba(255,140,180,.5)';
  ctx.beginPath(); ctx.ellipse(cx-6, headY+3, 2.5, 1.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+6, headY+3, 2.5, 1.5, 0, 0, Math.PI*2); ctx.fill();
  
  // ===== HAIR =====
  drawAnimeHair(char, cx, headY, facing);
  
  // ===== FACE =====
  if(facing !== 'up'){
    const eyeY = headY - 1;
    let eyeOffsetX = 0;
    if(facing === 'left') eyeOffsetX = -1.2;
    if(facing === 'right') eyeOffsetX = 1.2;
    
    // Eyebrows
    ctx.strokeStyle = shade(char.hair, -15); ctx.lineWidth = 1.3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx-6, eyeY-4); ctx.quadraticCurveTo(cx-3.5, eyeY-5, cx-1.5, eyeY-4.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+1.5, eyeY-4.2); ctx.quadraticCurveTo(cx+3.5, eyeY-5, cx+6, eyeY-4); ctx.stroke();
    
    // Eye whites (slightly almond shaped)
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(cx-3.5+eyeOffsetX, eyeY, 2.2, 2.6, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+3.5+eyeOffsetX, eyeY, 2.2, 2.6, 0, 0, Math.PI*2); ctx.fill();
    
    // Iris (2-tone anime eye)
    const irisColor = char.eye || '#4a7cff';
    const irisDark = shade(irisColor, -40);
    ctx.fillStyle = irisDark;
    ctx.beginPath(); ctx.arc(cx-3.5+eyeOffsetX, eyeY+0.4, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+3.5+eyeOffsetX, eyeY+0.4, 1.8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = irisColor;
    ctx.beginPath(); ctx.arc(cx-3.5+eyeOffsetX, eyeY+0.7, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+3.5+eyeOffsetX, eyeY+0.7, 1.5, 0, Math.PI*2); ctx.fill();
    // Bottom iris light
    ctx.fillStyle = shade(irisColor, 50);
    ctx.beginPath(); ctx.arc(cx-3.5+eyeOffsetX, eyeY+1.3, 1, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+3.5+eyeOffsetX, eyeY+1.3, 1, 0, Math.PI*2); ctx.fill();
    
    // Pupil
    ctx.fillStyle = '#0a0a0a';
    ctx.beginPath(); ctx.arc(cx-3.5+eyeOffsetX, eyeY+0.5, 0.8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+3.5+eyeOffsetX, eyeY+0.5, 0.8, 0, Math.PI*2); ctx.fill();
    
    // Eye highlight (2 white dots - anime sparkle)
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx-4.2+eyeOffsetX, eyeY-0.8, 0.9, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+2.8+eyeOffsetX, eyeY-0.8, 0.9, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.arc(cx-2.8+eyeOffsetX, eyeY+1.5, 0.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+4.2+eyeOffsetX, eyeY+1.5, 0.4, 0, Math.PI*2); ctx.fill();
    
    // Upper eyelash line (dark)
    ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx-5.3+eyeOffsetX, eyeY-2); ctx.quadraticCurveTo(cx-3.5+eyeOffsetX, eyeY-3, cx-1.5+eyeOffsetX, eyeY-2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+1.5+eyeOffsetX, eyeY-2); ctx.quadraticCurveTo(cx+3.5+eyeOffsetX, eyeY-3, cx+5.3+eyeOffsetX, eyeY-2); ctx.stroke();
    
    // Nose (tiny dot)
    ctx.fillStyle = shade(char.skin, -30);
    ctx.beginPath(); ctx.arc(cx+eyeOffsetX*0.4, headY+3, 0.5, 0, Math.PI*2); ctx.fill();
    
    // Mouth (small smile)
    ctx.strokeStyle = '#8b3a3a'; ctx.lineWidth = 1; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx-1.3, headY+5);
    ctx.quadraticCurveTo(cx, headY+6.3, cx+1.3, headY+5);
    ctx.stroke();
  }
}

function drawAnimeHair(char, cx, cy, facing){
  const hairMain = char.hair;
  const hairLight = char.hairColor2 || shade(char.hair, 40);
  const hairDark = shade(char.hair, -30);
  ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineWidth = 1.3;
  ctx.fillStyle = hairMain;
  
  const style = char.hairStyle || 'anime_spike';
  const flip = facing === 'left' ? -1 : 1;
  
  if(style === 'anime_spike'){
    // Base cap
    ctx.beginPath();
    ctx.arc(cx, cy-1, 10.5, Math.PI*1.05, -Math.PI*0.05);
    ctx.lineTo(cx+10.5, cy+3);
    ctx.lineTo(cx-10.5, cy+3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Spikes pointing outward
    ctx.beginPath();
    ctx.moveTo(cx-10, cy-3); ctx.lineTo(cx-14, cy-6); ctx.lineTo(cx-9, cy-5); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx-7, cy-8); ctx.lineTo(cx-8, cy-14); ctx.lineTo(cx-4, cy-8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx-1, cy-10); ctx.lineTo(cx-1, cy-15); ctx.lineTo(cx+3, cy-10); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx+4, cy-9); ctx.lineTo(cx+7, cy-14); ctx.lineTo(cx+8, cy-8); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx+9, cy-4); ctx.lineTo(cx+14, cy-6); ctx.lineTo(cx+11, cy-2); ctx.closePath(); ctx.fill(); ctx.stroke();
    // Fringe (anime side-swept)
    ctx.beginPath();
    ctx.moveTo(cx-10, cy+1);
    ctx.quadraticCurveTo(cx-8, cy-3, cx-6, cy+2);
    ctx.lineTo(cx-3, cy-1);
    ctx.lineTo(cx-1, cy+2);
    ctx.lineTo(cx+2, cy-1);
    ctx.lineTo(cx+5, cy+2);
    ctx.quadraticCurveTo(cx+8, cy-3, cx+10, cy+1);
    ctx.lineTo(cx+10, cy-3);
    ctx.lineTo(cx-10, cy-3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Highlight
    ctx.fillStyle = hairLight;
    ctx.beginPath(); ctx.ellipse(cx-3, cy-6, 3, 1.5, -0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+4, cy-7, 2, 1, 0.3, 0, Math.PI*2); ctx.fill();
  } else if(style === 'anime_long'){
    // Base cap
    ctx.beginPath();
    ctx.arc(cx, cy-1, 10.5, Math.PI, 0);
    ctx.lineTo(cx+10.5, cy+3);
    ctx.lineTo(cx-10.5, cy+3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Long sides
    ctx.beginPath();
    ctx.moveTo(cx-10, cy+1);
    ctx.quadraticCurveTo(cx-13, cy+8, cx-10, cy+12);
    ctx.lineTo(cx-7, cy+11);
    ctx.lineTo(cx-7, cy+2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx+10, cy+1);
    ctx.quadraticCurveTo(cx+13, cy+8, cx+10, cy+12);
    ctx.lineTo(cx+7, cy+11);
    ctx.lineTo(cx+7, cy+2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Fringe
    ctx.beginPath();
    ctx.moveTo(cx-10, cy);
    ctx.quadraticCurveTo(cx-8, cy-4, cx-5, cy+1);
    ctx.lineTo(cx-2, cy-2);
    ctx.lineTo(cx+2, cy+1);
    ctx.quadraticCurveTo(cx+6, cy-4, cx+10, cy);
    ctx.lineTo(cx+10, cy-3);
    ctx.lineTo(cx-10, cy-3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Highlight shine (anime)
    ctx.fillStyle = hairLight;
    ctx.beginPath(); ctx.ellipse(cx-4, cy-5, 4, 1.8, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(cx-5, cy-6, 1.2, 0, Math.PI*2); ctx.fill();
  } else if(style === 'anime_pony'){
    ctx.beginPath();
    ctx.arc(cx, cy-1, 10.5, Math.PI, 0);
    ctx.lineTo(cx+10.5, cy+3); ctx.lineTo(cx-10.5, cy+3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Ponytail on side
    ctx.beginPath();
    ctx.ellipse(cx+13, cy+3, 4, 9, 0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // Hair tie
    ctx.fillStyle = '#ec4899';
    ctx.beginPath(); ctx.arc(cx+10, cy+1, 1.8, 0, Math.PI*2); ctx.fill();
    // Fringe
    ctx.fillStyle = hairMain;
    ctx.beginPath();
    ctx.moveTo(cx-10, cy+1);
    ctx.lineTo(cx-4, cy-3);
    ctx.lineTo(cx, cy+1);
    ctx.lineTo(cx+4, cy-3);
    ctx.lineTo(cx+10, cy+1);
    ctx.lineTo(cx+10, cy-3);
    ctx.lineTo(cx-10, cy-3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = hairLight;
    ctx.beginPath(); ctx.ellipse(cx-2, cy-5, 3, 1.3, -0.2, 0, Math.PI*2); ctx.fill();
  } else if(style === 'anime_bun'){
    ctx.beginPath();
    ctx.arc(cx, cy-1, 10.5, Math.PI, 0);
    ctx.lineTo(cx+10.5, cy+3); ctx.lineTo(cx-10.5, cy+3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Bun on top
    ctx.beginPath(); ctx.arc(cx, cy-11, 5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = hairLight;
    ctx.beginPath(); ctx.arc(cx-1.5, cy-12, 1.8, 0, Math.PI*2); ctx.fill();
    // Fringe
    ctx.fillStyle = hairMain;
    ctx.beginPath();
    ctx.moveTo(cx-10, cy+1);
    ctx.quadraticCurveTo(cx-6, cy-4, cx, cy+1);
    ctx.quadraticCurveTo(cx+6, cy-4, cx+10, cy+1);
    ctx.lineTo(cx+10, cy-3);
    ctx.lineTo(cx-10, cy-3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = hairLight;
    ctx.beginPath(); ctx.ellipse(cx+2, cy-5, 3, 1.3, 0, 0, Math.PI*2); ctx.fill();
  } else if(style === 'anime_slick'){
    ctx.beginPath();
    ctx.arc(cx, cy-1, 10.5, Math.PI, 0);
    ctx.lineTo(cx+10.5, cy+3); ctx.lineTo(cx-10.5, cy+3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Part line
    ctx.strokeStyle = hairDark; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(cx-2, cy-10); ctx.lineTo(cx-3, cy-2); ctx.stroke();
    // Highlight
    ctx.fillStyle = hairLight;
    ctx.beginPath(); ctx.ellipse(cx+3, cy-7, 4, 1.8, -0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx-5, cy-6, 2, 1, 0.4, 0, Math.PI*2); ctx.fill();
  } else if(style === 'anime_bob'){
    ctx.beginPath();
    ctx.arc(cx, cy-1, 10.5, Math.PI, 0);
    ctx.lineTo(cx+11, cy+6);
    ctx.lineTo(cx+8, cy+6);
    ctx.lineTo(cx+7, cy+2);
    ctx.lineTo(cx-7, cy+2);
    ctx.lineTo(cx-8, cy+6);
    ctx.lineTo(cx-11, cy+6);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Fringe
    ctx.beginPath();
    ctx.moveTo(cx-10, cy+1);
    ctx.lineTo(cx-3, cy-3);
    ctx.lineTo(cx+3, cy-3);
    ctx.lineTo(cx+10, cy+1);
    ctx.lineTo(cx+10, cy-3);
    ctx.lineTo(cx-10, cy-3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = hairLight;
    ctx.beginPath(); ctx.ellipse(cx, cy-5, 4, 1.5, 0, 0, Math.PI*2); ctx.fill();
  } else if(style === 'anime_twin'){
    ctx.beginPath();
    ctx.arc(cx, cy-1, 10.5, Math.PI, 0);
    ctx.lineTo(cx+10.5, cy+3); ctx.lineTo(cx-10.5, cy+3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // Twin tails
    ctx.beginPath(); ctx.ellipse(cx-13, cy+3, 4, 8, -0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx+13, cy+3, 4, 8, 0.3, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    // Ties
    ctx.fillStyle = '#ff6ba0';
    ctx.beginPath(); ctx.arc(cx-10, cy+1, 1.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx+10, cy+1, 1.6, 0, Math.PI*2); ctx.fill();
    // Fringe
    ctx.fillStyle = hairMain;
    ctx.beginPath();
    ctx.moveTo(cx-10, cy+1);
    ctx.quadraticCurveTo(cx-5, cy-4, cx, cy+1);
    ctx.quadraticCurveTo(cx+5, cy-4, cx+10, cy+1);
    ctx.lineTo(cx+10, cy-3);
    ctx.lineTo(cx-10, cy-3);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = hairLight;
    ctx.beginPath(); ctx.ellipse(cx, cy-5, 3.5, 1.3, 0, 0, Math.PI*2); ctx.fill();
  }
}

function shade(hex, amt){
  const num = parseInt(hex.slice(1),16);
  let r = (num>>16) + amt, g = ((num>>8)&0xff) + amt, b = (num&0xff) + amt;
  r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
  return '#' + ((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

function drawEmotionBubble(px, py, emoji){
  if(!emoji) return;
  const cx = px + TILE/2;
  const cy = py - 14;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.arc(cx+0.5, cy+0.5, 11, 0, Math.PI*2); ctx.fill();
  // Bubble
  ctx.fillStyle = 'rgba(255,255,255,.97)';
  ctx.strokeStyle = 'rgba(80,60,80,.6)'; ctx.lineWidth = 1.3;
  ctx.beginPath(); ctx.arc(cx, cy, 10.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  // Tail
  ctx.beginPath();
  ctx.moveTo(cx-4, cy+8); ctx.lineTo(cx, cy+15); ctx.lineTo(cx+4, cy+8);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // Emoji
  ctx.font = '13px serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(emoji, cx, cy+0.5);
}

function drawNameTag(px, py, name, color){
  ctx.font = 'bold 9px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(name).width + 10;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.roundRect(px + TILE/2 - w/2 + 1, py - 27, w, 13, 4); ctx.fill();
  // Tag
  ctx.fillStyle = color || 'rgba(15,23,42,.92)';
  ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(px + TILE/2 - w/2, py - 28, w, 13, 4); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.fillText(name, px + TILE/2, py - 21);
}

// ═══════════ SKY AND CLOUDS ═══════════
function drawSky(t){
  const W = canvas.width, H = canvas.height;
  const hour = getGameTime().hour;
  let topColor, bottomColor;
  if(hour >= 5 && hour < 8){ topColor = '#ffb347'; bottomColor = '#ffd89b'; }
  else if(hour >= 8 && hour < 12){ topColor = '#87ceeb'; bottomColor = '#e0f6ff'; }
  else if(hour >= 12 && hour < 17){ topColor = '#7dc4e8'; bottomColor = '#e6f5ff'; }
  else if(hour >= 17 && hour < 19){ topColor = '#ff8c42'; bottomColor = '#ffd4a3'; }
  else if(hour >= 19 && hour < 21){ topColor = '#3d2a5c'; bottomColor = '#f56ba0'; }
  else { topColor = '#0a0f28'; bottomColor = '#1a2140'; }
  
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, topColor);
  skyGrad.addColorStop(1, bottomColor);
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);
  
  // Sun/Moon
  const isNight = hour >= 19 || hour < 6;
  const isDay = hour >= 8 && hour < 17;
  const isDawn = hour >= 5 && hour < 8;
  const isDusk = hour >= 17 && hour < 19;
  
  let sunX = W - 100, sunY = 60, sunR = 24;
  if(isDay || isDusk){ 
    sunX = W - 100 - (hour - 8) * 6; 
    sunY = 50 + Math.abs(hour - 12.5) * 4;
    // Sun
    const sunGrad = ctx.createRadialGradient(sunX, sunY, 2, sunX, sunY, sunR*2);
    sunGrad.addColorStop(0, '#fff7cc');
    sunGrad.addColorStop(0.4, 'rgba(255,240,140,.8)');
    sunGrad.addColorStop(1, 'rgba(255,220,100,0)');
    ctx.fillStyle = sunGrad;
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR*2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff7cc';
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR*0.6, 0, Math.PI*2); ctx.fill();
  } else if(isNight){
    // Stars
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for(let i=0;i<30;i++){
      const sx = (i*73)%W, sy = (i*41)%180;
      const twinkle = 0.5 + Math.sin(t/500 + i)*0.5;
      ctx.globalAlpha = twinkle;
      ctx.beginPath(); ctx.arc(sx, sy, 1, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Moon
    const moonGrad = ctx.createRadialGradient(W-100, 60, 2, W-100, 60, 40);
    moonGrad.addColorStop(0, '#fffde7');
    moonGrad.addColorStop(0.5, 'rgba(255,253,231,.4)');
    moonGrad.addColorStop(1, 'rgba(255,253,231,0)');
    ctx.fillStyle = moonGrad;
    ctx.beginPath(); ctx.arc(W-100, 60, 40, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fffde7';
    ctx.beginPath(); ctx.arc(W-100, 60, 18, 0, Math.PI*2); ctx.fill();
    // Moon craters
    ctx.fillStyle = 'rgba(200,200,180,.3)';
    ctx.beginPath(); ctx.arc(W-105, 55, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(W-95, 65, 2, 0, Math.PI*2); ctx.fill();
  }
  
  // Clouds
  const cloudAlpha = isNight ? 0.15 : 0.7;
  ctx.fillStyle = `rgba(255,255,255,${cloudAlpha})`;
  const cloudSpeed = 15;
  for(let i=0;i<4;i++){
    const cx = ((i*200 + t/cloudSpeed) % (W+200)) - 100;
    const cy = 40 + i*25;
    drawCloud(cx, cy, 0.8 + i*0.1);
  }
}

function drawCloud(x, y, scale){
  ctx.beginPath();
  ctx.arc(x, y, 18*scale, 0, Math.PI*2);
  ctx.arc(x+20*scale, y+3*scale, 14*scale, 0, Math.PI*2);
  ctx.arc(x-20*scale, y+3*scale, 12*scale, 0, Math.PI*2);
  ctx.arc(x+10*scale, y-6*scale, 13*scale, 0, Math.PI*2);
  ctx.arc(x-8*scale, y-5*scale, 11*scale, 0, Math.PI*2);
  ctx.fill();
}

// ═══════════ MAIN DRAW ═══════════
function drawWorld(t){
  const W = canvas.width, H = canvas.height;
  
  // Camera follows player
  const targetX = S.playerPos.x - W/2 + TILE/2;
  const targetY = S.playerPos.y - H/2 + TILE/2;
  camera.x += (targetX - camera.x) * 0.12;
  camera.y += (targetY - camera.y) * 0.12;
  camera.x = Math.max(0, Math.min(MAP_W*TILE - W, camera.x));
  camera.y = Math.max(0, Math.min(MAP_H*TILE - H, camera.y));
  
  // Sky
  drawSky(t);
  
  ctx.save();
  ctx.translate(-camera.x, -camera.y);
  
  // Ground (draw tiles only in view)
  for(let y=0;y<MAP_H;y++) for(let x=0;x<MAP_W;x++){
    if(x*TILE > camera.x + W + TILE || (x+1)*TILE < camera.x - TILE) continue;
    if(y*TILE > camera.y + H + TILE || (y+1)*TILE < camera.y - TILE) continue;
    drawTile(x,y,MAP_DATA[y][x], t);
  }
  
  // Water edge (stone border at pond)
  for(let y=11;y<15;y++) for(let x=16;x<21;x++){
    if(MAP_DATA[y][x] === 2){
      // Check if edge
      if(y === 11 || MAP_DATA[y-1][x] !== 2){
        ctx.fillStyle = '#8a7a5c';
        ctx.fillRect(x*TILE, y*TILE, TILE, 3);
      }
      if(x === 16 || MAP_DATA[y][x-1] !== 2){
        ctx.fillStyle = '#8a7a5c';
        ctx.fillRect(x*TILE, y*TILE, 3, TILE);
      }
    }
  }
  
  // Move target marker
  if(S.moveTarget){
    const mx = S.moveTarget.x + TILE/2, my = S.moveTarget.y + TILE/2;
    const pulse = 0.6 + Math.sin(t/150)*0.4;
    // Outer ring
    ctx.strokeStyle = `rgba(255,220,80,${pulse})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(mx, my, 14 + Math.sin(t/180)*3, 0, Math.PI*2); ctx.stroke();
    // Inner ring
    ctx.strokeStyle = 'rgba(255,255,255,.6)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(mx, my, 8, 0, Math.PI*2); ctx.stroke();
    // Center dot
    ctx.fillStyle = 'rgba(255,220,80,.9)';
    ctx.beginPath(); ctx.arc(mx, my, 3, 0, Math.PI*2); ctx.fill();
    // Direction line from player to target
    ctx.strokeStyle = 'rgba(255,220,80,.35)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(S.playerPos.x + TILE/2, S.playerPos.y + TILE/2);
    ctx.lineTo(mx, my);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  
  // Click feedback (recent clicks)
  if(S.clickMark && Date.now() - S.clickMark.time < 500){
    const age = (Date.now() - S.clickMark.time) / 500;
    const mx = S.clickMark.x, my = S.clickMark.y;
    ctx.strokeStyle = `rgba(255,255,255,${1-age})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(mx, my, 5 + age*25, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = `rgba(255,200,50,${1-age})`;
    ctx.beginPath(); ctx.arc(mx, my, 4, 0, Math.PI*2); ctx.fill();
  }
  
  // Trees (background layer)
  TREES.forEach(tree => {
    // Only draw trees within view
    const tx = tree.x*TILE, ty = tree.y*TILE;
    if(tx > camera.x + W + 40 || tx < camera.x - 40) return;
    if(ty > camera.y + H + 40 || ty < camera.y - 40) return;
    drawTree(tree, t);
  });
  
  // Buildings
  for(const loc of Object.values(LOCATIONS)) drawBuilding(loc, t);
  
  // NPCs
  const npcsToDraw = [];
  for(const r of Object.values(S.rels)){
    const pos = S.npcPositions[r.id];
    if(!pos) continue;
    const npcData = NPC_POOL.find(p=>p.id===r.pid);
    if(!npcData) continue;
    npcsToDraw.push({r, pos, npcData, y: pos.y});
  }
  npcsToDraw.sort((a,b)=>a.y-b.y);
  for(const {r, pos, npcData} of npcsToDraw){
    const st = S.npcStates[r.id] || {};
    drawCharacter(npcData, pos.x, pos.y, st.facing || 'down', st.walking || false, st.frame || 0);
    
    let emo = '';
    if(r.angry) emo = '😡';
    else if(r.expecting) emo = '🤰';
    else if(r.stage === 'married' && S.partnerId === r.id) emo = '💗';
    else if(r.love > 70) emo = '😊';
    else if(r.love < 20) emo = '😔';
    else if(r.stage === 'crush' || r.stage === 'dating') emo = '💕';
    if(emo) drawEmotionBubble(pos.x, pos.y, emo);
    
    drawNameTag(pos.x, pos.y, r.n, r.angry ? 'rgba(127,29,29,.92)' : 'rgba(139,92,246,.92)');
  }
  
  // Player
  drawCharacter(S.playerAppearance, S.playerPos.x, S.playerPos.y, playerState.facing, playerState.walking, playerState.frame);
  drawNameTag(S.playerPos.x, S.playerPos.y, S.name || 'Bạn', 'rgba(192,132,252,.95)');
  
  // Petals falling (foreground)
  if(!S.petals) S.petals = [];
  for(const p of S.petals){
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.rotSpeed;
    if(p.y > MAP_H*TILE + 10){ p.y = -10; p.x = Math.random()*MAP_W*TILE; }
    if(p.x < -10){ p.x = MAP_W*TILE + 10; }
    // Wrap
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = 'rgba(255,180,210,.75)';
    ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size*0.6, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  
  ctx.restore();
}

// ═══════════ PLAYER MOVEMENT ═══════════
const playerState = {facing:'down', walking:false, frame:0, speed:2.4};
const keys = {up:false, down:false, left:false, right:false};

function updatePlayer(){
  // Keyboard input
  let kx = 0, ky = 0;
  if(keys.up) ky -= 1;
  if(keys.down) ky += 1;
  if(keys.left) kx -= 1;
  if(keys.right) kx += 1;
  
  if(kx !== 0 || ky !== 0){
    S.moveTarget = null;
    const len = Math.hypot(kx, ky);
    kx = kx/len * playerState.speed;
    ky = ky/len * playerState.speed;
    // Try both axes separately
    const newX = S.playerPos.x + kx;
    const newY = S.playerPos.y + ky;
    if(!isBlocked(newX, S.playerPos.y)) S.playerPos.x = newX;
    if(!isBlocked(S.playerPos.x, newY)) S.playerPos.y = newY;
    playerState.walking = true;
    playerState.frame++;
    if(Math.abs(kx) > Math.abs(ky)) playerState.facing = kx > 0 ? 'right' : 'left';
    else playerState.facing = ky > 0 ? 'down' : 'up';
    return;
  }
  
  // Auto-move to target
  if(S.moveTarget){
    const dx = S.moveTarget.x - S.playerPos.x;
    const dy = S.moveTarget.y - S.playerPos.y;
    const dist = Math.hypot(dx, dy);
    if(dist < 3){
      S.moveTarget = null;
      playerState.walking = false;
      playerState.frame = 0;
    } else {
      const vx = dx/dist * playerState.speed;
      const vy = dy/dist * playerState.speed;
      const newX = S.playerPos.x + vx;
      const newY = S.playerPos.y + vy;
      if(!isBlocked(newX, S.playerPos.y)) S.playerPos.x = newX;
      if(!isBlocked(S.playerPos.x, newY)) S.playerPos.y = newY;
      playerState.walking = true;
      playerState.frame++;
      if(Math.abs(dx) > Math.abs(dy)) playerState.facing = dx > 0 ? 'right' : 'left';
      else playerState.facing = dy > 0 ? 'down' : 'up';
    }
  } else {
    playerState.walking = false;
    playerState.frame = 0;
  }
}

// Check if a tile is blocked by building or water
function isTileBlocked(tx, ty){
  if(tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return true;
  if(MAP_DATA[ty][tx] === 2) return true;
  for(const loc of Object.values(LOCATIONS)){
    if(tx >= loc.x && tx < loc.x + loc.w && ty >= loc.y && ty < loc.y + loc.h) return true;
  }
  return false;
}

function isBlocked(x, y){
  const tx = Math.floor((x + TILE/2) / TILE);
  const ty = Math.floor((y + TILE/2) / TILE);
  return isTileBlocked(tx, ty);
}

// Find nearest walkable tile to a point
function findNearestWalkable(worldX, worldY){
  const baseTx = Math.floor(worldX / TILE);
  const baseTy = Math.floor(worldY / TILE);
  if(!isTileBlocked(baseTx, baseTy)) return {tx: baseTx, ty: baseTy};
  // Spiral search
  for(let r=1; r<10; r++){
    for(let dy=-r; dy<=r; dy++){
      for(let dx=-r; dx<=r; dx++){
        if(Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
        const tx = baseTx + dx, ty = baseTy + dy;
        if(!isTileBlocked(tx, ty)) return {tx, ty};
      }
    }
  }
  return null;
}

// Robust click handler
function canvasClick(e){
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  if(rect.width === 0 || rect.height === 0) return;
  let clientX, clientY;
  if(e.touches && e.touches.length > 0){
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else if(e.changedTouches && e.changedTouches.length > 0){
    clientX = e.changedTouches[0].clientX;
    clientY = e.changedTouches[0].clientY;
  } else if(e.clientX !== undefined){
    clientX = e.clientX;
    clientY = e.clientY;
  } else {
    return;
  }
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const canvasX = (clientX - rect.left) * scaleX;
  const canvasY = (clientY - rect.top) * scaleY;
  const worldX = canvasX + camera.x;
  const worldY = canvasY + camera.y;
  
  // Feedback marker at click position (in canvas space)
  S.clickMark = {x: canvasX, y: canvasY, time: Date.now()};
  
  // Find walkable tile
  const result = findNearestWalkable(worldX, worldY);
  if(result){
    S.moveTarget = {x: result.tx * TILE, y: result.ty * TILE};
  }
}

canvas.addEventListener('pointerdown', canvasClick);
canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); }, {passive:false});

// Keyboard controls
window.addEventListener('keydown', e=>{
  if(e.target.tagName === 'INPUT') return;
  switch(e.key){
    case 'ArrowUp': case 'w': case 'W': keys.up = true; e.preventDefault(); break;
    case 'ArrowDown': case 's': case 'S': keys.down = true; e.preventDefault(); break;
    case 'ArrowLeft': case 'a': case 'A': keys.left = true; e.preventDefault(); break;
    case 'ArrowRight': case 'd': case 'D': keys.right = true; e.preventDefault(); break;
  }
});
window.addEventListener('keyup', e=>{
  switch(e.key){
    case 'ArrowUp': case 'w': case 'W': keys.up = false; break;
    case 'ArrowDown': case 's': case 'S': keys.down = false; break;
    case 'ArrowLeft': case 'a': case 'A': keys.left = false; break;
    case 'ArrowRight': case 'd': case 'D': keys.right = false; break;
  }
});

// ═══════════ NPC AI ═══════════
function getNpcTargetLocation(npcData){
  const traits = npcData.per || [];
  const prefs = [];
  for(const t of traits){ if(SCHEDULE_HOURLY[t]) prefs.push(SCHEDULE_HOURLY[t]); }
  if(prefs.length === 0) prefs.push(SCHEDULE_HOURLY.default);
  const pref = prefs[Math.floor(Math.random()*prefs.length)];
  const slot = getScheduleSlot();
  const locKey = pref[slot] || pref.work || 'home';
  return LOCATIONS[locKey] || LOCATIONS.home;
}
function initNpcPositions(){
  for(const r of Object.values(S.rels)){
    if(!S.npcPositions[r.id]){
      const locs = Object.values(LOCATIONS);
      const loc = locs[Math.floor(Math.random()*locs.length)];
      const result = findNearestWalkable((loc.x + Math.random()*loc.w) * TILE, (loc.y + loc.h + 1) * TILE);
      S.npcPositions[r.id] = result ? {x: result.tx*TILE, y: result.ty*TILE} : {x: 5*TILE, y: 6*TILE};
    }
    if(!S.npcStates[r.id]) S.npcStates[r.id] = {facing:'down', walking:false, frame:0, target:null, idleTimer:0};
  }
}
function updateNpcs(){
  for(const r of Object.values(S.rels)){
    const pos = S.npcPositions[r.id];
    const state = S.npcStates[r.id];
    const npcData = NPC_POOL.find(p=>p.id===r.pid);
    if(!pos || !state || !npcData) continue;
    
    if(!state.target){
      if(state.idleTimer > 0){ state.idleTimer--; state.walking = false; continue; }
      const targetLoc = getNpcTargetLocation(npcData);
      const result = findNearestWalkable((targetLoc.x + Math.random()*targetLoc.w) * TILE, (targetLoc.y + targetLoc.h + 1) * TILE);
      if(result) state.target = {x: result.tx*TILE, y: result.ty*TILE};
      else state.idleTimer = 100;
    }
    
    const dx = state.target.x - pos.x;
    const dy = state.target.y - pos.y;
    const dist = Math.hypot(dx, dy);
    
    if(dist < 4){
      state.target = null;
      state.walking = false;
      state.idleTimer = 100 + Math.random()*250;
    } else {
      const speed = 1.0 + Math.random()*0.4;
      const vx = (dx/dist) * speed;
      const vy = (dy/dist) * speed;
      const newX = pos.x + vx;
      const newY = pos.y + vy;
      if(!isBlocked(newX, pos.y)) pos.x = newX;
      if(!isBlocked(pos.x, newY)) pos.y = newY;
      state.walking = true;
      state.frame++;
      if(Math.abs(dx) > Math.abs(dy)) state.facing = dx > 0 ? 'right' : 'left';
      else state.facing = dy > 0 ? 'down' : 'up';
    }
  }
}

// ═══════════ INTERACTION ═══════════
let nearNpcId = null;
function checkInteraction(){
  nearNpcId = null;
  let minDist = TILE * 1.8;
  const px = S.playerPos.x + TILE/2;
  const py = S.playerPos.y + TILE/2;
  for(const r of Object.values(S.rels)){
    const pos = S.npcPositions[r.id];
    if(!pos) continue;
    const d = Math.hypot((pos.x + TILE/2) - px, (pos.y + TILE/2) - py);
    if(d < minDist){ minDist = d; nearNpcId = r.id; }
  }
  const btn = document.getElementById('interactBtn');
  if(nearNpcId){
    const r = S.rels[nearNpcId];
    btn.textContent = `💬 ${r.n}`;
    btn.classList.add('on');
  } else { btn.classList.remove('on'); }
}
document.getElementById('interactBtn').onclick = () => { if(nearNpcId) openChat(nearNpcId); };

function buildTravelBar(){
  const bar = document.getElementById('travelbar');
  bar.innerHTML = Object.entries(LOCATIONS).map(([k, loc])=>{
    return `<button data-loc="${k}">${loc.emoji} ${loc.name}</button>`;
  }).join('');
  bar.querySelectorAll('button').forEach(b=>{
    b.onclick = () => {
      const loc = LOCATIONS[b.dataset.loc];
      const result = findNearestWalkable((loc.x + loc.w/2) * TILE, (loc.y + loc.h + 1) * TILE);
      if(result) S.moveTarget = {x: result.tx*TILE, y: result.ty*TILE};
    };
  });
}

// ═══════════ TIME PROCESSING ═══════════
function processTimeAdvance(){
  const time = getGameTime();
  if(time.day > S.lastDayProcessed){
    for(let d = S.lastDayProcessed + 1; d <= time.day; d++) endOfDay(d);
    S.lastDayProcessed = time.day;
  }
  if(time.hour === 0 && time.minute === 0){
    S._worked = false;
    S._schooled = false;
  }
}
function endOfDay(d){
  apply('money', -150);
  const cc = S.children.reduce((s,c)=>s+childCost(c),0);
  if(cc>0) apply('money', -cc);
  const houseM = HOUSES.find(h=>h.id===S.assets.house)?.m || 0;
  apply('energy', 20 + houseM);
  apply('mental', -1 + houseM);
  apply('health', 2);
  const bizInc = BUSINESS.find(b=>b.id===S.assets.business)?.inc || 0;
  if(bizInc > 0) apply('money', Math.round(bizInc / 7));
  const partner = getPartner();
  if(partner && partner.stage === 'married'){
    const wage = JOBS[partner.job]?.w||500;
    let mul=1; if(partner.per.includes('galant'))mul=1.3; if(partner.per.includes('stingy'))mul=0.4;
    apply('money', Math.round(wage*mul*0.7));
  }
  npcDailyTick();
  checkHealth();
  addLog(`🌅 Ngày ${d} kết thúc.`, 'day');
  if(d % 3 === 0) save();
}
function checkHealth(){ 
  if(S.st.health<=0||S.st.energy<=0){ apply('health',40-S.st.health);apply('energy',50-S.st.energy); apply('money',-2000);addLog('🏥 Nhập viện!','bad'); } 
  if(S.st.mental<=0){S.st.mental=25;apply('money',-1000);addLog('😵 Suy nhược!','bad');} 
}
function npcDailyTick() {
  if (S.ended) return;
  const toRemove = [];
  for (const r of Object.values(S.rels)) {
    if (r.stage === 'married') continue;
    if (r.love <= -50 || (r.angry && r.love <= -30)) toRemove.push(r);
  }
  toRemove.forEach(r => {
    addLog(`💔 ${r.n} đã hủy kết bạn!`, 'bad');
    if (S.partnerId === r.id) { S.partnerId = null; syncLove(); }
    delete S.rels[r.id]; delete S.npcPositions[r.id]; delete S.npcStates[r.id];
    apply('mental', -15);
  });
  for (const r of Object.values(S.rels)) {
    if (r.stage === 'married') continue;
    if (Math.random() < 0.2) {
      if (r.angry) { r.love = clampInt(r.love - 2); addLog(`📩 ${r.n}: "Tớ vẫn còn giận cậu!"`, 'bad'); }
      else if (r.love > 70) { r.love = clampInt(r.love + 1); addLog(`📩 ${r.n}: "Nhớ cậu quá!"`, 'love'); }
      else if (r.love < 20) { addLog(`📩 ${r.n}: "Dạo này cậu bận lắm hả?"`, 'info'); }
    }
    if (r.angry) {
      r.angryDays--;
      if (r.angryDays <= 0) { r.angry = false; addLog(`${r.n} đã nguôi giận.`, 'info'); }
      else { r.love = clampInt(r.love - 3); }
    }
  }
  if (S.partnerId && !S._dated) {
    const p = S.rels[S.partnerId];
    if (p) {
      p.love = clampInt(p.love - 3);
      syncLove();
      if (p.love < 30) addLog(`💔 ${p.n} cảm thấy bị bỏ rơi.`, 'bad');
    }
  }
  S._dated = false;
  const partner = getPartner();
  if (partner && partner.expecting) {
    partner.expectingWeeks--;
    if (partner.expectingWeeks <= 0) birthChild();
  }
  for (const c of S.children) {
    c.age++;
    if (!c._played) { c.bond = clamp(c.bond - 5); apply('mental', -1); }
    c._played = false;
  }
  if (Math.random() < 0.3) npcWeeklyTick();
}
function rejectNpcProposal(id) {
  const r = S.rels[id]; if (!r) return;
  r.love = clampInt(r.love - 30); r.stage = 'friend';
  if (S.partnerId === id) { S.partnerId = null; syncLove(); }
  addLog(`💔 Bạn đã từ chối ${r.n}.`, 'bad');
  closeModal(); render();
}
function makeAngry(r, amount=10, days=3){ r.angry=true; r.angryDays=days; r.love=clampInt(r.love-amount); addLog(`😡 ${r.n} tức giận!`,'bad'); }
function childCost(c){ if(c.age<12)return 300; if(c.age<26)return 500; return 800; }

// ═══════════ ACTIONS ═══════════
function advanceTime(minutes){
  S.gameMinutes += minutes;
  processTimeAdvance();
  updateTimeUI();
}
function doAction(id){
  if(S.ended) return;
  const a = ACTIONS.find(x=>x.id===id);
  if(!a) return;
  if(a.once === 'day'){
    if(a.id === 'work' && S._worked){ alert('Hôm nay đã đi làm rồi.'); return; }
    if(a.id === 'study' && S._schooled){ alert('Hôm nay đã học rồi.'); return; }
  }
  if(a.afterWork && !S._worked){ alert('Phải đi làm trước.'); return; }
  if(a.minMoney && S.st.money < a.minMoney) return;
  let transCost = a.transport;
  if(transCost){
    const carDisc = CARS.find(c=>c.id===S.assets.car)?.tr || 0;
    transCost = Math.max(0, Math.round(transCost * (1 + carDisc/100)));
    apply('money', -transCost);
    addLog(`🚌 Đi lại: -${transCost}đ`, 'info');
  }
  const job = JOBS[S.job];
  if(a.ef){
    for(const [k,v] of Object.entries(a.ef)){
      if(k === 'money'){
        let amt = v;
        if(v === 'wage'){ amt = job.w; if(id === 'work') S._worked = true; }
        else if(v === 'half') amt = Math.round(job.w * 0.5);
        apply('money', amt);
      } else if(k === 'skill' && id === 'work'){
        apply('skill', v * 1.3);
      } else {
        apply(k, v);
      }
    }
  }
  if(a.edu){
    S.eduProgress++;
    const req = {c3:5, dh:10, ths:14, ts:999}[S.edu];
    if(S.eduProgress >= req){
      S.edu = {c3:'dh', dh:'ths', ths:'ts'}[S.edu];
      S.eduProgress = 0;
      addLog(`🎓 Tốt nghiệp ${EDU_LABEL[S.edu]}!`, 'good');
      apply('mental', 15);
    } else {
      addLog(`📖 Học: ${S.eduProgress}/${req}`, 'info');
      S._schooled = true;
    }
  }
  if(a.gamble){
    const win = Math.random() < 0.4;
    apply('money', win ? 1200 : -500);
    addLog(win ? '📈 +1.200đ' : '📉 -500đ', win ? 'good' : 'bad');
  }
  advanceTime(a.t);
  const msgs = {work:`Đi làm: +${fmt(job.w)}`, study:'Học nâng cao.', skill:'Học kỹ năng.', gym:'Tập thể dục.', family:'Gọi gia đình.', hobby:'Đam mê.', movie:'Xem phim.', game:'Chơi game.', shopping:'Mua sắm.', spa:'Spa.', travel:'Du lịch.'};
  if(msgs[id]) addLog(msgs[id], id==='family'?'love':'good');
  checkHealth();
  render();
}

// ═══════════ NPC-NPC ═══════════
function compatibility(a,b){ if(!a.att.includes(b.g))return 0; if(!b.att.includes(a.g))return 0; let s=0;s+=Math.max(0,20-Math.abs(a.age-b.age)); const bgr={ngheo:0,trungluu:1,khagia:2,gia:3}; s+=10-Math.abs(bgr[a.bg]-bgr[b.bg])*3; for(const t of b.per){if(a.likes.includes(t))s+=8;if(a.dis.includes(t))s-=5;} s+=a.hob.filter(h=>b.hob.includes(h)).length*4; return Math.max(0,s); }
function npcWeeklyTick(){ 
  const partner=getPartner(); 
  for(const a of NPC_POOL){ 
    if(!S.npcRels[a.id])S.npcRels[a.id]={}; 
    for(const b of NPC_POOL){ 
      if(a.id>=b.id)continue; 
      if(!S.npcRels[a.id][b.id])S.npcRels[a.id][b.id]={aff:0,status:'none'}; 
      if(partner&&(partner.pid===a.id||partner.pid===b.id))continue; 
      const rel=S.npcRels[a.id][b.id]; 
      if(rel.status==='married')continue; 
      const comp=compatibility(a,b); 
      if(comp<=10)continue; 
      if(Math.random()<0.5)continue; 
      let inc=comp>=40?2:comp>=25?1:0.5; 
      rel.aff=Math.min(100,rel.aff+inc); 
      if(rel.status==='none'&&rel.aff>=30){ rel.status='interested'; addLog(`📢 ${a.n} để ý ${b.n}...`,'npc'); } 
      if(rel.status==='interested'&&rel.aff>=55){ rel.status='dating'; addLog(`💕 ${a.n} & ${b.n} hẹn hò!`,'npc'); } 
      if(rel.status==='dating'&&rel.aff>=85&&Math.random()<0.3){ rel.status='married'; addLog(`💒 ${a.n} & ${b.n} KẾT HÔN!`,'npc'); } 
    } 
  } 
}
function getNpcRomanceStatus(npc){ const out=[]; for(const other of NPC_POOL){ if(other.id===npc.id)continue; const a=npc.id<other.id?npc.id:other.id; const b=npc.id<other.id?other.id:npc.id; const rel=S.npcRels[a]?.[b]; if(rel&&rel.status!=='none')out.push({other,rel}); } return out; }

function rollProfiles(){ const met=new Set(Object.values(S.rels).map(r=>r.pid)); const avail=NPC_POOL.filter(p=>!met.has(p.id)); const sh=avail.sort(()=>Math.random()-0.5); S.currentProfiles=sh.slice(0,5).map(p=>p.id); }
function openMeet(){ if(S.currentProfiles.length===0)rollProfiles(); const list=S.currentProfiles.map(id=>NPC_POOL.find(p=>p.id===id)).filter(Boolean); if(list.length===0){ showModal(`<h2>🌐 Gặp gỡ</h2><p>Bạn đã gặp tất cả!</p> <button class="btn sec" onclick="closeModal()">Đóng</button>`); return; } showModal(` <h2>🌐 Gặp gỡ — 5 hồ sơ</h2> <p>Prestige: ✨ ${prestige()}</p> <div class="grid"> ${list.map(p=>{ const rc=rejectChance(p); const isG=p.per.includes('galant'); const isS=p.per.includes('stingy'); return `<div class="card"> <div class="av">${p.av}</div> <div class="nm">${p.n}</div> <div class="s2">${p.age}t · ${JOBS[p.job]?.n||p.job}</div> <div class="ln"><span>Ngoại hình</span><span>${p.ap}/10</span></div> <div class="ln"><span>Tài sản</span><span>${p.wl}/100</span></div> <div class="ln"><span>Học vấn</span><span>${EDU_LABEL[p.edu]}</span></div> ${isG?'<div class="info">🎩 Ga lăng</div>':''} ${isS?'<div class="info">💰 Bủn xỉn</div>':''} ${rc>0?`<div class="warn">⚠️ Từ chối: ${Math.round(rc*100)}%</div>`:''} <div style="display:flex;gap:3px;flex-wrap:wrap;margin-top:4px"> ${p.per.slice(0,3).map(t=>`<span class="bd" style="font-size:9px">${TRAITS[t]||t}</span>`).join('')} </div> <div style="font-size:9px;color:#64748b;font-style:italic;margin-top:4px">${p.bio}</div> <div class="npc-a"> <button class="btn pri" onclick="tryMeet('${p.id}')">Kết bạn</button> <button class="btn sec" onclick="skip('${p.id}')">Bỏ</button> </div> </div>`; }).join('')} </div> <button class="btn sec" style="margin-top:8px" onclick="rollProfiles();openMeet();">🔄 Đổi</button> <button class="btn sec" onclick="closeModal()">Đóng</button> `); }
function skip(id){S.currentProfiles=S.currentProfiles.filter(x=>x!==id);openMeet();}
function tryMeet(pid){ const p=NPC_POOL.find(x=>x.id===pid);if(!p)return; const rc=rejectChance(p); if(Math.random()<rc){ addLog(`❌ ${p.n} từ chối.`,'bad'); showModal(`<h2>❌ Bị từ chối</h2><p style="text-align:center;font-size:40px">${p.av}</p><button class="btn sec" onclick="closeModal()">Buồn</button>`); S.currentProfiles=S.currentProfiles.filter(x=>x!==pid); return; } const rid='r'+pid+'_'+Date.now(); const shared=p.hob.filter(h=>S.hobbies.includes(h)); S.rels[rid]={ id:rid,pid:p.id,n:p.n,g:p.g,av:p.av,age:p.age, job:p.job,ap:p.ap,wl:p.wl,edu:p.edu,bg:p.bg, per:[...p.per],hob:[...p.hob],bio:p.bio,views:p.views, bond:10+shared.length*5,love:5+shared.length*3, stage:'friend',angry:false,angryDays:0, expecting:false,expectingWeeks:0 }; 
const locs = Object.values(LOCATIONS); const loc = locs[Math.floor(Math.random()*locs.length)];
const result = findNearestWalkable((loc.x + Math.random()*loc.w) * TILE, (loc.y + loc.h + 1) * TILE);
S.npcPositions[rid] = result ? {x: result.tx*TILE, y: result.ty*TILE} : {x: 5*TILE, y: 6*TILE};
