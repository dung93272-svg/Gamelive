addLog(`🌐 Kết bạn với ${p.n}!`,'good'); showModal(`<h2>✅ Kết bạn!</h2><p style="text-align:center;font-size:40px">${p.av}</p> <p><b>${p.n}</b> xuất hiện trên bản đồ!</p><button class="btn pri" onclick="closeModal()">OK</button>`); S.currentProfiles=S.currentProfiles.filter(x=>x!==pid); render(); }

// ═══════════ RELATIONS ═══════════
function openRel(){ const list=Object.values(S.rels); let html=`<h2>🤝 Quan hệ (${list.length})</h2>`; const partner=getPartner(); if(partner){html+=`<h3>💗 Người thương</h3>`;html+=renderRelCard(partner,true);} html+=`<h3>🌐 Người quen (${list.length-(partner?1:0)})</h3>`; if(list.length===0){html+=`<p>Chưa quen ai.</p>`;} else{ for(const r of list){ if(r.id===S.partnerId)continue; html+=renderRelCard(r,false); } } const marriages=[]; for(const a of NPC_POOL){ for(const b of NPC_POOL){ if(a.id>=b.id)continue; const rel=S.npcRels[a.id]?.[b.id]; if(rel?.status==='married')marriages.push({a,b}); } } if(marriages.length>0){ html+=`<h3>💒 NPC kết hôn</h3>`; html+=marriages.map(m=>`<div class="npc-card m"><div class="npc-h"><span class="av">${m.a.av}</span><span class="nm">${m.a.n}</span>❤️<span class="av">${m.b.av}</span><span class="nm">${m.b.n}</span></div></div>`).join(''); } html+=`<button class="btn sec" style="margin-top:8px" onclick="openMeet()">🌐 Gặp người mới</button>`; html+=`<button class="btn sec" onclick="closeModal()">Đóng</button>`; showModal(html); }
function renderRelCard(r,isPartner){ const shared=r.hob.filter(h=>S.hobbies.includes(h)); const isSameG=r.g===S.gender; const stageLabel={friend:'🤝 Bạn',close:'💛 Bạn thân',bestie:'💜 Bạn thân', brother:'🤜🤛 Chí cốt',crush:'💓 Để ý',dating:'💕 Hẹn hò',engaged:'💍 Đính hôn',married:'💒 Vợ chồng'}[r.stage]||r.stage; const isG=r.per.includes('galant'); const isS=r.per.includes('stingy'); let acts=`<button class="btn sec" onclick="openChat('${r.id}')">💬 Chat</button>`; acts+=`<button class="btn sec" onclick="hang('${r.id}')">Đi chơi</button>`; acts+=`<button class="btn sec" onclick="gift('${r.id}')">Quà</button>`; if(r.g!==S.gender&&r.stage!=='married'&&r.stage!=='engaged'){ acts+=`<button class="btn gold" onclick="dateWith('${r.id}')">Hẹn hò</button>`; } if(isPartner&&r.stage==='dating')acts+=`<button class="btn gold" onclick="openPropose()">💍 Cầu hôn</button>`; if(isPartner&&r.stage==='engaged')acts+=`<button class="btn gold" onclick="openWedding()">💒 Cưới</button>`; if(isPartner&&r.stage==='married'&&!r.expecting)acts+=`<button class="btn gold" onclick="tryPregnant()">👶 Có con</button>`; acts+=`<button class="btn danger" onclick="unfriend('${r.id}')">🚫 Hủy</button>`; const romances=getNpcRomanceStatus({id:r.pid}); const romInfo=romances.filter(x=>x.rel.status!=='none').map(x=>`${x.other.av} ${x.other.n} (${x.rel.status==='married'?'💒':x.rel.status==='dating'?'💕':'💓'})`).join(', '); 
const pos = S.npcPositions[r.id]; let locName = '...';
if(pos){ const px = pos.x+TILE/2, py = pos.y+TILE/2; for(const loc of Object.values(LOCATIONS)){ if(px >= (loc.x-1)*TILE && px <= (loc.x+loc.w+1)*TILE && py >= (loc.y-1)*TILE && py <= (loc.y+loc.h+1)*TILE){ locName = loc.emoji+' '+loc.name; break; } } }
return `<div class="npc-card ${isPartner?'p':''} ${r.angry?'a':''}"> <div class="npc-h"> <span class="av">${r.av}</span><span class="nm">${r.n}</span> <span class="bd">${r.age}t</span> <span class="bd">${JOBS[r.job]?.n||r.job}</span> <span class="bd gold">${stageLabel}</span> ${r.angry?'<span class="bd red">😡</span>':''} ${isG?'<span class="bd gold">🎩</span>':''} ${isS?'<span class="bd red">💰</span>':''} </div> <div style="font-size:10px;color:#7dd3fc">📍 ${locName}</div> <div style="font-size:10px;color:#94a3b8">💗 ${Math.round(r.love)} · 🤝 ${Math.round(r.bond)}</div> <div class="bond"><div class="bond-f ${r.love<0?'neg':''}" style="width:${Math.abs(r.love)}%"></div></div> ${shared.length?`<div style="font-size:9px;color:#6ee7b7">Chung: ${shared.map(h=>HOBBIES[h].e).join(' ')}</div>`:''} ${r.love<=-15?`<div class="warn">⚠️ Nguy cơ hủy kết bạn!</div>`:''} ${!isSameG&&r.love>=90&&r.stage!=='dating'&&r.stage!=='engaged'&&r.stage!=='married'?'<div style="font-size:10px;color:#f472b6;font-weight:bold">💗 Có thể tỏ tình!</div>':''} ${r.expecting?`<div style="font-size:10px;color:#fbbf24">🤰 Mang thai</div>`:''} ${romInfo?`<div class="info">NPC khác: ${romInfo}</div>`:''} <div class="npc-a">${acts}</div> </div>`; }
function hang(id){ const r=S.rels[id];if(!r)return; advanceTime(60);r.bond=clamp(r.bond+5); if(r.g!==S.gender)r.love=clamp(r.love+3); apply('mental',5);updateStage(r); addLog(`🤝 Đi chơi với ${r.n}.`,'love'); render();openRel(); }
function dateWith(id){ const r=S.rels[id];if(!r)return; const isG=r.per.includes('galant'); const isS=r.per.includes('stingy'); let cost=300,msg=''; if(isG){cost=0;msg=' — Họ trả hết 🎩';} else if(isS){cost=600;msg=' — Bạn trả gấp đôi 💰';} if(S.st.money<cost){alert('Không đủ tiền.');return;} advanceTime(120); if(cost)apply('money',-cost); r.love=clamp(r.love+12);r.bond=clamp(r.bond+4); apply('mental',10);updateStage(r);S._dated=true; addLog(`💗 Hẹn hò với ${r.n}${msg}`,'love'); render();openRel(); }
function gift(id){ const r=S.rels[id];if(!r)return; if(S.st.money<500){alert('Không đủ tiền.');return;} advanceTime(30);apply('money',-500); r.love=clamp(r.love+15);r.bond=clamp(r.bond+3); apply('mental',3);updateStage(r); addLog(`🎁 Tặng quà cho ${r.n}.`,'love'); render();openRel(); }
function unfriend(id){ const r=S.rels[id];if(!r)return; if(!confirm(`Hủy kết bạn với ${r.n}?`))return; if(S.partnerId===id){S.partnerId=null;syncLove();} delete S.rels[id]; delete S.npcPositions[id]; delete S.npcStates[id]; apply('mental',-8); addLog(`💔 Đã hủy kết bạn với ${r.n}.`,'bad'); closeModal();render(); }
function updateStage(r){ if(['dating','engaged','married'].includes(r.stage))return; const same=r.g===S.gender; if(same){ if(r.bond>=90)r.stage=S.gender==='nam'?'brother':'bestie'; else if(r.bond>=70)r.stage='close'; else r.stage='friend'; }else{ if(r.love>=60)r.stage='crush'; else if(r.bond>=70)r.stage='close'; else r.stage='friend'; } }

// ═══════════ CHAT ═══════════
let _chatId=null;
const CHAT_TOPICS_GLOBAL=[ {id:'greet',n:'👋 Chào',f:2,l:1,r:{vuitinh:'"Ơ cậu đến rồi!"',hoatbat:'"Hi cậu!"',tramtinh:'"Ừ, chào."',lanhlung:'"...Chào."',def:'"Chào cậu!"'}}, {id:'ask',n:'❓ Hỏi thăm',f:3,l:2,r:{quantam:'"Ngày tớ bình thường. Còn cậu?"',noilo:'"Hôm nay tớ hơi lo..."',def:'"Cũng được."'}}, {id:'khen',n:'💐 Khen',f:3,l:4,r:{langman:'"Cậu làm tớ ngại..."',lanhlung:'"Ừ, biết rồi."',def:'"Cảm ơn!"'}}, {id:'share',n:'💭 Chia sẻ',f:4,l:5,r:{sautam:'"...Cảm ơn cậu."',langman:'"Tớ thích người dám nói."',def:'"Ừ, tớ hiểu."'}}, {id:'view_love',n:'💗 Tình yêu',f:3,l:4,view:'love',r:{langman:'"Yêu là cảm xúc."',thucte:'"Yêu phải thực tế."',def:'"Chủ đề khó."'}}, {id:'view_career',n:'💼 Sự nghiệp',f:3,l:3,view:'career',r:{thamvong:'"Sự nghiệp là ưu tiên."',doclap:'"Cần tự do."',def:'"Mỗi người có hướng."'}}, {id:'view_money',n:'💰 Tiền',f:3,l:3,view:'money',r:{stingy:'"Phải tiết kiệm."',thucte:'"Tiền không tự sinh."',def:'"Tiền là công cụ."'}}, {id:'view_family',n:'👨‍👩‍👧 Gia đình',f:4,l:5,view:'family',r:{quantam:'"Tớ muốn gia đình ấm."',doclap:'"Cần không gian riêng."',def:'"Gia đình quan trọng."'}}, {id:'flirt',n:'😘 Thả thính',f:0,l:8,stage:['crush','dating'],r:{langman:'"Tim tớ đập nhanh..."',galant:'"Cậu muốn gì tớ chiều."',def:'"Cậu lạ lắm nha."'}} ];
function openChat(id){ const r=S.rels[id];if(!r)return; _chatId=id; if(!S.chats[id])S.chats[id]=[]; renderChat(); }
function renderChat(){ const r=S.rels[_chatId];if(!r)return; const log=S.chats[_chatId]; const viewsHtml=r.views?` <h3>Quan điểm</h3> <div class="view">💗 ${r.views.love}</div> <div class="view">💼 ${r.views.career}</div> <div class="view">💰 ${r.views.money}</div> <div class="view">👨‍👩‍👧 ${r.views.family}</div> `:''; showModal(` <h2>💬 ${r.av} ${r.n}</h2> <p style="font-size:10px;color:#94a3b8">${r.age}t · ${JOBS[r.job]?.n||r.job} · ${r.per.map(t=>TRAITS[t]).join(' ')}</p> ${r.angry?'<div class="warn">😡 Đang giận bạn</div>':''} ${viewsHtml} <h3>Trò chuyện</h3> <div class="chat" id="chat"> ${log.length===0?'<div class="msg sys">Bắt đầu...</div>':''} ${log.map(m=>`<div class="msg ${m.who}">${m.t}</div>`).join('')} </div> <div style="margin-bottom:6px"> ${CHAT_TOPICS_GLOBAL.filter(t=>!t.stage||t.stage.includes(r.stage)).map(t=> `<button class="topic" onclick="doChat('${t.id}')">${t.n}</button>` ).join('')} </div> <button class="btn sec" onclick="openRel()">← Quay lại</button> `); setTimeout(()=>{const c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight;},50); }
function doChat(tid){ const r=S.rels[_chatId];if(!r)return; const t=CHAT_TOPICS_GLOBAL.find(x=>x.id===tid);if(!t)return; S.chats[_chatId].push({who:'you',t:t.n.replace(/^\S+\s/,'')}); if(t.view&&r.views&&r.views[t.view]){ S.chats[_chatId].push({who:'them',t:r.views[t.view]}); if(r.per.some(p=>t.r[p]))r.love=clamp(r.love+3); }else{ let mul=1; if(t.r&&r.per.some(p=>t.r[p]))mul=1.3; if(r.angry)mul=0.3; r.bond=clamp(r.bond+Math.round((t.f||0)*mul)); if(r.g!==S.gender)r.love=clamp(r.love+Math.round((t.l||0)*mul)); let resp=t.r.def; if(r.angry)resp='"..." (họ không muốn nói chuyện)'; else for(const p of r.per){if(t.r[p]){resp=t.r[p];break;}} S.chats[_chatId].push({who:'them',t:resp}); } apply('mental',2);advanceTime(15);updateStage(r); if(S.chats[_chatId].length>30)S.chats[_chatId].splice(0,S.chats[_chatId].length-30); addLog(`💬 Chat với ${r.n}.`,'love'); render();renderChat(); }

// ═══════════ PROPOSE / WEDDING ═══════════
function openPropose(){ const p=getPartner();if(!p||p.stage!=='dating')return; const love=p.love; let chance; if(love<70)chance=0; else if(love>=95)chance=1; else chance=(love-70)/25; const pct=Math.round(chance*100); showModal(` <h2>💍 Cầu hôn ${p.n}</h2> <div style="background:#0f172a;padding:10px;border-radius:8px;font-size:11px;color:#cbd5e1;margin:10px 0"> Tình cảm: ${Math.round(love)}/100<br>Nhẫn: 5.000đ<br> Cơ hội: <b style="color:${pct>=70?'#22c55e':pct>=30?'#facc15':'#ef4444'}">${pct}%</b> </div> <button class="btn gold" ${S.st.money>=5000?'':'disabled'} onclick="doPropose()">Cầu hôn</button> <button class="btn sec" onclick="openRel()">Để sau</button> `); }
function doPropose(){ const p=getPartner();if(!p||S.st.money<5000)return; let chance; if(p.love<70)chance=0; else if(p.love>=95)chance=1; else chance=(p.love-70)/25; apply('money',-5000); if(Math.random()<chance){ p.stage='engaged';p.love=clamp(p.love+15);syncLove(); apply('mental',20); addLog(`💍 ${p.n} đồng ý!`,'love'); showModal(`<h2>💍 Đồng ý!</h2><p style="text-align:center;font-size:50px">${p.av}</p><button class="btn pri" onclick="openRel()">OK</button>`); }else{ p.love=clamp(p.love-15);syncLove();makeAngry(p,5,2); addLog(`💔 ${p.n} từ chối.`,'bad'); showModal(`<h2>💔 Từ chối</h2><p style="text-align:center;font-size:50px">😢</p><button class="btn sec" onclick="openRel()">Buồn</button>`); } render(); }
function openWedding(){ const p=getPartner();if(!p||p.stage!=='engaged')return; const can=S.st.money>=10000; showModal(` <h2>💒 Đám cưới</h2> <div style="background:#0f172a;padding:10px;border-radius:8px;font-size:11px;color:#cbd5e1;margin:10px 0"> Chi phí: 10.000đ<br> Sau cưới, ${p.n} đóng góp mỗi ngày </div> <button class="btn gold" ${can?'':'disabled'} onclick="doWedding()">Tổ chức</button> <button class="btn sec" onclick="openRel()">Để sau</button> `); }
function doWedding(){ const p=getPartner(); if(!p||p.stage!=='engaged'||S.st.money<10000)return; apply('money',-10000); p.stage='married';p.love=clamp(p.love+15);syncLove(); apply('mental',30); addLog(`💒 Kết hôn với ${p.n}!`,'love'); showModal(`<h2>💒 Đám cưới</h2><p style="text-align:center;font-size:50px">💍💐🎊</p><button class="btn gold" onclick="openRel()">🎉</button>`); render(); }

// ═══════════ JOBS ═══════════
function openJobs(){ const playerRank=EDU_RANK[S.edu]; const sorted=Object.entries(JOBS).sort((a,b)=>{ const ra=EDU_RANK[a[1].edu]||0,rb=EDU_RANK[b[1].edu]||0; return ra-rb||a[1].w-b[1].w; }); showModal(` <h2>💼 Chọn nghề</h2> <p style="font-size:11px;color:#94a3b8">Học vấn: <b>${EDU_LABEL[S.edu]}</b></p> ${sorted.map(([k,j])=>{ const reqRank=j.edu?EDU_RANK[j.edu]:0; const locked=playerRank<reqRank; const cur=S.job===k; return `<button class="btn ${cur?'pri':'sec'}" style="text-align:left;padding:7px 10px;margin-bottom:3px" ${locked||cur?'disabled':''} onclick="changeJob('${k}')"> ${j.i} ${j.n} — ${fmt(j.w)}/ngày ${locked?`<br><small style="color:#fca5a5">🔒 Cần ${EDU_LABEL[j.edu]}</small>`:''} ${cur?'<br><small>Đang làm</small>':''} </button>`; }).join('')} <button class="btn sec" style="margin-top:8px" onclick="closeModal()">Đóng</button> `); }
function changeJob(k){ const j=JOBS[k];if(!j)return; const reqRank=j.edu?EDU_RANK[j.edu]:0; if(EDU_RANK[S.edu]<reqRank)return; S.job=k; addLog(`Chuyển sang: ${j.i} ${j.n}`,'info'); closeModal();render(); }

// ═══════════ MODAL ═══════════
function showModal(h){document.getElementById('mbox').innerHTML=h;document.getElementById('modal').classList.add('on');}
function closeModal(){document.getElementById('modal').classList.remove('on');}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal();};

// ═══════════ RENDER UI ═══════════
function updateTimeUI(){
  const t = getGameTime();
  document.getElementById('timeTag').textContent = `📅 ${t.dw} · ${pad2(t.hour)}:${pad2(t.minute)} · Ngày ${t.day}`;
  document.getElementById('timeHud').textContent = `${pad2(t.hour)}:${pad2(t.minute)} · ${t.dwFull}`;
}
function render(){ 
  if(!S||!S.gender)return; 
  updateTimeUI();
  document.getElementById('money').textContent=fmt(S.st.money); 
  document.getElementById('job').textContent=JOBS[S.job].i+' '+JOBS[S.job].n; 
  document.getElementById('edu').textContent=EDU_LABEL[S.edu]+(S.eduProgress?` (${S.eduProgress})`:''); 
  const p=getPartner(); const pt=document.getElementById('partnerTag'); 
  if(p){pt.style.display='';pt.textContent=`${p.av} ${p.n}`;} else pt.style.display='none'; 
  const defs=[ {k:'health',l:'❤️',c:'#ef4444'},{k:'energy',l:'⚡',c:'#facc15'}, {k:'mental',l:'🧠',c:'#a78bfa'},{k:'skill',l:'📚',c:'#38bdf8'}, {k:'love',l:'💗',c:'#ec4899'},{k:'passion',l:'🔥',c:'#fb923c'} ]; 
  document.getElementById('stats').innerHTML=defs.map(d=>{ const v=S.st[d.k]; return `<div class="stat"><div class="lbl"><span>${d.l} ${d.k}</span><span>${Math.round(v)}</span></div><div class="bar"><div class="fill" style="width:${v}%;background:${d.c}"></div></div></div>`; }).join(''); 
  document.getElementById('acts').innerHTML=ACTIONS.map(a=>{ 
    const dis=S.ended ||(a.once==='day'&&((a.id==='work'&&S._worked)||(a.id==='study'&&S._schooled))) ||(a.afterWork&&!S._worked) ||(a.minMoney&&S.st.money<a.minMoney); 
    const lock=(a.afterWork&&!S._worked)?' 🔒':''; 
    const hours = a.t>=60 ? (a.t/60).toFixed(1).replace('.0','')+'h' : a.t+'p';
    return `<button class="act ${a.ent?'ent':''}" data-id="${a.id}" ${dis?'disabled':''}>${a.n}${lock}<span class="cost">⏱ ${hours}${a.transport?' · +'+a.transport+'đ':''}</span></button>`; 
  }).join(''); 
  document.querySelectorAll('.act').forEach(b=>b.onclick=()=>doAction(b.dataset.id)); 
  document.getElementById('log').innerHTML=S.log.map(e=> `<div class="e ${e.t}"><b>${e.dw} ${e.time}:</b> ${e.m}</div>`).join(''); 
  save(); 
}

// ═══════════ START ═══════════
function showStart(){ window._g=null;window._h=[]; showModal(` <h2>Chào mừng đến Nhịp Đời Anime 2D</h2> <p>Tạo nhân vật và khám phá thị trấn!</p> <h3>Giới tính</h3> <div class="opt"> <button onclick="pickG(this,'nam')">👨 Nam</button> <button onclick="pickG(this,'nu')">👩 Nữ</button> <button onclick="pickG(this,'khac')">🧑 Khác</button> </div> <h3>Tên</h3> <input class="inp" id="nm" maxlength="20" placeholder="Nhập tên..."> <h3>Sở thích (2-3)</h3> <div class="opt" id="hobbies"> ${Object.entries(HOBBIES).map(([k,v])=>`<button onclick="pickH(this,'${k}')">${v.e} ${v.n}</button>`).join('')} </div> <button class="btn pri" style="margin-top:12px" onclick="startGame()">Bắt đầu cuộc đời</button> `); }
function pickG(b,g){window._g=g;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');} 
function pickH(b,h){ const i=window._h.indexOf(h); if(i>=0){window._h.splice(i,1);b.classList.remove('sel');} else if(window._h.length<3){window._h.push(h);b.classList.add('sel');} }
function startGame(){ 
  if(!window._g)return alert('Chọn giới tính.'); 
  if(window._h.length<2)return alert('Chọn ít nhất 2 sở thích.'); 
  S=newState(); 
  S.gender=window._g; 
  S.name=(document.getElementById('nm').value||'').trim()||'Bạn'; 
  S.hobbies=[...window._h]; 
  S.playerPos = {x:5*TILE, y:6*TILE};
  if(window._g === 'nu'){ S.playerAppearance = {hair:'#5a3a8c', hairStyle:'anime_long', hairColor2:'#9b7cf5', shirt:'#ff9ec4', shirtAccent:'#ec4899', pants:'#4a5568', skin:'#ffe0c4', skinShade:'#f5c5a0', eye:'#ec4899'}; }
  else if(window._g === 'nam'){ S.playerAppearance = {hair:'#3b2e2a', hairStyle:'anime_spike', hairColor2:'#6b5248', shirt:'#4a7cff', shirtAccent:'#2d5fd9', pants:'#2d3748', skin:'#ffe0c4', skinShade:'#f5c5a0', eye:'#4a7cff'}; }
  else { S.playerAppearance = {hair:'#9b7cf5', hairStyle:'anime_twin', hairColor2:'#c9b3ff', shirt:'#fbbf24', shirtAccent:'#f59e0b', pants:'#5b21b6', skin:'#ffe0c4', skinShade:'#f5c5a0', eye:'#a855f7'}; }
  for(const npc of NPC_POOL)S.npcRels[npc.id]={}; 
  S.petals = [];
  initPetals();
  addLog(`Chào ${S.name}! Chúc bạn có một cuộc đời thú vị.`,'info'); 
  addLog('💡 Bấm vào bản đồ hoặc dùng phím mũi tên để di chuyển.','info');
  closeModal();render(); 
  setTimeout(()=>{ const h = document.getElementById('hint'); if(h) h.style.opacity = 0; }, 6000);
}

// ═══════════ END ═══════════
function gameOver(reason,detail){ 
  S.ended=true; 
  const kids=S.children.map(c=>`👶 ${c.name}`).join('<br>')||'Chưa có con'; 
  showModal(`<h2>🏁 ${reason}</h2><p>${detail}</p> <p><b>${S.name}</b><br>Ngày: ${getGameTime().day}<br>Tiền: ${fmt(S.st.money)}<br>Nghề: ${JOBS[S.job].i} ${JOBS[S.job].n}<br>Người thương: ${getPartner()?getPartner().n:'Độc thân'}</p> <p><b>Con cái:</b><br>${kids}</p> <button class="btn pri" onclick="hardReset()">Chơi lại</button>`); 
  render(); 
}
function hardReset(){ S=newState();closeModal(); showStart();render(); }

// ═══════════ WIRE ═══════════
document.getElementById('sleepBtn').onclick = () => {
  const t = getGameTime();
  const target = (t.hour >= 6) ? (24 - t.hour + 6) * 60 - t.minute : (6 - t.hour) * 60 - t.minute;
  advanceTime(target);
  apply('energy', 60); apply('mental', 15); apply('health', 5);
  addLog(`😴 Ngủ ngon! Năng lượng hồi phục.`, 'good');

};

// ═══════════ INIT ═══════════
async function init(){
  _user = {username:'Người chơi'};
  const raw = localStorage.getItem('nhipdoi4d_save');
  if(raw){
    try {
      S = JSON.parse(raw);
      if(!S || !S.gender) S = null;
    } catch(e){ S = null; }
  }
  if(!S || !S.gender){ S = newState(); render(); showStart(); }
  else {
    if(!S.npcRels)S.npcRels={}; for(const npc of NPC_POOL)if(!S.npcRels[npc.id])S.npcRels[npc.id]={};
    if(!S.children)S.children=[];
    if(!S.assets)S.assets={ house:'none', car:'none', business:'none' };
    if(!S.npcPositions)S.npcPositions={};
    if(!S.npcStates)S.npcStates={};
    if(!S.playerPos)S.playerPos={x:5*TILE, y:6*TILE};
    if(!S.playerAppearance)S.playerAppearance={hair:'#3b2e2a', hairStyle:'anime_spike', hairColor2:'#6b5248', shirt:'#c084fc', shirtAccent:'#a855f7', pants:'#2d3748', skin:'#ffe0c4', skinShade:'#f5c5a0', eye:'#4a7cff'};
    if(!S.lastDayProcessed) S.lastDayProcessed = Math.floor(S.gameMinutes / (24*60));
    if(!S.clickMark) S.clickMark = null;
    if(!S.petals) S.petals = [];
    for(const r of Object.values(S.rels)){ if(r.angry===undefined)r.angry=false; if(r.angryDays===undefined)r.angryDays=0; if(r.expecting===undefined){r.expecting=false;r.expectingWeeks=0;} }
    initNpcPositions();
    initPetals();
    setSv('saved'); render();
  }
  buildTravelBar();
  _lastRealTime = Date.now();
  gameLoop();
}

// ═══════════ GAME LOOP ═══════════
let _gameLoopStarted = false;
function gameLoop(){
  if(_gameLoopStarted) return;
  _gameLoopStarted = true;
  function tick(now){
    if(S && S.gender){
      const realNow = Date.now();
      const dt = (realNow - _lastRealTime) / 1000;
      _lastRealTime = realNow;
      if(!S.ended && dt < 2 && dt > 0){
        S.gameMinutes += dt * MIN_PER_SEC;
        processTimeAdvance();
      }
      
      updatePlayer();
      updateNpcs();
      checkInteraction();
      drawWorld(now || 0);
      
      const locInfo = getPlayerLocation();
      document.getElementById('locName').textContent = locInfo.loc.emoji + ' ' + locInfo.loc.name;
      updateTimeUI();
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function getPlayerLocation(){
  const px = S.playerPos.x + TILE/2;
  const py = S.playerPos.y + TILE/2;
  for(const [key, loc] of Object.entries(LOCATIONS)){
    if(px >= (loc.x-1)*TILE && px <= (loc.x+loc.w+1)*TILE && py >= (loc.y-1)*TILE && py <= (loc.y+loc.h+1)*TILE){
      return {key, loc};
    }
  }
  return {key:'road', loc:{name:'Ngoài đường', emoji:'🛣️'}};
}

// Polyfill roundRect
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
    if(w<2*r)r=w/2; if(h<2*r)r=h/2;
    this.beginPath();
    this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r);
    this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r);
    this.arcTo(x,y,x+w,y,r); this.closePath();
    return this;
  };
}

Object.assign(window,{ pickG,pickH,startGame,showModal,closeModal,tryMeet,skip,rollProfiles, openChat,doChat,openRel,hang,gift,hardReset,openMeet,unfriend,openJobs, changeJob,openPropose,doPropose,openWedding,doWedding,dateWith, tryPregnant,openChildren,playWithChild,buyForChild,sendChildToSchool, openAssets,buyAsset,rejectNpcProposal });
init();
