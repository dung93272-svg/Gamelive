<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>My Life</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#eaeaea;min-height:100vh;padding:8px;display:flex;justify-content:center;font-size:13px}
.app{width:100%;max-width:1100px;background:#1e293b;border-radius:16px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
h1{font-size:22px;text-align:center;background:linear-gradient(90deg,#f472b6,#a78bfa,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:3px;margin-bottom:6px;font-weight:900}
.subtitle{text-align:center;font-size:11px;color:#94a3b8;margin-bottom:10px}
.time-bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;background:#0f172a;border-radius:10px;padding:8px 12px;margin-bottom:10px;border:1px solid #334155;font-size:12px}
.time-bar .clock{font-weight:bold;color:#38bdf8;font-variant-numeric:tabular-nums}
.time-bar .day{color:#facc15;font-weight:bold}
.time-bar .age{color:#f472b6;font-weight:bold}
.time-bar .period{padding:2px 8px;border-radius:10px;background:#334155;color:#cbd5e1;font-size:11px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-bottom:10px}
.stat{background:#0f172a;border-radius:8px;padding:6px 10px;border:1px solid #334155}
.stat.danger{border-color:#ef4444;animation:pulseRed 1s infinite}
.stat.warn{border-color:#f59e0b}
@keyframes pulseRed{0%,100%{background:#0f172a}50%{background:#450a0a}}
.stat .lbl{font-size:11px;color:#94a3b8;display:flex;justify-content:space-between;margin-bottom:3px}
.stat .bar{height:6px;background:#1e293b;border-radius:4px;overflow:hidden}
.stat .fill{height:100%;transition:width .4s;border-radius:4px}
.top-info{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{background:#0f172a;padding:4px 10px;border-radius:20px;font-size:11px;border:1px solid #334155;font-weight:bold}
.pill.name{color:#facc15;background:#422006;border-color:#a16207}
.pill.money{color:#6ee7b7;border-color:#065f46;background:#052e16}
.pill.job{color:#38bdf8;border-color:#075985;background:#082f49}
.pill.edu{color:#a78bfa;border-color:#5b21b6;background:#2e1065}
.pill.partner{color:#f472b6;border-color:#9d174d;background:#500724}
.section{background:#0f172a;border-radius:12px;padding:10px;margin-bottom:10px;border:1px solid #334155}
.section-title{font-size:12px;font-weight:bold;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.locations-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.loc-btn{background:#1e293b;border:2px solid #334155;color:#e2e8f0;padding:8px 6px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:11px;text-align:center;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:3px}
.loc-btn:hover{background:#334155;transform:translateY(-2px)}
.loc-btn.active{background:#4c1d95;border-color:#a78bfa;color:#fff}
.loc-btn .em{font-size:20px}
.loc-btn .nm{font-weight:bold}
.acts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;max-height:400px;overflow-y:auto;padding-right:4px}
.act-btn{background:#1e293b;border:2px solid #334155;color:#e2e8f0;padding:8px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:12px;text-align:left;transition:.15s}
.act-btn:hover:not(:disabled){background:#334155;border-color:#7c3aed;transform:translateY(-1px)}
.act-btn:disabled{opacity:.4;cursor:not-allowed}
.act-btn.exam{border-color:#facc15;background:#422006;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(250,204,21,.4)}50%{box-shadow:0 0 0 8px rgba(250,204,21,0)}}
.act-btn .nm{font-weight:bold;display:block;margin-bottom:3px}
.act-btn .meta{font-size:10px;color:#94a3b8;display:flex;justify-content:space-between;gap:4px}
.act-btn .meta .cost{color:#facc15;font-weight:bold}
.act-btn .meta .time{color:#38bdf8}
.act-btn .meta .req{color:#f87171}
.log{max-height:200px;overflow-y:auto;font-size:11px;line-height:1.6}
.log .e{padding:5px 8px;border-radius:6px;margin-bottom:4px;background:#1e293b;border-left:3px solid #475569}
.log .e.good{border-left-color:#22c55e;color:#86efac}
.log .e.bad{border-left-color:#ef4444;color:#fca5a5}
.log .e.love{border-left-color:#ec4899;color:#f9a8d4}
.log .e.info{border-left-color:#38bdf8;color:#7dd3fc}
.log .e.money{border-left-color:#6ee7b7;color:#6ee7b7}
.log .e.day{background:#1e293b;color:#facc15;text-align:center;font-weight:bold;border-left-color:#facc15}
.log .e.npc{border-left-color:#f59e0b;background:#1a1206;color:#fcd34d}
.log .e.warn{border-left-color:#f59e0b;background:#422006;color:#fde68a}
.footer{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{flex:1;min-width:70px;padding:9px 10px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px;font-family:inherit;transition:.15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff}
.btn.sec{background:#334155;color:#e2e8f0}
.btn.sec:hover{background:#475569}
.btn.gold{background:linear-gradient(135deg,#f59e0b,#facc15);color:#1c1917}
.btn.danger{background:#7f1d1d;color:#fecaca}
.btn.success{background:linear-gradient(135deg,#22c55e,#10b981);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:12px;z-index:100}
.modal.on{display:flex}
.mbox{background:#1e293b;border-radius:14px;padding:16px;max-width:680px;width:100%;max-height:92vh;overflow-y:auto;border:1px solid #475569}
.mbox h2{font-size:16px;margin-bottom:10px;color:#f472b6}
.mbox h3{font-size:11px;text-transform:uppercase;color:#94a3b8;margin:12px 0 6px;letter-spacing:1px}
.mbox p{font-size:12px;color:#cbd5e1;line-height:1.6;margin-bottom:8px}
.mbox .btn{width:100%;margin-top:6px}
.opt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.opt button{flex:1;min-width:70px;padding:8px;background:#334155;border:2px solid transparent;color:#e2e8f0;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit}
.opt button.sel{border-color:#a78bfa;background:#4c1d95}
.inp{width:100%;padding:9px;background:#0f172a;border:1px solid #334155;color:#eaeaea;border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:8px}
.npc-card{background:#0f172a;border-radius:10px;padding:10px;margin-bottom:8px;border-left:4px solid #7c3aed}
.npc-card.p{border-left-color:#ec4899;background:linear-gradient(135deg,#1f0a1e,#2a0f30)}
.npc-card.a{border-left-color:#ef4444;background:linear-gradient(135deg,#1a0505,#2a0808)}
.npc-card.m{border-left-color:#22c55e;background:linear-gradient(135deg,#052e16,#0a3d1f)}
.npc-card.c{border-left-color:#fbbf24;background:linear-gradient(135deg,#2a1f0a,#3a2a0f)}
.npc-card.vip{border-left-color:#facc15;background:linear-gradient(135deg,#422006,#78350f);box-shadow:0 0 12px rgba(250,204,21,.3)}
.npc-h{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.npc-h .av{font-size:22px}
.npc-h .nm{font-weight:bold;color:#facc15;font-size:13px}
.bd{font-size:10px;background:#1e293b;padding:2px 8px;border-radius:10px;color:#cbd5e1}
.bd.gold{background:#78350f;color:#fde68a}
.bd.red{background:#7f1d1d;color:#fecaca}
.bd.blue{background:#1e3a8a;color:#93c5fd}
.bd.green{background:#064e3b;color:#6ee7b7}
.bond{height:6px;background:#1e293b;border-radius:4px;overflow:hidden;margin:6px 0}
.bond-f{height:100%;background:linear-gradient(90deg,#ec4899,#a78bfa);transition:.3s}
.bond-f.neg{background:linear-gradient(90deg,#991b1b,#dc2626)}
.npc-a{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.npc-a .btn{padding:6px 8px;font-size:11px;flex:1;min-width:0;margin:0}
.warn{font-size:11px;color:#fca5a5;font-weight:bold;background:#2a0505;padding:4px 8px;border-radius:4px;margin:5px 0}
.info{font-size:10px;color:#f59e0b;padding:3px 0}
.asset-card{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.asset-card h4{color:#facc15;font-size:12px;margin-bottom:3px}
.asset-card p{font-size:10px;color:#94a3b8}
.chat{background:#0f172a;border-radius:10px;padding:10px;height:240px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.msg{max-width:78%;padding:7px 11px;border-radius:12px;font-size:11px;line-height:1.4}
.msg.you{align-self:flex-end;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff}
.msg.them{align-self:flex-start;background:#1e293b;color:#e2e8f0}
.msg.sys{align-self:center;font-size:10px;color:#94a3b8;font-style:italic}
.topic{background:#1e3a5f;border:none;color:#e2e8f0;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:11px;font-family:inherit;margin:2px}
.notification{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1e293b;border:2px solid #7c3aed;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:bold;color:#eaeaea;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;max-width:90%;text-align:center}
.notification.on{display:block;animation:pop .3s}
.notification.warn{border-color:#f59e0b;background:#422006}
.notification.bad{border-color:#ef4444;background:#450a0a}
.notification.good{border-color:#22c55e;background:#052e16}
@keyframes pop{0%{transform:translateX(-50%) scale(.8);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:#475569;border-radius:4px}
.pet-card{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:8px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
</style>
</head>

// ═══════════ HELPERS ═══════════
const clamp = (v, a=0, b=100) => Math.max(a, Math.min(b, v));
const fmt = v => (v < 0 ? '-' : '') + Math.abs(Math.round(v)).toLocaleString('vi-VN') + 'đ';
const pad2 = n => String(n).padStart(2, '0');

function getTime() {
  const total = Math.floor(S.gameMinutes);
  const day = Math.floor(total / 1440) + 1;
  const minOfDay = total % 1440;
  const hour = Math.floor(minOfDay / 60);
  const minute = minOfDay % 60;
  const dow = (day - 1) % 7;
  return {day, hour, minute, dow,
    dw: ['T2','T3','T4','T5','T6','T7','CN'][dow],
    dwFull: ['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'][dow],
    period: getPeriod(hour), periodLabel: getPeriodLabel(hour)
  };
}
function getPeriod(h) {
  if (h >= 6 && h < 11) return 'sang';
  if (h >= 11 && h < 14) return 'trua';
  if (h >= 14 && h < 18) return 'chieu';
  if (h >= 18 && h < 22) return 'toi';
  return 'dem';
}
function getPeriodLabel(h) {
  if (h >= 5 && h < 11) return '🌅 Sáng';
  if (h >= 11 && h < 14) return '☀️ Trưa';
  if (h >= 14 && h < 18) return '🌤️ Chiều';
  if (h >= 18 && h < 22) return '🌆 Tối';
  return '🌙 Đêm';
}
function addLog(m, t='info') {
  const time = getTime();
  S.log.unshift({m, t, time: `${pad2(time.hour)}:${pad2(time.minute)}`, dw: time.dw, day: time.day});
  if (S.log.length > 60) S.log.pop();
}
function apply(k, v) {
  if (k === 'money') { S.st.money = Math.round(S.st.money + v); return; }
  S.st[k] = clamp(S.st[k] + v);
}
function getPartner() { return S.partnerId ? S.rels[S.partnerId] : null; }
function syncLove() { const p = getPartner(); S.st.love = p ? Math.max(0, p.love) : 0; }
function prestige() {
  const av = (HOUSES.find(h => h.id === S.assets.house)?.p || 0) + (CARS.find(c => c.id === S.assets.car)?.p || 0) + (BUSINESS.find(b => b.id === S.assets.business)?.p || 0);
  return Math.round((S.st.money + av) / 1200 + EDU_RANK[S.edu] * 15 + S.st.skill * 0.6);
}

// ═══════════ TIME ═══════════
function processTime() {
  const time = getTime();
  if (time.day > _lastDay) {
    for (let d = _lastDay + 1; d <= time.day; d++) endOfDay(d);
    _lastDay = time.day;
  }
  if (time.dow === 0 && time.day > _lastWeek) { endOfWeek(); _lastWeek = time.day; }
}
function endOfDay(day) {
  // Ăn uống tự động
  apply('money', -200);
  // Sinh hoạt
  const houseM = HOUSES.find(h => h.id === S.assets.house)?.m || 0;
  if (houseM) apply('mental', houseM);
  // Thú cưng
  const petBonus = S.pets.reduce((s, p) => s + (PETS.find(x => x.id === p.type)?.mental || 0), 0);
  if (petBonus) apply('mental', petBonus);
  // Con cái
  if (S.children.length) apply('money', -S.children.length * 500);
  // Kinh doanh
  const bizInc = BUSINESS.find(b => b.id === S.assets.business)?.inc || 0;
  if (bizInc > 0) apply('money', Math.round(bizInc / 7));
  // Partner income
  const partner = getPartner();
  if (partner?.stage === 'married' && partner.job) apply('money', Math.round((JOBS[partner.job]?.w || 0) * 0.7));
  // Age
  if ((day - 1) % DAYS_PER_YEAR === 0 && day > 1) {
    S.age++;
    addLog(`🎂 Sinh nhật! Bạn ${S.age} tuổi.`, 'good');
    notify(`🎂 Sinh nhật ${S.age} tuổi!`, 'good');
  }
  // Bank interest
  processBankInterest(day);
  // Reset daily
  S._worked = false; S._schooled = false;
  // Warnings
  checkWarnings();
  checkHealth();
  npcDailyTick();
  addLog(`🌅 Ngày ${day} bắt đầu.`, 'day');
  save();
}
function endOfWeek() { npcWeeklyTick(); }

function processBankInterest(currentDay) {
  if (!S.bankDeposits) S.bankDeposits = [];
  const matured = [];
  for (const dep of S.bankDeposits) {
    if (currentDay >= dep.matureDay) {
      const days = dep.term;
      const finalAmount = Math.round(dep.amount * Math.pow(1 + dep.rate, days));
      const interest = finalAmount - dep.amount;
      apply('money', finalAmount);
      matured.push({dep, interest, finalAmount});
    }
  }
  S.bankDeposits = S.bankDeposits.filter(d => currentDay < d.matureDay);
  for (const m of matured) {
    addLog(`🏦 Sổ tiết kiệm đến hạn: +${fmt(m.finalAmount)} (lãi ${fmt(m.interest)})`, 'money');
    notify(`🏦 Nhận ${fmt(m.finalAmount)} từ sổ tiết kiệm!`, 'good');
  }
}

function checkWarnings() {
  // Năng lượng cảnh báo
  if (S.st.energy < 50 && S.st.energy >= 20 && !S.warnings.energy) {
    notify('⚠️ Năng lượng thấp! Hãy nghỉ ngơi.', 'warn');
    addLog('⚠️ Năng lượng dưới 50!', 'warn');
    S.warnings.energy = true;
  }
  if (S.st.energy >= 50) S.warnings.energy = false;
  // Năng lượng < 20 => nhập viện
  if (S.st.energy < 20) {
    apply('money', -5000);
    apply('energy', 40);
    addLog('🏥 Kiệt sức! Nhập viện (-5.000đ)', 'bad');
    notify('🏥 Nhập viện! -5.000đ', 'bad');
  }
  // Tinh thần < 30
  if (S.st.mental < 30 && !S.warnings.mental) {
    notify('⚠️ Tinh thần thấp! Đi trị liệu tâm lý.', 'warn');
    addLog('⚠️ Tinh thần dưới 30!', 'warn');
    S.warnings.mental = true;
  }
  if (S.st.mental >= 30) S.warnings.mental = false;
  // Sức khỏe <= 0
  if (S.st.health <= 0) {
    apply('money', -5000);
    apply('health', 30);
    addLog('🏥 Ngất xỉu! Nhập viện (-5.000đ)', 'bad');
  }
}

function checkHealth() {
  if (S.st.health < 0) S.st.health = 0;
  if (S.st.energy < 0) S.st.energy = 0;
  if (S.st.mental < 0) S.st.mental = 0;
}

// ═══════════ ACTIVITY ═══════════
function selectLocation(locId) {
  _currentLoc = locId;
  render();
  document.getElementById('actsSection').style.display = 'block';
  const loc = LOCATIONS[locId];
  document.getElementById('actsTitle').textContent = `${loc.e} ${loc.n} — ${loc.desc}`;
  document.getElementById('actsCount').textContent = `${loc.acts.length} hoạt động`;
}

function checkReq(act) {
  const time = getTime();
  const reqs = [];
  if (act.time && !act.time.includes(time.period)) {
    const m = {sang:'Sáng', trua:'Trưa', chieu:'Chiều', toi:'Tối', dem:'Đêm'};
    reqs.push(`Cần ${act.time.map(t => m[t]).join('/')}`);
  }
  if (act.once === 'day' && act.id === 'work' && S._worked) reqs.push('Hôm nay đã làm');
  if (act.special === 'afterWork' && !S._worked) reqs.push('Phải đi làm trước');
  if (act.special === 'exam') {
    if (S.edu === 'ts') reqs.push('Đã đạt cấp cao nhất');
    else if (S.eduProgress < EXAM_REQ[S.edu]) reqs.push(`Cần ${EXAM_REQ[S.edu]} buổi học (hiện ${S.eduProgress})`);
  }
  if (act.cost > 0 && S.st.money < act.cost) reqs.push('Không đủ tiền');
  // Năng lượng âm thì không làm
  if (S.st.energy < 5 && act.id !== 'sleep4' && act.id !== 'sleep6' && act.id !== 'sleep8' && act.id !== 'checkup' && act.id !== 'treat' && act.id !== 'therapy') {
    reqs.push('Quá mệt, cần nghỉ ngơi');
  }
  return reqs;
}

function doActivity(locId, actId) {
  const loc = LOCATIONS[locId];
  const act = loc.acts.find(a => a.id === actId);
  if (!act) return;
  const reqs = checkReq(act);
  if (reqs.length) { notify(`❌ ${reqs[0]}`, 'bad'); return; }
  if (act.cost > 0) apply('money', -act.cost);
  // Special activity handlers
  if (act.special === 'exam') { S.gameMinutes += act.t; processTime(); startExam(); return; }
  if (act.special === 'deposit') { openDepositMenu(); return; }
  if (act.special === 'checkSavings') { openSavingsList(); return; }
  if (act.special === 'buyPets') { openPetShop(); return; }
  // Time
  S.gameMinutes += act.t;
  processTime();
  // Effects
  if (act.ef) {
    for (const [k, v] of Object.entries(act.ef)) {
      if (k === 'money' && typeof v === 'string') {
        const wage = JOBS[S.job]?.w || 0;
        if (v === 'wage') { apply('money', wage); S._worked = true; }
        else if (v === 'half') { apply('money', Math.round(wage * 0.5)); }
      } else if (typeof v === 'number') {
        apply(k, v);
      }
    }
  }
  // Energy cost per activity (5 năng lượng cơ bản, trừ khi là ngủ/nghỉ)
  if (!act.id.startsWith('sleep') && act.id !== 'nap') apply('energy', -5);
  // Progress
  if (act.addsProgress) S.eduProgress += act.addsProgress;
  // Gamble
  if (act.special === 'gamble' && act.gamble) {
    const win = Math.random() < act.gamble.chance;
    const amount = win ? act.gamble.win : act.gamble.lose;
    S.st.money = Math.round(S.st.money + amount);
    addLog(win ? `🎉 Thắng ${fmt(amount)}` : `💸 Thua ${fmt(amount)}`, win ? 'money' : 'bad');
    notify(win ? `🎉 +${fmt(amount)}` : `💸 ${fmt(amount)}`, win ? 'good' : 'bad');
  }
  if (act.special === 'mysteryBox') {
    const r = Math.random();
    let reward = 0, label = '';
    if (r < 0.1) { reward = 0; label = '📦 Hộp rỗng!'; }
    else if (r < 0.4) { reward = act.cost * 0.5; label = '📦 Nhận lại 50%'; }
    else if (r < 0.75) { reward = act.cost * 2; label = '🎁 x2 tiền thưởng!'; }
    else if (r < 0.95) { reward = act.cost * 5; label = '💎 x5 tiền thưởng!'; }
    else { reward = act.cost * 20; label = '👑 JACKPOT x20!'; }
    S.st.money = Math.round(S.st.money + reward);
    addLog(`🎁 Hộp quà: ${label} ${reward > 0 ? '+'+fmt(reward) : ''}`, reward > act.cost ? 'money' : (reward === 0 ? 'bad' : 'info'));
    notify(`🎁 ${label}`, reward > act.cost ? 'good' : (reward === 0 ? 'bad' : 'info'));
  }
  if (act.special === 'interview') {
    const jobList = Object.entries(JOBS).filter(([k, j]) => j.edu && EDU_RANK[S.edu] >= EDU_RANK[j.edu] && j.w > (JOBS[S.job]?.w || 0));
    if (jobList.length > 0) {
      const [jk, jv] = jobList[Math.floor(Math.random() * jobList.length)];
      setTimeout(() => {
        if (confirm(`🎉 Bạn được nhận làm ${jv.i} ${jv.n}!\nLương ${fmt(jv.w)}/ngày. Nhận việc?`)) {
          S.job = jk; addLog(`🎉 Nhận việc: ${jv.i} ${jv.n}`, 'good'); render();
        }
      }, 100);
    } else addLog(`❌ Không có việc tốt hơn.`, 'bad');
  }
  // Check health
  checkHealth();
  checkWarnings();
  // Log
  addLog(`📍 ${loc.e} ${loc.n}: ${act.n}`, act.ef?.money === 'wage' ? 'money' : 'info');
  // NPC encounter
  if (loc.meet) tryEncounterNpc(locId, loc.meet);
  render();
  notify(`✅ ${act.n}`);
  save();
}

// ═══════════ NPC ENCOUNTER ═══════════
function tryEncounterNpc(locId, hobbyList) {
  // Cơ hội gặp NPC: 40% cơ bản, VIP thấp hơn
  if (Math.random() > 0.4) return;
  // Lọc NPC có hobby match và chưa quen
  const met = new Set(Object.values(S.rels).map(r => r.pid));
  const candidates = NPC_POOL.filter(p => !met.has(p.id) && p.hob.some(h => hobbyList.includes(h)));
  if (candidates.length === 0) return;
  // VIP có xác suất thấp hơn
  const normal = candidates.filter(c => !c.vip);
  const vip = candidates.filter(c => c.vip);
  let chosen;
  if (vip.length && Math.random() < 0.15) chosen = vip[Math.floor(Math.random() * vip.length)];
  else chosen = normal.length ? normal[Math.floor(Math.random() * normal.length)] : vip[Math.floor(Math.random() * vip.length)];
  if (!chosen) return;
  // Add relation
  const rid = 'r' + chosen.id;
  const shared = chosen.hob.filter(h => S.hobbies.includes(h));
  S.rels[rid] = {
    id: rid, pid: chosen.id, n: chosen.n, g: chosen.g, av: chosen.av, age: chosen.age, job: chosen.job,
    ap: chosen.ap, wl: chosen.wl, edu: chosen.edu, bg: chosen.bg, per: [...chosen.per], hob: [...chosen.hob],
    bio: chosen.bio, views: chosen.views, vip: chosen.vip,
    bond: 10 + shared.length * 5, love: 5 + shared.length * 3,
    stage: 'friend', angry: false, expecting: false, expectingWeeks: 0
  };
  const isVip = chosen.vip;
  addLog(`🌟 Gặp ${chosen.av} ${chosen.n}${isVip ? ' (VIP!)' : ''} tại ${LOCATIONS[locId].n}!`, isVip ? 'money' : 'npc');
  notify(`🌟 Gặp ${chosen.n}${isVip ? ' (VIP)' : ''}!`, isVip ? 'good' : 'info');
}

// ═══════════ EXAM ═══════════
function startExam() {
  const cfg = EXAM_CONFIG[S.edu];
  if (!cfg) { notify('❌ Đã đạt cấp cao nhất', 'bad'); return; }
  const bank = QUESTIONS[S.edu];
  const shuffled = [...bank].sort(() => Math.random() - 0.5);
  const questions = shuffled.slice(0, cfg.count).map(q => {
    const correctText = q.o[q.a];
    const shuffledOpts = [...q.o].sort(() => Math.random() - 0.5);
    return {q: q.q, o: shuffledOpts, a: shuffledOpts.indexOf(correctText), s: q.s};
  });
  _exam = {questions, idx: 0, correct: 0};
  renderExamQuestion();
}

function renderExamQuestion() {
  if (!_exam) return;
  const {questions, idx, correct} = _exam;
  if (idx >= questions.length) return renderExamResult();
  const q = questions[idx];
  const cfg = EXAM_CONFIG[S.edu];
  const letters = ['A', 'B', 'C', 'D'];
  showModal(`
    <h2>📝 Thi ${cfg.label} — Câu ${idx + 1}/${questions.length}</h2>
    <div style="background:#0f172a;border-radius:8px;padding:8px 12px;margin-bottom:12px">
      <div style="font-size:11px;color:#94a3b8;display:flex;justify-content:space-between">
        <span>📚 ${q.s}</span><span>✅ ${correct}/${idx}</span>
      </div>
      <div style="height:5px;background:#1e293b;border-radius:2px;margin-top:6px;overflow:hidden">
        <div style="height:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899);width:${idx/questions.length*100}%;transition:width .3s"></div>
      </div>
    </div>
    <div style="background:#0f172a;border-radius:10px;padding:16px;margin-bottom:12px;font-size:14px">
      <b>Câu ${idx + 1}:</b> ${q.q}
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${q.o.map((opt, i) => `<button class="btn sec" style="text-align:left;padding:10px 14px" onclick="answerExam(${i})"><b style="color:#a78bfa">${letters[i]}.</b> ${opt}</button>`).join('')}
    </div>
  `);
}

function answerExam(choice) {
  if (!_exam) return;
  const q = _exam.questions[_exam.idx];
  const ok = choice === q.a;
  if (ok) _exam.correct++;
  const letters = ['A','B','C','D'];
  const last = _exam.idx >= _exam.questions.length - 1;
  showModal(`
    <h2>${ok ? '✅ Chính xác!' : '❌ Sai rồi!'}</h2>
    <div style="background:#0f172a;border-radius:10px;padding:16px;margin-bottom:12px">
      <div style="font-size:13px;color:#cbd5e1;margin-bottom:10px">${q.q}</div>
      <div style="font-size:13px;color:${ok ? '#86efac' : '#fca5a5'}">${ok ? '✅' : '❌'} Bạn chọn: <b>${letters[choice]}. ${q.o[choice]}</b></div>
      ${!ok ? `<div style="font-size:13px;color:#86efac;margin-top:6px">✅ Đáp án đúng: <b>${letters[q.a]}. ${q.o[q.a]}</b></div>` : ''}
    </div>
    <button class="btn pri" onclick="nextExamQuestion()">${last ? '📊 Xem kết quả' : '➡️ Câu tiếp'}</button>
  `);
}

function nextExamQuestion() { _exam.idx++; renderExamQuestion(); }

function renderExamResult() {
  const {questions, correct} = _exam;
  const cfg = EXAM_CONFIG[S.edu];
  const total = questions.length;
  const pct = correct / total;
  const passed = pct >= cfg.passRate;
  if (passed) {
    S.edu = cfg.next;
    S.eduProgress = 0;
    apply('mental', 20);
    addLog(`🎓 Thi đỗ ${cfg.label}! (${correct}/${total})`, 'good');
  } else {
    S.eduProgress = 0;
    apply('mental', -15);
    addLog(`❌ Thi trượt ${cfg.label}. Học lại. (${correct}/${total})`, 'bad');
  }
  showModal(`
    <h2>${passed ? '🎉 Đỗ!' : '😢 Trượt'}</h2>
    <div style="text-align:center;font-size:64px;margin:16px 0">${passed ? '🎓' : '📚'}</div>
    <div style="background:#0f172a;border-radius:10px;padding:16px;margin-bottom:12px;text-align:center">
      <div style="font-size:36px;font-weight:bold;color:${passed ? '#22c55e' : '#ef4444'}">${correct}/${total}</div>
      <div style="font-size:14px;color:#94a3b8;margin-top:6px">${Math.round(pct*100)}% — Cần ${cfg.passRate*100}%</div>
    </div>
    <p style="font-size:13px;color:#cbd5e1;text-align:center">${passed ? `Lên cấp: <b>${EDU_LABEL[cfg.next]}</b>` : 'Học lại để thi lại.'}</p>
    <button class="btn pri" onclick="closeModal();_exam=null;render();">OK</button>
  `);
  _exam = null;
  render();
}

    amount, rate: term.rate, term: term.id,
    startDay: time.day, matureDay: time.day + term.id,
    label: term.n
  });

// ═══════════ NPC SYSTEM ═══════════
function npcDailyTick() {
  if (!S || S.ended) return;
  const toRemove = [];
  for (const r of Object.values(S.rels)) {
    if (r.stage === 'married') continue;
    if (r.love <= -50) toRemove.push(r);
  }
  toRemove.forEach(r => {
    addLog(`💔 ${r.n} hủy kết bạn!`, 'bad');
    if (S.partnerId === r.id) { S.partnerId = null; syncLove(); }
    delete S.rels[r.id];
    apply('mental', -10);
  });
  for (const r of Object.values(S.rels)) {
    if (r.stage === 'married') continue;
    if (Math.random() < 0.15) {
      if (r.love > 70) { r.love = clamp(r.love + 1); addLog(`📩 ${r.av} ${r.n}: "Nhớ cậu quá!"`, 'love'); }
      else if (r.love < 20) addLog(`📩 ${r.av} ${r.n}: "Dạo này bận lắm hả?"`, 'info');
    }
    if ((r.stage === 'dating' || r.stage === 'crush') && !S._dated) r.love = clamp(r.love - 3);
  }
  S._dated = false;
  const partner = getPartner();
  if (partner?.expecting) {
    partner.expectingWeeks--;
    if (partner.expectingWeeks <= 0) birthChild();
  }
  for (const c of S.children) c.age++;
  if (Math.random() < 0.4) npcWeeklyTick();
}

function npcWeeklyTick() {
  const partner = getPartner();
  for (const a of NPC_POOL) {
    if (!S.npcRels[a.id]) S.npcRels[a.id] = {};
    for (const b of NPC_POOL) {
      if (a.id >= b.id) continue;
      if (!S.npcRels[a.id][b.id]) S.npcRels[a.id][b.id] = {aff: 0, status: 'none'};
      if (partner && (partner.pid === a.id || partner.pid === b.id)) continue;
      const rel = S.npcRels[a.id][b.id];
      if (rel.status === 'married') continue;
      if (!a.att.includes(b.g) || !b.att.includes(a.g)) continue;
      let comp = Math.max(0, 20 - Math.abs(a.age - b.age));
      for (const t of b.per) { if (a.likes.includes(t)) comp += 8; if (a.dis.includes(t)) comp -= 5; }
      comp += a.hob.filter(h => b.hob.includes(h)).length * 4;
      if (comp < 15) continue;
      rel.aff = Math.min(100, rel.aff + (comp >= 40 ? 3 : comp >= 25 ? 2 : 1));
      if (rel.status === 'none' && rel.aff >= 30) { rel.status = 'interested'; }
      if (rel.status === 'interested' && rel.aff >= 55) { rel.status = 'dating'; addLog(`💕 ${a.av} ${a.n} & ${b.av} ${b.n} hẹn hò!`, 'npc'); }
      if (rel.status === 'dating' && rel.aff >= 85 && Math.random() < 0.35) { rel.status = 'married'; addLog(`💒 ${a.av} ${a.n} & ${b.av} ${b.n} KẾT HÔN!`, 'npc'); }
    }
  }
}

function getNpcSched(npc) {
  const h = getTime().hour;
  let slot = 'work';
  if (h >= 22 || h < 6) slot = 'night';
  else if (h >= 12 && h < 14) slot = 'lunch';
  else if (h >= 14 && h < 18) slot = 'afternoon';
  else if (h >= 18 && h < 22) slot = 'evening';
  return LOCATIONS[npc.sched?.[slot] || npc.sched?.work || 'home'] || LOCATIONS.home;
}

function getNpcActivity(npc) {
  const h = getTime().hour;
  if (h >= 22 || h < 6) return 'đang ngủ';
  const loc = getNpcSched(npc);
  const verbs = {'Nhà':'ở nhà','Cà phê':'uống cafe','Quán ăn':'đang ăn','Gym':'tập gym','Công viên':'dạo chơi','Trường học':'dạy/học','Thư viện':'đọc sách','Bệnh viện':'làm việc','Ngân hàng':'giao dịch','Chợ':'mua sắm','Trung tâm TM':'mua sắm','Rạp phim':'xem phim','Bar / Pub':'uống bia','Spa':'thư giãn','Cắt tóc':'làm tóc','Công ty':'làm việc','Sòng bạc':'chơi bài','Karaoke':'hát','Đền / Chùa':'cầu nguyện','Thú cưng':'mua thú cưng'};
  return verbs[loc.n] || 'ở ' + loc.n;
}

// ═══════════ RELATIONSHIP ═══════════
function openRel() {
  const list = Object.values(S.rels);
  let html = `<h2>🤝 Quan hệ (${list.length})</h2>`;
  const partner = getPartner();
  if (partner) { html += `<h3>💗 Người thương</h3>`; html += renderRelCard(partner, true); }
  const others = list.filter(r => r.id !== S.partnerId);
  if (others.length) { html += `<h3>🌐 Người quen (${others.length})</h3>`; for (const r of others) html += renderRelCard(r, false); }
  if (!list.length) html += `<p style="font-size:12px;color:#94a3b8">Đi chơi ở các địa điểm để có cơ hội gặp gỡ NPC!</p>`;
  const marriages = [];
  for (const a of NPC_POOL) for (const b of NPC_POOL) {
    if (a.id >= b.id) continue;
    if (S.npcRels[a.id]?.[b.id]?.status === 'married') marriages.push({a, b});
  }

    html += `<h3>💒 NPC kết hôn với nhau</h3>`;

  }
  html += `<button class="btn sec" onclick="closeModal()">Đóng</button>`;
  showModal(html);
}

function renderRelCard(r, isPartner) {
  const shared = r.hob.filter(h => S.hobbies.includes(h));
  const stageLabel = {friend:'🤝 Bạn', close:'💛 Bạn thân', bestie:'💜 Bạn thân', brother:'🤜🤛 Chí cốt', crush:'💓 Để ý', dating:'💕 Hẹn hò', engaged:'💍 Đính hôn', married:'💒 Vợ chồng'}[r.stage] || r.stage;
  const npc = NPC_POOL.find(p => p.id === r.pid);
  const activity = npc ? getNpcActivity(npc) : '';
  const loc = npc ? getNpcSched(npc) : null;
  let acts = `<button class="btn sec" onclick="openChat('${r.id}')">💬 Chat</button>`;
  acts += `<button class="btn sec" onclick="hang('${r.id}')">Đi chơi</button>`;
  acts += `<button class="btn sec" onclick="gift('${r.id}')">Quà</button>`;
  if (r.g !== S.gender && r.stage !== 'married' && r.stage !== 'engaged') acts += `<button class="btn gold" onclick="dateWith('${r.id}')">Hẹn hò</button>`;
  if (isPartner && r.stage === 'dating') acts += `<button class="btn gold" onclick="openPropose()">💍 Cầu hôn</button>`;
  if (isPartner && r.stage === 'engaged') acts += `<button class="btn gold" onclick="openWedding()">💒 Cưới</button>`;
  if (isPartner && r.stage === 'married' && !r.expecting) acts += `<button class="btn gold" onclick="tryPregnant()">👶 Có con</button>`;
  acts += `<button class="btn danger" onclick="unfriend('${r.id}')">🚫 Hủy</button>`;
  // NPC relationships
  const npcRels = [];
  if (npc) {
    for (const other of NPC_POOL) {
      if (other.id === npc.id) continue;
      const a = npc.id < other.id ? npc.id : other.id;
      const b = npc.id < other.id ? other.id : npc.id;
      const rel = S.npcRels[a]?.[b];
      if (rel && rel.status !== 'none') npcRels.push(`${other.av} ${other.n} (${rel.status === 'married' ? '💒' : rel.status === 'dating' ? '💕' : '💓'})`);
    }
  }
  return `<div class="npc-card ${isPartner ? 'p' : ''} ${r.angry ? 'a' : ''} ${r.vip ? 'vip' : ''}">
    <div class="npc-h">
      <span class="av">${r.av}</span><span class="nm">${r.n}</span>
      <span class="bd">${r.age}t</span><span class="bd">${JOBS[r.job]?.n || r.job}</span>
      <span class="bd gold">${stageLabel}</span>
      ${r.vip ? '<span class="bd gold">👑 VIP</span>' : ''}
      ${r.angry ? '<span class="bd red">😡</span>' : ''}
    </div>
    <div style="font-size:10px;color:#38bdf8">📍 ${loc ? loc.e + ' ' + loc.n : ''} — ${activity}</div>
    <div style="font-size:10px;color:#94a3b8;margin-top:3px">💗 ${Math.round(r.love)} · 🤝 ${Math.round(r.bond)}</div>
    <div class="bond"><div class="bond-f ${r.love < 0 ? 'neg' : ''}" style="width:${Math.abs(r.love)}%"></div></div>
    ${shared.length ? `<div style="font-size:10px;color:#6ee7b7">Chung: ${shared.map(h => h).join(' ')}</div>` : ''}
    ${npcRels.length ? `<div style="font-size:10px;color:#f59e0b">Quen: ${npcRels.join(', ')}</div>` : ''}
    ${r.expecting ? `<div style="font-size:10px;color:#fbbf24">🤰 Mang thai</div>` : ''}
    <div class="npc-a">${acts}</div>
  </div>`;
}

function openChat(id) {
  const r = S.rels[id];
  if (!r) return;
  _chatId = id;
  if (!S.chats[id]) S.chats[id] = [];
  const log = S.chats[id];
  showModal(`
    <h2>💬 ${r.av} ${r.n}</h2>
    <p style="font-size:11px;color:#94a3b8">${r.age}t · ${JOBS[r.job]?.n || r.job} · ${r.per.join(', ')}</p>
    ${r.angry ? '<div class="warn">😡 Đang giận bạn</div>' : ''}
    <div class="chat" id="chatBox">
      ${log.length === 0 ? '<div class="msg sys">Bắt đầu trò chuyện... Hãy nhập tin nhắn tự do!</div>' : ''}
      ${log.map(m => `<div class="msg ${m.who}">${m.t}</div>`).join('')}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:6px">
      <input class="inp" id="chatInput" placeholder="Nhập tin nhắn..." style="margin-bottom:0" onkeypress="if(event.key==='Enter')sendChat()">
      <button class="btn pri" style="flex:0 0 70px" onclick="sendChat()">Gửi</button>
    </div>
    <div style="margin-bottom:6px">
      <button class="topic" onclick="quickChat('Xin chào!')">👋 Chào</button>
      <button class="topic" onclick="quickChat('Bạn khỏe không?')">❓ Hỏi thăm</button>
      <button class="topic" onclick="quickChat('Bạn dễ thương quá!')">💐 Khen</button>
      <button class="topic" onclick="quickChat('Mình thích bạn!')">💗 Tỏ tình</button>
      <button class="topic" onclick="quickChat('Bạn nghĩ sao về tình yêu?')">💭 Tình yêu</button>
    </div>
    <button class="btn sec" onclick="openRel()">← Quay lại</button>
  `);
  setTimeout(() => { const b = document.getElementById('chatBox'); if (b) b.scrollTop = b.scrollHeight; }, 50);
}

function quickChat(text) {
  document.getElementById('chatInput').value = text;
  sendChat();
}

function sendChat() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  const r = S.rels[_chatId];
  if (!r) return;
  const log = S.chats[_chatId];
  log.push({who: 'you', t: text});
  // Analyze intent
  const lower = text.toLowerCase();
  let reply = '', loveGain = 0, bondGain = 0;
  if (r.angry) {
    reply = '"..." (im lặng, có vẻ vẫn giận)';
    loveGain = -2;
    if (lower.includes('xin lỗi') || lower.includes('sorry')) {
      r.angry = false;
      reply = '"...Thôi được rồi, bỏ qua."';
      loveGain = 5; bondGain = 5;
    }
  } else {
    // Detect intent
    if (lower.includes('chào') || lower.includes('hi') || lower.includes('hello') || lower.includes('xin chào')) {
      reply = r.per.includes('vuitinh') ? '"Ơ cậu đến rồi!"' : r.per.includes('tramtinh') ? '"Ừ, chào cậu."' : '"Chào cậu!"';
      loveGain = 1; bondGain = 2;
    } else if (lower.includes('khỏe') || lower.includes('thế nào') || lower.includes('sao rồi')) {
      reply = r.per.includes('quantam') ? '"Ngày tớ bình thường, còn cậu?"' : '"Cũng ổn."';
      loveGain = 2; bondGain = 2;
    } else if (lower.includes('dễ thương') || lower.includes('xinh') || lower.includes('đẹp') || lower.includes('khen') || lower.includes('giỏi')) {
      reply = r.per.includes('langman') ? '"Cậu làm tớ ngại quá..."' : '"Cảm ơn cậu!"';
      loveGain = 4; bondGain = 2;
    } else if (lower.includes('yêu') || lower.includes('thích') || lower.includes('tỏ tình') || lower.includes('crush')) {
      if (r.g !== S.gender) {
        if (r.love >= 60) {
          reply = r.per.includes('langman') ? '"Tớ cũng thích cậu!"' : '"Tớ... cũng có cảm tình."';
          loveGain = 10;
          if (r.stage === 'friend' || r.stage === 'close') { r.stage = 'crush'; }
        } else { reply = '"Chúng ta mới quen thôi mà..."'; loveGain = -3; }
      } else { reply = '"Chúng ta là bạn tốt mà!"'; bondGain = 3; }
    } else if (lower.includes('tình yêu') || lower.includes('yêu là gì')) {
      reply = r.views?.love || '"Tình yêu là điều kỳ diệu."';
      loveGain = 3; bondGain = 3;
    } else if (lower.includes('tiền') || lower.includes('giàu') || lower.includes('lương')) {
      reply = r.views?.money || '"Tiền không phải tất cả."';
      bondGain = 3;
    } else if (lower.includes('sự nghiệp') || lower.includes('công việc') || lower.includes('làm')) {
      reply = r.views?.career || '"Công việc cũng ổn."';
      bondGain = 3;
    } else if (lower.includes('gia đình') || lower.includes('bố mẹ') || lower.includes('con')) {
      reply = r.views?.family || '"Gia đình quan trọng lắm."';
      loveGain = 3; bondGain = 4;
    } else if (lower.includes('buồn') || lower.includes('mệt') || lower.includes('chán')) {
      reply = r.per.includes('quantam') ? '"Có tớ đây, kể tớ nghe đi."' : '"Cố lên nhé!"';
      loveGain = 2; bondGain = 5;
    } else if (lower.includes('cảm ơn')) {
      reply = '"Không có gì đâu!"'; bondGain = 2;
    } else if (lower.includes('tạm biệt') || lower.includes('bye')) {
      reply = '"Tạm biệt, hẹn gặp lại!"'; bondGain = 1;
    } else {
      // Random response based on personality
      const rand = [
        '"Hmm, thú vị đấy."',
        '"Ừ ừ, tớ hiểu."',
        '"Cậu nói đúng."',
        '"Vậy à, kể thêm đi!"',
        '"Tớ không nghĩ vậy lắm..."',
        '"Hay đấy!"'
      ];
      reply = rand[Math.floor(Math.random() * rand.length)];
      bondGain = 1;
    }
  }
  if (loveGain) r.love = clamp(r.love + loveGain);
  if (bondGain) r.bond = clamp(r.bond + bondGain);
  apply('mental', 2);
  apply('energy', -5);
  S.gameMinutes += 15;
  processTime();
  log.push({who: 'them', t: reply});
  if (log.length > 30) log.splice(0, log.length - 30);
  addLog(`💬 Chat với ${r.n}`, 'love');
  updateStage(r);
  render();
  openChat(_chatId);
}

function updateStage(r) {
  if (['dating','engaged','married'].includes(r.stage)) return;
  if (r.g === S.gender) { if (r.bond >= 90) r.stage = 'brother'; else if (r.bond >= 70) r.stage = 'close'; else r.stage = 'friend'; }
  else { if (r.love >= 60) r.stage = 'crush'; else if (r.bond >= 70) r.stage = 'close'; else r.stage = 'friend'; }
}

function hang(id) {
  const r = S.rels[id]; if (!r) return;
  S.gameMinutes += 60; r.bond = clamp(r.bond + 5);
  if (r.g !== S.gender) r.love = clamp(r.love + 3);
  apply('mental', 5); apply('energy', -5);
  addLog(`🤝 Đi chơi với ${r.n}`, 'love');
  processTime(); render(); openRel();
}

function gift(id) {
  const r = S.rels[id]; if (!r) return;
  if (S.st.money < 500) { notify('❌ Cần 500đ', 'bad'); return; }
  apply('money', -500); S.gameMinutes += 30;
  r.love = clamp(r.love + 12); r.bond = clamp(r.bond + 3);
  apply('mental', 3);
  addLog(`🎁 Tặng quà cho ${r.n}`, 'love');
  processTime(); render(); openRel();
}

function dateWith(id) {
  const r = S.rels[id]; if (!r) return;
  const isG = r.per.includes('galant');
  let cost = 500;
  if (isG) cost = 0;
  if (S.st.money < cost) { notify('❌ Không đủ tiền', 'bad'); return; }
  S.gameMinutes += 120; if (cost) apply('money', -cost);
  r.love = clamp(r.love + 12); r.bond = clamp(r.bond + 4);
  apply('mental', 10); apply('energy', -5); updateStage(r); S._dated = true;
  addLog(`💗 Hẹn hò với ${r.n}`, 'love');
  processTime(); render(); openRel();
}

function unfriend(id) {
  const r = S.rels[id]; if (!r) return;
  if (!confirm(`Hủy kết bạn với ${r.n}?`)) return;
  if (S.partnerId === id) { S.partnerId = null; syncLove(); }
  delete S.rels[id];
  apply('mental', -8);
  addLog(`💔 Hủy kết bạn với ${r.n}`, 'bad');
  closeModal(); render();
}

function openPropose() {
  const p = getPartner(); if (!p || p.stage !== 'dating') return;
  const chance = p.love < 70 ? 0 : p.love >= 95 ? 1 : (p.love - 70) / 25;
  showModal(`
    <h2>💍 Cầu hôn ${p.n}</h2>
    <div style="background:#0f172a;padding:10px;border-radius:8px;font-size:12px;margin:10px 0">
      Tình cảm: ${Math.round(p.love)}/100 · Nhẫn: 20.000đ<br>
      Cơ hội: <b style="color:${chance >= 0.7 ? '#22c55e' : chance >= 0.3 ? '#facc15' : '#ef4444'}">${Math.round(chance*100)}%</b>
    </div>
    <button class="btn gold" ${S.st.money >= 20000 ? '' : 'disabled'} onclick="doPropose()">Cầu hôn (20.000đ)</button>
    <button class="btn sec" onclick="openRel()">Để sau</button>
  `);
}

function doPropose() {
  const p = getPartner(); if (!p || S.st.money < 20000) return;
  const chance = p.love < 70 ? 0 : p.love >= 95 ? 1 : (p.love - 70) / 25;
  apply('money', -20000);
  if (Math.random() < chance) {
    p.stage = 'engaged'; p.love = clamp(p.love + 15); syncLove();
    apply('mental', 20); addLog(`💍 ${p.n} đồng ý!`, 'love'); notify(`💍 ${p.n} đồng ý!`, 'good');
  } else {
    p.love = clamp(p.love - 15); syncLove(); p.angry = true;
    addLog(`💔 ${p.n} từ chối.`, 'bad'); notify('💔 Bị từ chối!', 'bad');
  }
  render(); openRel();
}

function openWedding() {
  const p = getPartner(); if (!p || p.stage !== 'engaged') return;
  showModal(`
    <h2>💒 Đám cưới</h2>
    <p>Chi phí: <b>50.000đ</b></p>
    <button class="btn gold" ${S.st.money >= 50000 ? '' : 'disabled'} onclick="doWedding()">Tổ chức</button>
    <button class="btn sec" onclick="openRel()">Để sau</button>
  `);
}

function doWedding() {
  const p = getPartner(); if (!p || p.stage !== 'engaged' || S.st.money < 50000) return;
  apply('money', -50000); p.stage = 'married'; p.love = clamp(p.love + 15); syncLove();
  apply('mental', 30); addLog(`💒 Kết hôn với ${p.n}!`, 'love'); notify('💒 Chúc mừng!', 'good');
  render(); openRel();
}

function tryPregnant() {
  const p = getPartner(); if (!p || p.stage !== 'married' || p.expecting) return;
  if (S.st.money < 5000) { notify('❌ Cần 5.000đ', 'bad'); return; }
  apply('money', -5000);
  if (Math.random() < 0.5) { p.expecting = true; p.expectingWeeks = 3; addLog(`🤰 ${p.n} mang thai!`, 'love'); notify('🤰 Có tin vui!', 'good'); }
  else addLog('Chưa có tin vui.', 'info');
  render();
}

function birthChild() {
  const p = getPartner(); if (!p) return;
  p.expecting = false;
  const gender = Math.random() < 0.5 ? 'nam' : 'nu';
  const names = ['An','Bình','Chi','Duy','Hân','Khang','Linh','Minh','Nam','Phúc','Quỳnh','Trang'];
  const name = names[Math.floor(Math.random() * names.length)];
  S.children.push({id: 'c' + Date.now(), name, gender, age: 0, bond: 60});
  addLog(`👶 Bé ${name} chào đời!`, 'child'); notify(`👶 Bé ${name} chào đời!`, 'good');
  apply('mental', 25); p.love = clamp(p.love + 15); syncLove();
}

function openChildren() {
  if (!S.children.length) { showModal(`<h2>👶 Con cái</h2><p>Chưa có con.</p><button class="btn sec" onclick="closeModal()">Đóng</button>`); return; }
  showModal(`
    <h2>👶 Con cái (${S.children.length})</h2>
    ${S.children.map(c => `
      <div class="npc-card c">
        <div class="npc-h"><span class="av">${c.age < 12 ? '👶' : c.gender === 'nam' ? '👦' : '👧'}</span><span class="nm">Bé ${c.name}</span><span class="bd">${c.gender === 'nam' ? 'Trai' : 'Gái'}</span><span class="bd blue">${c.age} ngày</span></div>
        <div class="bond"><div class="bond-f" style="width:${c.bond}%"></div></div>
      </div>
    `).join('')}
    <button class="btn sec" onclick="closeModal()">Đóng</button>
  `);
}

function openJobs() {
  const pr = EDU_RANK[S.edu];
  const sorted = Object.entries(JOBS).sort((a, b) => a[1].w - b[1].w);
  showModal(`
    <h2>💼 Chọn nghề</h2>
    <p style="font-size:11px;color:#94a3b8">Học vấn: ${EDU_LABEL[S.edu]} · Học cao → lương cao</p>
    <div style="max-height:60vh;overflow-y:auto">
    ${sorted.map(([k, j]) => {
      const req = j.edu ? EDU_RANK[j.edu] : 0;
      const locked = pr < req;
      const cur = S.job === k;
      return `<button class="btn ${cur ? 'pri' : 'sec'}" style="text-align:left;padding:8px 12px;margin-bottom:4px" ${locked || cur ? 'disabled' : ''} onclick="changeJob('${k}')">
        ${j.i} ${j.n} — ${fmt(j.w)}/ngày ${j.edu ? `[${EDU_LABEL[j.edu]}]` : ''}
        ${locked ? `<br><small style="color:#fca5a5">🔒 Cần ${EDU_LABEL[j.edu]}</small>` : ''}
        ${cur ? '<br><small>Đang làm</small>' : ''}
      </button>`;
    }).join('')}
    </div>
    <button class="btn sec" style="margin-top:8px" onclick="closeModal()">Đóng</button>
  `);
}

function changeJob(k) {
  const j = JOBS[k]; if (!j) return;
  if (j.edu && EDU_RANK[S.edu] < EDU_RANK[j.edu]) return;
  S.job = k;
  addLog(`Chuyển sang: ${j.i} ${j.n}`, 'info');
  closeModal(); render();
}

function openAssets() {
  const renderList = (title, list, current, type) => `
    <h3 style="color:#f472b6;margin-top:12px">${title}</h3>
    ${list.map(item => {
      const isOwned = item.id === current;
      const canBuy = S.st.money >= item.p && !isOwned;
      let stats = '';
      if (type === 'house') stats = `+${item.m} Tinh thần/ngày`;
      if (type === 'car') stats = `+${item.tr}% giá trị`;
      if (type === 'biz') stats = `+${fmt(item.inc)}/tuần`;
      return `<div class="asset-card">
        <div><h4>${item.n} ${isOwned ? '✅' : ''}</h4><p>${stats}</p></div>
        <div style="text-align:right">
          <div style="font-size:12px;color:#facc15;font-weight:bold;margin-bottom:4px">${fmt(item.p)}</div>
          ${isOwned ? '<span class="bd green">Đang dùng</span>' : `<button class="btn sec" style="padding:4px 8px;font-size:11px" ${canBuy ? '' : 'disabled'} onclick="buyAsset('${type}','${item.id}',${item.p})">Mua</button>`}
        </div>
      </div>`;
    }).join('')}
  `;
  showModal(`
    <h2>🏠 Tài sản & Kinh doanh</h2>
    <p style="font-size:12px;color:#94a3b8">Số dư: <b>${fmt(S.st.money)}</b> · Prestige: ✨ ${prestige()}</p>
    ${renderList('🏠 Nhà cửa', HOUSES, S.assets.house, 'house')}
    ${renderList('🚗 Phương tiện', CARS, S.assets.car, 'car')}
    ${renderList('🏢 Kinh doanh', BUSINESS, S.assets.business, 'biz')}
    <button class="btn sec" style="margin-top:12px" onclick="closeModal()">Đóng</button>
  `);
}

function buyAsset(type, id, price) {
  if (S.st.money < price) return;
  apply('money', -price);
  S.assets[type] = id;
  addLog(`🛍️ Đã mua tài sản!`, 'good');
  render(); openAssets();
}

// ═══════════ RENDER ═══════════
function render() {
  if (!S || !S.gender) return;
  const t = getTime();
  document.getElementById('clock').textContent = `${pad2(t.hour)}:${pad2(t.minute)}`;
  document.getElementById('dayInfo').textContent = `📅 ${t.dwFull} · Ngày ${t.day}`;
  document.getElementById('ageInfo').textContent = `🎂 ${S.age} tuổi`;
  document.getElementById('period').textContent = t.periodLabel;
  document.getElementById('namePill').textContent = `👤 ${S.name}`;
  document.getElementById('moneyPill').textContent = `💰 ${fmt(S.st.money)}`;
  document.getElementById('jobPill').textContent = `${JOBS[S.job].i} ${JOBS[S.job].n}`;
  const eduStr = S.edu === 'ts' ? EDU_LABEL[S.edu] : `${EDU_LABEL[S.edu]} (${S.eduProgress}/${EXAM_REQ[S.edu]})`;
  document.getElementById('eduPill').textContent = eduStr;
  const p = getPartner();
  const pp = document.getElementById('partnerPill');
  if (p) { pp.style.display = ''; pp.textContent = `${p.av} ${p.n}`; } else pp.style.display = 'none';
  // Stats
  const defs = [
    {k:'health', l:'❤️ Sức khỏe', c:'#ef4444', warnLow:20},
    {k:'energy', l:'⚡ Năng lượng', c:'#facc15', warnLow:20, warnMid:50},
    {k:'mental', l:'🧠 Tinh thần', c:'#a78bfa', warnLow:30},
    {k:'skill', l:'📚 Kỹ năng', c:'#38bdf8'},
    {k:'love', l:'💗 Tình cảm', c:'#ec4899'},
    {k:'passion', l:'🔥 Đam mê', c:'#fb923c'}
  ];
  document.getElementById('statsGrid').innerHTML = defs.map(d => {
    const v = S.st[d.k];
    let cls = 'stat';
    if (d.warnLow && v < d.warnLow) cls += ' danger';
    else if ((d.warnMid && v < d.warnMid) || (d.warnLow && v < d.warnLow * 2)) cls += ' warn';
    return `<div class="${cls}"><div class="lbl"><span>${d.l}</span><span>${Math.round(v)}</span></div><div class="bar"><div class="fill" style="width:${v}%;background:${d.c}"></div></div></div>`;
  }).join('');
  document.getElementById('locationsGrid').innerHTML = Object.entries(LOCATIONS).map(([k, loc]) => {
    const active = _currentLoc === k;
    return `<button class="loc-btn ${active ? 'active' : ''}" onclick="selectLocation('${k}')"><span class="em">${loc.e}</span><span class="nm">${loc.n}</span><span class="hint">${loc.acts.length} HĐ</span></button>`;
  }).join('');
  document.getElementById('locCount').textContent = `${Object.keys(LOCATIONS).length} địa điểm`;
  if (_currentLoc) {
    const loc = LOCATIONS[_currentLoc];
    document.getElementById('actsGrid').innerHTML = loc.acts.map(a => {
      const reqs = checkReq(a);
      const disabled = reqs.length > 0;
      const hours = a.t >= 60 ? (a.t / 60).toFixed(1).replace('.0', '') + 'h' : a.t + 'p';
      const costStr = a.cost > 0 ? `-${fmt(a.cost)}` : (a.ef?.money === 'wage' ? `+${fmt(JOBS[S.job].w)}` : 'Miễn phí');
      const isExam = a.special === 'exam';
      const enCost = (a.id.startsWith('sleep') || a.id === 'nap') ? '' : ' · -5⚡';
      return `<button class="act-btn ${isExam ? 'exam' : ''}" ${disabled ? 'disabled' : ''} onclick="doActivity('${_currentLoc}','${a.id}')">
        <span class="nm">${a.n}</span>
        <div class="meta"><span class="time">⏱ ${hours}</span><span class="cost">${costStr}</span></div>
        <div class="meta"><span style="color:#f87171">${enCost}</span></div>
        ${disabled ? `<div class="meta"><span class="req">⚠️ ${reqs[0]}</span></div>` : (a.addsProgress ? `<div class="meta"><span style="color:#86efac">+${a.addsProgress} buổi học</span></div>` : '')}
      </button>`;
    }).join('');
  }
  document.getElementById('log').innerHTML = S.log.slice(0, 40).map(e => `<div class="e ${e.t}"><b>${e.dw} ${e.time}:</b> ${e.m}</div>`).join('');
  document.getElementById('logCount').textContent = `${S.log.length} sự kiện`;
  save();
}

// ═══════════ MODAL / NOTIFY ═══════════
function showModal(h) { document.getElementById('mbox').innerHTML = h; document.getElementById('modal').classList.add('on'); }
function closeModal() { document.getElementById('modal').classList.remove('on'); }
document.getElementById('modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
let _notifTimer = null;
function notify(text, type = '') {
  const n = document.getElementById('notif');
  n.textContent = text;
  n.className = 'notification on ' + type;
  clearTimeout(_notifTimer);
  _notifTimer = setTimeout(() => n.className = 'notification', 2500);
}

// ═══════════ SAVE / LOAD ═══════════
function save() {
  try { localStorage.setItem('mylife_save', JSON.stringify({S, _currentLoc, _lastDay, _lastWeek})); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem('mylife_save');
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.S || !d.S.gender) return false;
    S = d.S; _currentLoc = d._currentLoc || 'home';
    _lastDay = d._lastDay || 0; _lastWeek = d._lastWeek || 0;
    if (!S.bankDeposits) S.bankDeposits = [];
    if (!S.pets) S.pets = [];
    if (!S.warnings) S.warnings = {};
    return true;
  } catch (e) { return false; }
}

// ═══════════ START SCREEN ═══════════
const HOBBIES = {
  doc_sach: {n:'Đọc sách', e:'📚'}, am_nhac: {n:'Âm nhạc', e:'🎵'},
  the_thao: {n:'Thể thao', e:'⚽'}, game: {n:'Game', e:'🎮'},
  du_lich: {n:'Du lịch', e:'✈️'}, nau_an: {n:'Nấu ăn', e:'🍳'},
  nghe_thuat: {n:'Nghệ thuật', e:'🎨'}, ca_phe: {n:'Cà phê', e:'☕'}
};

function showStart() {
  window._g = null; window._h = [];
  showModal(`
    <h2>Chào mừng đến My Life</h2>
    <p>Bạn 18 tuổi, bắt đầu cuộc sống tự lập!</p>
    <h3>Giới tính</h3>
    <div class="opt">
      <button onclick="pickG(this,'nam')">👨 Nam</button>
      <button onclick="pickG(this,'nu')">👩 Nữ</button>
      <button onclick="pickG(this,'khac')">🧑 Khác</button>
    </div>
    <h3>Tên</h3>
    <input class="inp" id="nm" maxlength="20" placeholder="Nhập tên...">
    <h3>Sở thích (2-3)</h3>
    <div class="opt" id="hobbies">${Object.entries(HOBBIES).map(([k, v]) => `<button onclick="pickH(this,'${k}')">${v.e} ${v.n}</button>`).join('')}</div>
    <p style="font-size:11px;color:#facc15;margin-top:12px;text-align:center">📚 Thi lên cấp: 10/20/30 câu tùy cấp<br>⚡ Mỗi hoạt động tốn 5 năng lượng · Năng lượng < 20 → nhập viện</p>
    <button class="btn pri" style="margin-top:12px" onclick="startGame()">Bắt đầu cuộc đời</button>
  `);
}
function pickG(b, g) { window._g = g; b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); }
function pickH(b, h) { const i = window._h.indexOf(h); if (i >= 0) { window._h.splice(i, 1); b.classList.remove('sel'); } else if (window._h.length < 3) { window._h.push(h); b.classList.add('sel'); } }
function startGame() {
  if (!window._g) return alert('Chọn giới tính.');
  if (window._h.length < 2) return alert('Chọn ít nhất 2 sở thích.');
  S = newState();
  S.gender = window._g;
  S.name = (document.getElementById('nm').value || '').trim() || 'Bạn';
  S.hobbies = [...window._h];
  _currentLoc = 'home'; _lastDay = 1; _lastWeek = 0;
  addLog(`Chào mừng ${S.name}! Bạn 18 tuổi.`, 'good');
  addLog(`💡 Học ở Trường để lên cấp, phải thi đỗ!`, 'info');
  addLog(`💡 Thời gian tự chạy. Năng lượng < 20 sẽ nhập viện!`, 'warn');
  closeModal(); render(); selectLocation('home');
}

// ═══════════ GAME LOOP ═══════════
function gameLoop() {
  function tick() {
    if (S && S.gender && !S.ended) {
      const now = Date.now();
      const dt = (now - _lastTick) / 1000;
      _lastTick = now;
      if (dt > 0 && dt < 5) {
        S.gameMinutes += dt * TICK;
        processTime();
        const t = getTime();
        document.getElementById('clock').textContent = `${pad2(t.hour)}:${pad2(t.minute)}`;
        document.getElementById('dayInfo').textContent = `📅 ${t.dwFull} · Ngày ${t.day}`;
        document.getElementById('ageInfo').textContent = `🎂 ${S.age} tuổi`;
        document.getElementById('period').textContent = t.periodLabel;
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

// ═══════════ INIT ═══════════
function init() {
  if (!load()) { S = newState(); showStart(); }
  else {
    if (!S.assets) S.assets = {house: 'none', car: 'none', business: 'none'};
    if (!S.children) S.children = [];
    if (!S.pets) S.pets = [];
    if (!S.npcRels) S.npcRels = {};
    if (!S.chats) S.chats = {};
    if (!S.bankDeposits) S.bankDeposits = [];
    render();
  }
  _lastTick = Date.now();
  gameLoop();
}

document.getElementById('relBtn').onclick = openRel;
document.getElementById('petBtn').onclick = openPetList;
document.getElementById('bankBtn').onclick = openSavingsList;
document.getElementById('jobBtn').onclick = openJobs;
document.getElementById('assetsBtn').onclick = openAssets;
document.getElementById('resetBtn').onclick = () => {
  if (!confirm('Chơi lại từ đầu?')) return;
  localStorage.removeItem('mylife_save');
  location.reload();
};

Object.assign(window, {
  selectLocation, doActivity, openRel, openChat, sendChat, quickChat,
  hang, gift, dateWith, unfriend, openPropose, doPropose, openWedding, doWedding,
  tryPregnant, openChildren, openJobs, changeJob, openAssets, buyAsset,
  showModal, closeModal, pickG, pickH, startGame,
  startExam, answerExam, nextExamQuestion, renderExamResult,
  openDepositMenu, doDeposit, openSavingsList, openPetShop, buyPet, openPetList
});

init();
</script>
